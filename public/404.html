<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Page Not Found (404) | Pawcade Games</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="The page you are looking for does not exist on Pawcade Games. Head back to play free browser games." />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: 'Fredoka';
        font-weight: 300 700;
        font-display: optional;
        src: url('/fonts/fredoka-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Nunito';
        font-weight: 200 1000;
        font-display: optional;
        src: url('/fonts/nunito-latin.woff2') format('woff2');
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        font-family: 'Nunito', system-ui, sans-serif;
        color: #1b2a4b;
        background: #cbe7ff;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: #fff;
        border-radius: 28px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 5px 0 rgb(27 60 110 / 0.16), 0 12px 22px -10px rgb(27 60 110 / 0.4);
      }
      .paw { font-size: 56px; margin-bottom: 12px; }
      .code { font-size: 14px; font-weight: 800; color: #d9500a; margin-bottom: 4px; }
      h1 { font-family: 'Fredoka', 'Nunito', system-ui, sans-serif; font-weight: 600; font-size: 30px; line-height: 1.15; margin-bottom: 8px; }
      p { font-size: 15px; line-height: 1.55; color: #4b5b7c; margin-bottom: 22px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        height: 48px; padding: 0 24px; border-radius: 16px;
        background: #ff6b1a; color: #fff; text-decoration: none;
        font-family: 'Fredoka', 'Nunito', system-ui, sans-serif; font-weight: 600; font-size: 17px;
        box-shadow: 0 4px 0 #c2470a;
      }
      .btn:active { transform: translateY(4px); box-shadow: none; }
      .picks { margin-top: 24px; padding-top: 18px; border-top: 1px solid #d9e7f5; }
      .picks-title { font-size: 13px; font-weight: 700; color: #8796b2; margin-bottom: 10px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .grid a {
        display: block; padding: 10px; border-radius: 14px;
        background: #cbe7ff; color: #1b2a4b; text-decoration: none; font-weight: 800; font-size: 14px;
      }
      .grid a:hover { background: #b3dafc; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="paw" aria-hidden="true">🐾</div>
      <div class="code">Error 404</div>
      <h1>This page wandered off</h1>
      <p>We looked all over the barn and couldn't find it. Pick a game instead!</p>
      <a href="/" class="btn">All games</a>
      <div class="picks">
        <div class="picks-title">Popular right now</div>
        <div class="grid">
          <a href="/games/dog-parking/">Dog Parking</a>
          <a href="/games/farm-block-blast/">Farm Block Blast</a>
          <a href="/games/sheep-cart-jam/">Sheep Cart Jam</a>
          <a href="/games/farm-mini-mart/">Farm Mini Mart</a>
        </div>
      </div>
    </div>
  </body>
</html>
