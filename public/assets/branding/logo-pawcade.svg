<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <linearGradient id="pawcade-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="pawcade-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="pawcade-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f97316" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Gamepad / Paw Hybrid Icon -->
  <g filter="url(#pawcade-glow)" transform="translate(4, 4)">
    <!-- Gamepad Outer Body -->
    <rect x="0" y="4" width="48" height="40" rx="14" fill="url(#pawcade-orange-grad)" />
    <!-- Gamepad Inner Screen Surface -->
    <rect x="3" y="7" width="42" height="34" rx="11" fill="#090d16" />

    <!-- Cute Paw Pads (Arcade Buttons) -->
    <!-- Main Big Center Pad (DPad Center) -->
    <ellipse cx="24" cy="27" rx="8" ry="6.5" fill="url(#pawcade-orange-grad)" />
    <!-- 4 Toe Pads / Arcade Action Buttons -->
    <circle cx="14" cy="16" r="3.2" fill="#fbbf24" />
    <circle cx="21" cy="13" r="3.5" fill="#f97316" />
    <circle cx="27" cy="13" r="3.5" fill="#f97316" />
    <circle cx="34" cy="16" r="3.2" fill="#fbbf24" />
  </g>

  <!-- Brand Wordmark Typography -->
  <g transform="translate(62, 0)">
    <!-- Primary Brand Name "PAWCADE" -->
    <text x="0" y="34" font-family="'Fredoka', 'Nunito', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5" fill="#ffffff">
      PAW<tspan fill="url(#pawcade-orange-grad)">CADE</tspan>
    </text>

    <!-- Genre / Market Descriptor Pill -->
    <rect x="118" y="14" width="56" height="20" rx="10" fill="url(#pawcade-purple-grad)" opacity="0.95" />
    <text x="146" y="28" font-family="'Nunito', system-ui, sans-serif" font-weight="800" font-size="10" letter-spacing="1" fill="#ffffff" text-anchor="middle">
      GAMES
    </text>
  </g>
</svg>
