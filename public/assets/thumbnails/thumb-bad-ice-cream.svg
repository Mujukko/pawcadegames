<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIce" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <radialGradient id="heroIce" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </radialGradient>

    <linearGradient id="iceCubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgIce)" />

  <!-- Checkerboard icy floor -->
  <g opacity="0.3">
    <rect x="50" y="80" width="100" height="100" fill="#0284c7" />
    <rect x="250" y="80" width="100" height="100" fill="#0284c7" />
    <rect x="450" y="80" width="100" height="100" fill="#0284c7" />
    <rect x="150" y="180" width="100" height="100" fill="#0284c7" />
    <rect x="350" y="180" width="100" height="100" fill="#0284c7" />
    <rect x="50" y="280" width="100" height="100" fill="#0284c7" />
    <rect x="250" y="280" width="100" height="100" fill="#0284c7" />
  </g>

  <!-- Ice Blocks -->
  <rect x="80" y="160" width="64" height="64" rx="10" fill="url(#iceCubeGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#iceGlow)" />
  <rect x="80" y="235" width="64" height="64" rx="10" fill="url(#iceCubeGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#iceGlow)" />
  <rect x="155" y="235" width="64" height="64" rx="10" fill="url(#iceCubeGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#iceGlow)" />

  <!-- Sneaking Fox Enemy -->
  <g transform="translate(480, 180) scale(-1, 1)">
    <circle cx="0" cy="0" r="32" fill="#ea580c" />
    <polygon points="12,-10 40,0 12,10" fill="#ea580c" />
    <circle cx="40" cy="0" r="4" fill="#0f172a" />
    <polygon points="-12,-24 -6,-46 6,-24" fill="#9a3412" />
    <circle cx="8" cy="-6" r="5" fill="#fef08a" />
    <circle cx="10" cy="-6" r="2.5" fill="#0f172a" />
  </g>

  <!-- Juicy Fruits Floating -->
  <!-- Strawberry -->
  <g transform="translate(380, 110)">
    <circle cx="0" cy="4" r="22" fill="#ef4444" />
    <polygon points="-14,-14 0,-24 14,-14 0,-8" fill="#22c55e" />
    <circle cx="-6" cy="2" r="1.5" fill="#fef08a" />
    <circle cx="6" cy="2" r="1.5" fill="#fef08a" />
    <circle cx="0" cy="10" r="1.5" fill="#fef08a" />
  </g>

  <!-- Banana -->
  <g transform="translate(180, 90) rotate(25)">
    <path d="M -20 -10 A 30 30 0 0 0 20 15" stroke="#facc15" stroke-width="14" stroke-linecap="round" fill="none" />
  </g>

  <!-- Frost Breath Beam from Hero -->
  <path d="M 270 200 L 160 215 L 270 230" fill="rgba(224, 242, 254, 0.4)" filter="url(#iceGlow)" />

  <!-- Frosty Vanilla Ice Cream Hero -->
  <g transform="translate(290, 215)">
    <!-- Shadow -->
    <ellipse cx="0" cy="46" rx="38" ry="10" fill="rgba(0,0,0,0.3)" />

    <!-- Body -->
    <circle cx="0" cy="0" r="46" fill="url(#heroIce)" />

    <!-- Earmuffs -->
    <circle cx="-42" cy="-4" r="15" fill="#ec4899" />
    <circle cx="42" cy="-4" r="15" fill="#ec4899" />
    <path d="M -42 -4 A 42 42 0 0 1 42 -4" stroke="#db2777" stroke-width="5" fill="none" />

    <!-- Eyes (Focused) -->
    <circle cx="-14" cy="-6" r="6" fill="#0f172a" />
    <circle cx="14" cy="-6" r="6" fill="#0f172a" />
    <circle cx="-16" cy="-8" r="2.5" fill="#ffffff" />
    <circle cx="12" cy="-8" r="2.5" fill="#ffffff" />

    <!-- Rosy Cheeks -->
    <circle cx="-22" cy="8" r="5" fill="rgba(244, 114, 182, 0.7)" />
    <circle cx="22" cy="8" r="5" fill="rgba(244, 114, 182, 0.7)" />

    <!-- Blowing O Mouth -->
    <circle cx="0" cy="8" r="7" fill="#0284c7" />
    <circle cx="0" cy="8" r="4" fill="#bae6fd" />
  </g>

  <!-- Title Badge -->
  <rect x="25" y="325" width="220" height="50" rx="12" fill="#082f49" opacity="0.9" stroke="#38bdf8" stroke-width="2" />
  <text x="135" y="348" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">BAD ICE CREAM</text>
  <text x="135" y="365" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">FROSTY BARNYARD</text>
</svg>
