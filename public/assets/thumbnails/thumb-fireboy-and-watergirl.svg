<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCoop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#431407" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <radialGradient id="pupGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>

    <radialGradient id="kittyGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>

    <filter id="fireShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f97316" flood-opacity="0.8" />
    </filter>

    <filter id="waterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgCoop)" />

  <!-- Temple Pillars and Arch -->
  <rect x="0" y="320" width="600" height="80" fill="#1e293b" />
  <rect x="0" y="316" width="600" height="6" fill="#15803d" />

  <!-- Lava Pool Left -->
  <rect x="60" y="322" width="160" height="18" fill="#ea580c" filter="url(#fireShadow)" rx="4" />
  <!-- Water Pool Right -->
  <rect x="380" y="322" width="160" height="18" fill="#0284c7" filter="url(#waterShadow)" rx="4" />

  <!-- Temple Sanctuary Doors in Background -->
  <g transform="translate(250, 160)">
    <!-- Fire Door -->
    <rect x="-30" y="0" width="45" height="75" fill="#1e293b" stroke="#f97316" stroke-width="3" rx="4" />
    <path d="M -7 25 Q -15 10 -8 40" stroke="#f59e0b" stroke-width="3" fill="none" />
    <text x="-7" y="65" font-size="14" text-anchor="middle" fill="#f59e0b">🔥</text>

    <!-- Water Door -->
    <rect x="35" y="0" width="45" height="75" fill="#1e293b" stroke="#38bdf8" stroke-width="3" rx="4" />
    <path d="M 58 25 Q 50 10 57 40" stroke="#38bdf8" stroke-width="3" fill="none" />
    <text x="58" y="65" font-size="14" text-anchor="middle" fill="#38bdf8">💧</text>
  </g>

  <!-- Floating Gems -->
  <polygon points="140,140 155,160 140,180 125,160" fill="#f59e0b" filter="url(#fireShadow)" />
  <polygon points="460,140 475,160 460,180 445,160" fill="#38bdf8" filter="url(#waterShadow)" />

  <!-- Sun Pup Hero (Left) -->
  <g transform="translate(160, 260)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="54" fill="rgba(249, 115, 22, 0.2)" />
    <!-- Body -->
    <circle cx="0" cy="0" r="42" fill="url(#pupGlow)" filter="url(#fireShadow)" />
    <!-- Ears -->
    <ellipse cx="-26" cy="-14" rx="12" ry="24" transform="rotate(-20 -26 -14)" fill="#b45309" />
    <ellipse cx="26" cy="-14" rx="12" ry="24" transform="rotate(20 26 -14)" fill="#b45309" />
    <!-- Snout -->
    <circle cx="0" cy="12" r="16" fill="#fef08a" />
    <circle cx="0" cy="6" r="6" fill="#451a03" />
    <!-- Eyes -->
    <circle cx="-12" cy="-6" r="6" fill="#0f172a" />
    <circle cx="12" cy="-6" r="6" fill="#0f172a" />
    <circle cx="-14" cy="-8" r="2.5" fill="#ffffff" />
    <circle cx="10" cy="-8" r="2.5" fill="#ffffff" />
    <!-- Fire Crest -->
    <polygon points="0,-48 -8,-36 8,-36" fill="#f97316" />
  </g>

  <!-- Moon Kitty Hero (Right) -->
  <g transform="translate(440, 260)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="54" fill="rgba(56, 189, 248, 0.2)" />
    <!-- Body -->
    <circle cx="0" cy="0" r="42" fill="url(#kittyGlow)" filter="url(#waterShadow)" />
    <!-- Pointed Cat Ears -->
    <polygon points="-28,-24 -36,-58 -10,-38" fill="#0369a1" />
    <polygon points="10,-38 36,-58 28,-24" fill="#0369a1" />
    <!-- Eyes -->
    <circle cx="-12" cy="-4" r="6" fill="#0f172a" />
    <circle cx="12" cy="-4" r="6" fill="#0f172a" />
    <circle cx="-14" cy="-6" r="2.5" fill="#ffffff" />
    <circle cx="10" cy="-6" r="2.5" fill="#ffffff" />
    <!-- Nose & Mouth -->
    <polygon points="0,6 -4,2 4,2" fill="#bae6fd" />
    <path d="M -6 12 Q 0 16 6 12" stroke="#0f172a" stroke-width="2" fill="none" />
    <!-- Crescent Moon Crest -->
    <circle cx="0" cy="-24" r="8" fill="#e0f2fe" />
    <circle cx="4" cy="-24" r="6" fill="#0284c7" />
  </g>

  <!-- Title Badge -->
  <rect x="150" y="325" width="300" height="52" rx="14" fill="#0f172a" opacity="0.95" stroke="#f59e0b" stroke-width="2" />
  <text x="300" y="348" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">FIREBOY &amp; WATERGIRL</text>
  <text x="300" y="366" fill="#f59e0b" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">SUN PUP &amp; MOON KITTY</text>
</svg>
