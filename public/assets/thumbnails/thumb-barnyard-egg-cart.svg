<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Sky & Pasture Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="hillBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <linearGradient id="hillFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Truck Paint Gradients -->
    <linearGradient id="truckBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="woodPanelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Egg Gradient & Shield Glow -->
    <linearGradient id="eggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="90%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.75" />
    </radialGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="goldCoinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="400" fill="url(#skyGrad)" />

  <!-- Sun & Rays -->
  <circle cx="510" cy="70" r="50" fill="#fef08a" opacity="0.6" />
  <circle cx="510" cy="70" r="36" fill="#facc15" />

  <!-- Soft Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="110" cy="75" r="28" />
    <circle cx="140" cy="65" r="36" />
    <circle cx="175" cy="75" r="28" />
    <circle cx="340" cy="95" r="22" />
    <circle cx="365" cy="88" r="30" />
    <circle cx="390" cy="95" r="22" />
  </g>

  <!-- Distant Rolling Hills -->
  <path d="M-20,290 Q120,200 280,260 T620,230 L620,400 L-20,400 Z" fill="url(#hillBackGrad)" opacity="0.8" />

  <!-- Foreground Steep Hill -->
  <path d="M-20,330 Q160,260 320,310 T620,280 L620,400 L-20,400 Z" fill="url(#hillFrontGrad)" />

  <!-- Road / Trail Dirt Path -->
  <path d="M-20,335 Q160,265 320,315 T620,285" fill="none" stroke="#ca8a04" stroke-width="14" stroke-linecap="round" opacity="0.75" />
  <path d="M-20,335 Q160,265 320,315 T620,285" fill="none" stroke="#fef08a" stroke-width="3" stroke-dasharray="12 16" opacity="0.9" />

  <!-- Floating Golden Coins Arc -->
  <g filter="url(#dropShadow)">
    <g transform="translate(180, 160)">
      <circle cx="0" cy="0" r="16" fill="url(#goldCoinGrad)" stroke="#a16207" stroke-width="2" />
      <polygon points="0,-9 2.5,-3 8.5,-3 4,1 5.5,7 0,3.5 -5.5,7 -4,1 -8.5,-3 -2.5,-3" fill="#ffffff" />
    </g>
    <g transform="translate(230, 130)">
      <circle cx="0" cy="0" r="18" fill="url(#goldCoinGrad)" stroke="#a16207" stroke-width="2" />
      <polygon points="0,-10 3,-3 9.5,-3 4.5,1.5 6,8 0,4 -6,8 -4.5,1.5 -9.5,-3 -3,-3" fill="#ffffff" />
    </g>
    <g transform="translate(285, 115)">
      <circle cx="0" cy="0" r="20" fill="url(#goldCoinGrad)" stroke="#a16207" stroke-width="2.5" />
      <polygon points="0,-12 3.5,-4 11,-4 5,2 7,9 0,5 -7,9 -5,2 -11,-4 -3.5,-4" fill="#ffffff" />
    </g>
  </g>

  <!-- The Egg Cart / Truck Group (Tilted climbing hill) -->
  <g transform="translate(360, 260) rotate(-14)" filter="url(#dropShadow)">
    <!-- Cart Shadow -->
    <ellipse cx="0" cy="40" rx="95" ry="12" fill="#0f172a" opacity="0.35" />

    <!-- Wheels (Knobby Off-road Tires) -->
    <!-- Rear Wheel -->
    <g transform="translate(-62, 34)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" />
      <circle cx="0" cy="0" r="23" fill="#334155" />
      <!-- Tread teeth -->
      <line x1="0" y1="-28" x2="0" y2="28" stroke="#0f172a" stroke-width="4" />
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#0f172a" stroke-width="4" />
      <line x1="-20" y1="-20" x2="20" y2="20" stroke="#0f172a" stroke-width="4" />
      <line x1="20" y1="-20" x2="-20" y2="20" stroke="#0f172a" stroke-width="4" />
      <!-- Chrome Rim -->
      <circle cx="0" cy="0" r="14" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#e2e8f0" />
    </g>

    <!-- Front Wheel -->
    <g transform="translate(62, 34)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" />
      <circle cx="0" cy="0" r="23" fill="#334155" />
      <line x1="0" y1="-28" x2="0" y2="28" stroke="#0f172a" stroke-width="4" />
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#0f172a" stroke-width="4" />
      <line x1="-20" y1="-20" x2="20" y2="20" stroke="#0f172a" stroke-width="4" />
      <line x1="20" y1="-20" x2="-20" y2="20" stroke="#0f172a" stroke-width="4" />
      <circle cx="0" cy="0" r="14" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#e2e8f0" />
    </g>

    <!-- Chassis Beam & Suspension Springs -->
    <rect x="-70" y="24" width="140" height="10" rx="4" fill="#475569" stroke="#1e293b" stroke-width="2" />

    <!-- Red Vintage Farm Truck Body -->
    <path d="M-80,24 L-75,0 L10,0 L25,-26 L75,-26 L90,12 L85,24 Z" fill="url(#truckBodyGrad)" stroke="#7f1d1d" stroke-width="3" />
    <!-- Hood Grill & Chrome Bumper -->
    <rect x="78" y="10" width="14" height="12" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="86" cy="2" r="7" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />

    <!-- Windshield -->
    <polygon points="28,-22 70,-22 66,-2 26,-2" fill="#7dd3fc" stroke="#0284c7" stroke-width="2" opacity="0.9" />

    <!-- Wooden Egg Basket / Bed in Rear -->
    <rect x="-72" y="-6" width="68" height="26" rx="4" fill="url(#woodPanelGrad)" stroke="#78350f" stroke-width="2" />
    <!-- Straw Nest Bedding inside cup -->
    <ellipse cx="-38" cy="-6" rx="30" ry="8" fill="#fef08a" stroke="#d97706" stroke-width="2" />

    <!-- Giant Smiling Farm Egg -->
    <g transform="translate(-38, -32)">
      <!-- Shield Energy Bubble -->
      <ellipse cx="0" cy="-2" rx="38" ry="46" fill="url(#shieldGlow)" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" />

      <!-- Egg Body -->
      <path d="M0,-40 C18,-40 28,-18 28,8 C28,26 16,36 0,36 C-16,36 -28,26 -28,8 C-28,-18 -18,-40 0,-40 Z" fill="url(#eggGrad)" stroke="#f59e0b" stroke-width="2.5" />

      <!-- Cute Anime Eyes & Rosy Cheeks -->
      <circle cx="-10" cy="4" r="3.5" fill="#1e293b" />
      <circle cx="-9" cy="2.5" r="1.2" fill="#ffffff" />
      <circle cx="10" cy="4" r="3.5" fill="#1e293b" />
      <circle cx="11" cy="2.5" r="1.2" fill="#ffffff" />

      <!-- Cute Blushing Cheeks -->
      <ellipse cx="-16" cy="11" rx="5" ry="3" fill="#f43f5e" opacity="0.4" />
      <ellipse cx="16" cy="11" rx="5" ry="3" fill="#f43f5e" opacity="0.4" />

      <!-- Big Happy Smile -->
      <path d="M-6,11 Q0,18 6,11" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />

      <!-- Farmer Straw Hat -->
      <path d="M-32,-28 L32,-28 C26,-36 18,-44 0,-44 C-18,-44 -26,-36 -32,-28 Z" fill="#fde047" stroke="#ca8a04" stroke-width="2" />
      <line x1="-38" y1="-28" x2="38" y2="-28" stroke="#ca8a04" stroke-width="4" stroke-linecap="round" />
      <line x1="-16" y1="-32" x2="16" y2="-32" stroke="#ef4444" stroke-width="2.5" />
    </g>
  </g>

  <!-- Title Badge Banner at Top Left -->
  <g transform="translate(24, 28)" filter="url(#dropShadow)">
    <rect width="260" height="66" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
    <rect x="4" y="4" width="252" height="58" rx="14" fill="#0f172a" />
    <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#facc15" letter-spacing="2">🥚 2D HILL PHYSICS</text>
    <text x="18" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff">BARNYARD EGG CART</text>
  </g>
</svg>
