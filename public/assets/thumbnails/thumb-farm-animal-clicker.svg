<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Pasture & Sky Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="hillGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="hillGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <!-- Capybara Fur Gradient -->
    <linearGradient id="capyFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c28854"/>
      <stop offset="50%" stop-color="#9a6233"/>
      <stop offset="100%" stop-color="#6e421c"/>
    </linearGradient>
    <!-- Golden Coin Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
    <!-- Filter for soft drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1b2a4b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="512" height="512" rx="32" fill="url(#skyGrad)"/>

  <!-- Sun Rays & Sun -->
  <circle cx="420" cy="90" r="48" fill="#fef08a" opacity="0.9"/>
  <circle cx="420" cy="90" r="64" fill="url(#goldGlow)"/>

  <!-- Rolling Hills -->
  <path d="M-20 400 Q 120 310, 260 360 T 540 340 L 540 540 L -20 540 Z" fill="url(#hillGrad1)"/>
  <path d="M-20 440 Q 140 370, 320 410 T 540 380 L 540 540 L -20 540 Z" fill="url(#hillGrad2)"/>

  <!-- Floating Sparkles & Treats -->
  <g fill="#f59e0b" filter="url(#shadow)">
    <!-- Golden Coin 1 -->
    <circle cx="90" cy="180" r="24" fill="#fbbf24"/>
    <circle cx="90" cy="180" r="18" fill="#f59e0b"/>
    <text x="90" y="188" font-family="sans-serif" font-weight="bold" font-size="20" text-anchor="middle" fill="#fef3c7">★</text>

    <!-- Golden Coin 2 -->
    <circle cx="430" cy="220" r="28" fill="#fbbf24"/>
    <circle cx="430" cy="220" r="22" fill="#f59e0b"/>
    <text x="430" y="229" font-family="sans-serif" font-weight="bold" font-size="24" text-anchor="middle" fill="#fef3c7">★</text>

    <!-- Heart Particle -->
    <path d="M120 110 C 120 95, 100 95, 100 110 C 100 125, 120 140, 120 140 C 120 140, 140 125, 140 110 C 140 95, 120 95, 120 110 Z" fill="#ef4444" transform="scale(0.8) translate(30, 20)"/>
  </g>

  <!-- Big Central Chill Capybara Hero -->
  <g id="capybara-hero" filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="256" cy="350" rx="140" ry="110" fill="url(#capyFur)"/>
    <!-- Head -->
    <rect x="186" y="210" width="140" height="130" rx="48" fill="url(#capyFur)"/>
    <!-- Snout -->
    <rect x="206" y="270" width="100" height="75" rx="30" fill="#804d24"/>

    <!-- Cute Closed Relaxed Eyes -->
    <path d="M210 262 Q 225 274, 240 262" stroke="#261508" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M272 262 Q 287 274, 302 262" stroke="#261508" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Nose / Mouth -->
    <ellipse cx="256" cy="295" rx="12" ry="7" fill="#261508"/>
    <path d="M256 302 L 256 314" stroke="#261508" stroke-width="4" stroke-linecap="round"/>
    <path d="M246 314 Q 256 322, 266 314" stroke="#261508" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="198" cy="285" rx="12" ry="8" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="314" cy="285" rx="12" ry="8" fill="#f43f5e" opacity="0.6"/>

    <!-- Small Cute Ears -->
    <ellipse cx="186" cy="215" rx="16" ry="14" fill="#804d24"/>
    <ellipse cx="186" cy="215" rx="10" ry="8" fill="#543013"/>
    <ellipse cx="326" cy="215" rx="16" ry="14" fill="#804d24"/>
    <ellipse cx="326" cy="215" rx="10" ry="8" fill="#543013"/>

    <!-- Yuzu Citrus on Capybara's Head -->
    <circle cx="256" cy="180" r="26" fill="#f97316"/>
    <circle cx="256" cy="180" r="22" fill="#fb923c"/>
    <!-- Leaf -->
    <path d="M256 156 Q 272 144, 276 152 Q 276 166, 256 162 Z" fill="#22c55e"/>
  </g>

  <!-- Clicking White Glove Hand (Iconic Clicker Symbol) -->
  <g transform="translate(330, 270) rotate(-15)" filter="url(#shadow)">
    <!-- Click ripple rings -->
    <circle cx="30" cy="30" r="35" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.75"/>
    <circle cx="30" cy="30" r="50" stroke="#fef08a" stroke-width="3" stroke-dasharray="8 6" fill="none" opacity="0.85"/>
    <!-- Hand shape -->
    <path d="M30 10 L 30 50 C 30 65, 45 75, 60 75 L 75 75 C 90 75, 100 65, 100 50 L 100 35 C 100 30, 95 25, 90 25 C 85 25, 80 30, 80 35 L 80 30 C 80 25, 75 20, 70 20 C 65 20, 60 25, 60 30 L 60 25 C 60 20, 55 15, 50 15 C 45 15, 40 20, 40 25 L 40 10 C 40 5, 35 0, 30 0 C 25 0, 20 5, 20 10 L 20 50 L 10 40 C 5 35, -2 38, 0 45 L 12 65 C 18 78, 30 85, 45 85 L 80 85" fill="#ffffff" stroke="#1b2a4b" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Banner with Pawcade Style Title -->
  <g transform="translate(256, 460)" filter="url(#shadow)">
    <rect x="-190" y="-32" width="380" height="54" rx="22" fill="#ff6b1a" stroke="#ffffff" stroke-width="4"/>
    <text x="0" y="4" font-family="'Fredoka', 'Nunito', system-ui, sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      ANIMAL IDLE CLICKER 🐾
    </text>
  </g>
</svg>
