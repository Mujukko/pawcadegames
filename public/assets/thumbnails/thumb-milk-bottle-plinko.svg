<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background carnival gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#312e81" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Warm Carnival Sunburst / Glow -->
    <radialGradient id="sunburstGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Plinko Peg Glow -->
    <radialGradient id="goldPeg" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- Glass Milk Bottle Gradient -->
    <linearGradient id="glassMilk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.85" />
    </linearGradient>

    <!-- Golden Milk Cap -->
    <linearGradient id="goldCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Jackpot Gold Badge -->
    <linearGradient id="jackpotGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <rect width="512" height="512" fill="url(#sunburstGlow)" />

  <!-- Carnival Pennant Banner across Top -->
  <g>
    <path d="M 0,15 Q 128,45 256,15 Q 384,45 512,15" fill="none" stroke="#64748b" stroke-width="2" />
    <!-- Flags -->
    <polygon points="30,23 60,28 45,65" fill="#ef4444" />
    <polygon points="80,31 110,34 95,70" fill="#facc15" />
    <polygon points="130,35 160,34 145,72" fill="#3b82f6" />
    <polygon points="180,31 210,27 195,68" fill="#10b981" />
    <polygon points="230,21 260,18 245,60" fill="#ec4899" />
    <polygon points="280,18 310,22 295,62" fill="#8b5cf6" />
    <polygon points="330,26 360,31 345,69" fill="#f97316" />
    <polygon points="380,34 410,35 395,72" fill="#06b6d4" />
    <polygon points="430,32 460,26 445,66" fill="#eab308" />
  </g>

  <!-- Plinko Board Frame Rails -->
  <rect x="44" y="60" width="16" height="380" rx="8" fill="#475569" stroke="#94a3b8" stroke-width="2" />
  <rect x="452" y="60" width="16" height="380" rx="8" fill="#475569" stroke="#94a3b8" stroke-width="2" />

  <!-- Peg Grid Matrix with Glows -->
  <!-- Row 1 -->
  <circle cx="130" cy="110" r="7" fill="url(#goldPeg)" filter="url(#softGlow)" />
  <circle cx="210" cy="110" r="7" fill="url(#goldPeg)" />
  <circle cx="290" cy="110" r="7" fill="url(#goldPeg)" />
  <circle cx="370" cy="110" r="7" fill="url(#goldPeg)" filter="url(#softGlow)" />

  <!-- Row 2 -->
  <circle cx="90" cy="155" r="7" fill="url(#goldPeg)" />
  <circle cx="170" cy="155" r="7" fill="url(#goldPeg)" filter="url(#softGlow)" />
  <circle cx="250" cy="155" r="7" fill="url(#goldPeg)" />
  <circle cx="330" cy="155" r="7" fill="url(#goldPeg)" filter="url(#softGlow)" />
  <circle cx="410" cy="155" r="7" fill="url(#goldPeg)" />

  <!-- Row 3 -->
  <circle cx="130" cy="200" r="7" fill="url(#goldPeg)" />
  <circle cx="210" cy="200" r="7" fill="url(#goldPeg)" />
  <circle cx="290" cy="200" r="7" fill="url(#goldPeg)" />
  <circle cx="370" cy="200" r="7" fill="url(#goldPeg)" />

  <!-- Row 4 - Bumper Pegs -->
  <circle cx="170" cy="245" r="13" fill="#f43f5e" stroke="#fff" stroke-width="3" filter="url(#softGlow)" />
  <circle cx="250" cy="245" r="7" fill="url(#goldPeg)" />
  <circle cx="330" cy="245" r="13" fill="#f43f5e" stroke="#fff" stroke-width="3" filter="url(#softGlow)" />

  <!-- Row 5 -->
  <circle cx="90" cy="290" r="7" fill="url(#goldPeg)" />
  <circle cx="170" cy="290" r="7" fill="url(#goldPeg)" />
  <circle cx="250" cy="290" r="7" fill="url(#goldPeg)" filter="url(#softGlow)" />
  <circle cx="330" cy="290" r="7" fill="url(#goldPeg)" />
  <circle cx="410" cy="290" r="7" fill="url(#goldPeg)" />

  <!-- Row 6 -->
  <circle cx="130" cy="335" r="7" fill="url(#goldPeg)" />
  <circle cx="210" cy="335" r="7" fill="url(#goldPeg)" filter="url(#softGlow)" />
  <circle cx="290" cy="335" r="7" fill="url(#goldPeg)" />
  <circle cx="370" cy="335" r="7" fill="url(#goldPeg)" />

  <!-- Row 7 -->
  <circle cx="90" cy="380" r="7" fill="url(#goldPeg)" />
  <circle cx="170" cy="380" r="7" fill="url(#goldPeg)" />
  <circle cx="250" cy="380" r="7" fill="url(#goldPeg)" filter="url(#softGlow)" />
  <circle cx="330" cy="380" r="7" fill="url(#goldPeg)" />
  <circle cx="410" cy="380" r="7" fill="url(#goldPeg)" />

  <!-- Golden Milk Bottle in Dynamic Flight & Bounce -->
  <g transform="translate(250, 160) rotate(18)">
    <!-- Shadow -->
    <ellipse cx="6" cy="18" rx="22" ry="34" fill="rgba(0,0,0,0.4)" filter="url(#softGlow)" />
    <!-- Glass Bottle Body -->
    <rect x="-18" y="-10" width="36" height="52" rx="10" fill="url(#glassMilk)" stroke="#38bdf8" stroke-width="2" />
    <!-- Milk Fill Liquid -->
    <rect x="-15" y="0" width="30" height="40" rx="7" fill="#f8fafc" />
    <path d="M -15,10 Q -5,14 0,10 Q 5,6 15,10 L 15,40 L -15,40 Z" fill="#fef08a" opacity="0.9" />
    <!-- Bottle Neck -->
    <rect x="-10" y="-28" width="20" height="20" rx="3" fill="url(#glassMilk)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Gold Foil Cap -->
    <ellipse cx="0" cy="-28" rx="11" ry="5" fill="url(#goldCap)" stroke="#fff" stroke-width="1" />
    <!-- Cow Spot on Label -->
    <ellipse cx="0" cy="22" rx="9" ry="8" fill="#1e293b" opacity="0.8" />
    <ellipse cx="-4" cy="18" rx="4" ry="4" fill="#1e293b" opacity="0.8" />
    <circle cx="4" cy="26" r="3" fill="#1e293b" opacity="0.8" />
  </g>

  <!-- Sparkles around the falling bottle -->
  <g fill="#fef08a">
    <path d="M 290,140 Q 295,145 295,150 Q 295,145 300,140 Q 295,135 295,130 Q 295,135 290,140 Z" />
    <path d="M 215,220 Q 218,225 218,228 Q 218,225 221,220 Q 218,215 218,212 Q 218,215 215,220 Z" />
    <path d="M 320,205 Q 324,208 324,212 Q 324,208 328,205 Q 324,202 324,198 Q 324,202 320,205 Z" />
  </g>

  <!-- Bessie The Dairy Cow Mascot in Left Foreground -->
  <g transform="translate(68, 360)">
    <!-- Body -->
    <ellipse cx="40" cy="50" rx="45" ry="38" fill="#ffffff" stroke="#0f172a" stroke-width="4" />
    <!-- Black Spots -->
    <path d="M 15,35 Q 28,20 45,35 Q 35,55 15,35 Z" fill="#0f172a" />
    <path d="M 60,40 Q 75,25 78,50 Q 65,65 60,40 Z" fill="#0f172a" />
    <!-- Red Bandana -->
    <path d="M 12,38 Q 40,55 68,38 L 40,68 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <!-- Head -->
    <ellipse cx="40" cy="5" rx="34" ry="30" fill="#ffffff" stroke="#0f172a" stroke-width="4" />
    <!-- Spot over right eye -->
    <path d="M 46,-15 Q 68,-5 65,15 Q 48,18 46,-15 Z" fill="#0f172a" />
    <!-- Snout & Mouth -->
    <ellipse cx="40" cy="18" rx="24" ry="16" fill="#fbcfe8" stroke="#f472b6" stroke-width="2.5" />
    <ellipse cx="32" cy="16" rx="3.5" ry="4.5" fill="#db2777" />
    <ellipse cx="48" cy="16" rx="3.5" ry="4.5" fill="#db2777" />
    <path d="M 33,23 Q 40,29 47,23" fill="none" stroke="#be185d" stroke-width="3" stroke-linecap="round" />
    <!-- Big Happy Eyes -->
    <circle cx="28" cy="-2" r="7" fill="#0f172a" />
    <circle cx="26" cy="-4" r="2.5" fill="#ffffff" />
    <circle cx="52" cy="-2" r="7" fill="#0f172a" />
    <circle cx="50" cy="-4" r="2.5" fill="#ffffff" />
    <!-- Cow Horns -->
    <path d="M 16,-18 Q 8,-35 2,-28 Q 12,-16 22,-12 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <path d="M 64,-18 Q 72,-35 78,-28 Q 68,-16 58,-12 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <!-- Ears -->
    <ellipse cx="6" cy="-5" rx="14" ry="8" transform="rotate(-20 6 -5)" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <ellipse cx="6" cy="-5" rx="9" ry="5" transform="rotate(-20 6 -5)" fill="#fbcfe8" />
    <ellipse cx="74" cy="-5" rx="14" ry="8" transform="rotate(20 74 -5)" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <ellipse cx="74" cy="-5" rx="9" ry="5" transform="rotate(20 74 -5)" fill="#fbcfe8" />
  </g>

  <!-- Bottom Carnival Catch Buckets -->
  <!-- Bucket Dividers -->
  <g fill="#020617" stroke="#475569" stroke-width="2">
    <rect x="50" y="440" width="50" height="60" rx="4" fill="#581c87" />
    <rect x="105" y="440" width="50" height="60" rx="4" fill="#1e3a8a" />
    <rect x="160" y="440" width="50" height="60" rx="4" fill="#065f46" />
    <!-- Central Golden Jackpot Corral -->
    <rect x="215" y="430" width="82" height="70" rx="8" fill="url(#jackpotGrad)" stroke="#fef08a" stroke-width="3" filter="url(#softGlow)" />
    <rect x="302" y="440" width="50" height="60" rx="4" fill="#065f46" />
    <rect x="357" y="440" width="50" height="60" rx="4" fill="#1e3a8a" />
    <rect x="412" y="440" width="50" height="60" rx="4" fill="#581c87" />
  </g>

  <!-- Multiplier Labels on Buckets -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle" fill="#ffffff">
    <text x="75" y="475">20x</text>
    <text x="130" y="475">5x</text>
    <text x="185" y="475">2x</text>
    <!-- JACKPOT 100x -->
    <text x="256" y="462" fill="#713f12" font-size="20">100x</text>
    <text x="256" y="482" fill="#854d0e" font-size="11" letter-spacing="1">JACKPOT</text>
    <text x="327" y="475">2x</text>
    <text x="382" y="475">5x</text>
    <text x="437" y="475">20x</text>
  </g>

  <!-- Golden Stars & Confetti on Jackpot -->
  <g fill="#fde047">
    <circle cx="225" cy="442" r="3" />
    <circle cx="287" cy="442" r="3" />
    <circle cx="256" cy="437" r="4" />
  </g>
</svg>
