<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Sunny Country Meadow) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>

    <!-- Lush Grass Meadow -->
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Dirt Path Gradient -->
    <linearGradient id="dirtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Cart Gradients -->
    <!-- Pink Berry Cart -->
    <linearGradient id="cartPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <!-- Blue Sky Cart -->
    <linearGradient id="cartBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Yellow Sun Cart -->
    <linearGradient id="cartYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Sheep Wool Cloud Gradients -->
    <radialGradient id="woolPink" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="50%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </radialGradient>

    <radialGradient id="woolBlue" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>

    <radialGradient id="woolYellow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Background Sky & Rolling Hills -->
  <rect width="512" height="512" fill="url(#skyGrad)"/>

  <!-- Puffy Sunlit Clouds -->
  <path d="M 60 70 Q 80 50 110 60 Q 140 40 170 65 Q 190 60 200 80 Q 210 100 180 110 L 70 110 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M 330 80 Q 350 60 380 70 Q 410 50 440 75 Q 460 70 470 90 Q 480 110 450 120 L 340 120 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Rolling Green Hills -->
  <path d="M 0 220 Q 140 150 280 200 Q 420 250 512 180 L 512 512 L 0 512 Z" fill="url(#grassGrad)"/>

  <!-- Farm Dirt Road Lane (Curving toward bottom) -->
  <path d="M 160 200 Q 220 280 200 420 Q 190 480 170 512 L 350 512 Q 330 460 330 380 Q 320 270 280 200 Z" fill="url(#dirtGrad)" opacity="0.9"/>

  <!-- 2. The Main Tractor Hay Cart (Speeding forward with Sheep!) -->
  <g transform="translate(130, 240)" filter="url(#shadow)">
    <!-- Wooden Cart Bed -->
    <rect x="0" y="40" width="250" height="110" rx="18" fill="url(#cartPink)" stroke="#ffffff" stroke-width="4"/>

    <!-- Wooden Slats Decoration -->
    <line x1="20" y1="75" x2="230" y2="75" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
    <line x1="20" y1="110" x2="230" y2="110" stroke="#ffffff" stroke-width="3" opacity="0.4"/>

    <!-- Chunky Rubber Wheels -->
    <circle cx="50" cy="150" r="32" fill="#1e293b" stroke="#64748b" stroke-width="6"/>
    <circle cx="50" cy="150" r="14" fill="#94a3b8"/>

    <circle cx="200" cy="150" r="32" fill="#1e293b" stroke="#64748b" stroke-width="6"/>
    <circle cx="200" cy="150" r="14" fill="#94a3b8"/>

    <!-- 3 Cute Passengers Inside Cart -->
    <!-- Passenger 1: Left Sheep -->
    <g transform="translate(25, -10)">
      <!-- Wool Body -->
      <circle cx="35" cy="40" r="28" fill="url(#woolPink)"/>
      <circle cx="20" cy="30" r="16" fill="url(#woolPink)"/>
      <circle cx="50" cy="30" r="16" fill="url(#woolPink)"/>
      <!-- Face -->
      <ellipse cx="35" cy="42" rx="14" ry="12" fill="#fed7aa"/>
      <circle cx="30" cy="38" r="3" fill="#0f172a"/>
      <circle cx="40" cy="38" r="3" fill="#0f172a"/>
      <!-- Rosy Cheeks -->
      <circle cx="26" cy="44" r="3" fill="#fb7185" opacity="0.7"/>
      <circle cx="44" cy="44" r="3" fill="#fb7185" opacity="0.7"/>
      <!-- Ears -->
      <ellipse cx="18" cy="38" rx="6" ry="4" fill="#fed7aa"/>
      <ellipse cx="52" cy="38" rx="6" ry="4" fill="#fed7aa"/>
    </g>

    <!-- Passenger 2: Center Mascot Sheep (Big & Happy!) -->
    <g transform="translate(90, -35)">
      <!-- Big Wool Body -->
      <circle cx="35" cy="45" r="34" fill="url(#woolPink)"/>
      <circle cx="18" cy="32" r="18" fill="url(#woolPink)"/>
      <circle cx="52" cy="32" r="18" fill="url(#woolPink)"/>
      <circle cx="35" cy="20" r="18" fill="url(#woolPink)"/>
      <!-- Face -->
      <ellipse cx="35" cy="46" rx="16" ry="14" fill="#fed7aa"/>
      <!-- Happy Wide Eyes -->
      <circle cx="29" cy="42" r="4" fill="#0f172a"/>
      <circle cx="30.5" cy="40.5" r="1.5" fill="#ffffff"/>
      <circle cx="41" cy="42" r="4" fill="#0f172a"/>
      <circle cx="42.5" cy="40.5" r="1.5" fill="#ffffff"/>
      <!-- Smile -->
      <path d="M 31 52 Q 35 57 39 52" stroke="#b45309" stroke-width="2.5" fill="none"/>
      <!-- Ears -->
      <ellipse cx="14" cy="42" rx="8" ry="5" fill="#fed7aa"/>
      <ellipse cx="56" cy="42" rx="8" ry="5" fill="#fed7aa"/>
    </g>

    <!-- Passenger 3: Right Sheep -->
    <g transform="translate(155, -10)">
      <circle cx="35" cy="40" r="28" fill="url(#woolPink)"/>
      <circle cx="20" cy="30" r="16" fill="url(#woolPink)"/>
      <circle cx="50" cy="30" r="16" fill="url(#woolPink)"/>
      <ellipse cx="35" cy="42" rx="14" ry="12" fill="#fed7aa"/>
      <circle cx="30" cy="38" r="3" fill="#0f172a"/>
      <circle cx="40" cy="38" r="3" fill="#0f172a"/>
      <circle cx="26" cy="44" r="3" fill="#fb7185" opacity="0.7"/>
      <circle cx="44" cy="44" r="3" fill="#fb7185" opacity="0.7"/>
      <ellipse cx="18" cy="38" rx="6" ry="4" fill="#fed7aa"/>
      <ellipse cx="52" cy="38" rx="6" ry="4" fill="#fed7aa"/>
    </g>
  </g>

  <!-- 3. Waiting Sheep in the Queue (Top Left) -->
  <g transform="translate(40, 160)" filter="url(#shadow)">
    <!-- Blue Sheep -->
    <circle cx="30" cy="30" r="24" fill="url(#woolBlue)"/>
    <ellipse cx="30" cy="32" rx="12" ry="10" fill="#fed7aa"/>
    <circle cx="26" cy="30" r="2.5" fill="#0f172a"/>
    <circle cx="34" cy="30" r="2.5" fill="#0f172a"/>
    <!-- Yellow Sheep Behind -->
    <circle cx="75" cy="25" r="22" fill="url(#woolYellow)"/>
    <ellipse cx="75" cy="27" rx="11" ry="9" fill="#fed7aa"/>
    <circle cx="72" cy="25" r="2.5" fill="#0f172a"/>
    <circle cx="78" cy="25" r="2.5" fill="#0f172a"/>
  </g>

  <!-- 4. Floating Action Sparks & Golden Stars -->
  <g fill="#fde047" filter="url(#shadow)">
    <polygon points="430,170 435,185 450,185 438,195 442,210 430,200 418,210 422,195 410,185 425,185"/>
    <polygon points="90,360 94,372 106,372 96,380 100,392 90,384 80,392 84,380 74,372 86,372"/>
  </g>

  <!-- 5. Bus Jam Style Exit Arrow Badge (Top Right) -->
  <g transform="translate(320, 30)" filter="url(#shadow)">
    <rect x="0" y="0" width="165" height="52" rx="26" fill="#16a34a" stroke="#86efac" stroke-width="3"/>
    <text x="82" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">MEADOW EXIT ▲</text>
  </g>
</svg>
