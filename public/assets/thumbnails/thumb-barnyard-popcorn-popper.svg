<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="kettleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="popGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="36" fill="url(#bgGrad)"/>

  <!-- Warm Popcorn Burst Glow -->
  <circle cx="256" cy="220" r="190" fill="url(#popGlow)"/>

  <!-- Exploding Golden Popcorn Sparks & Stars -->
  <g fill="#fef08a" opacity="0.9">
    <path d="M 120 140 L 126 154 L 140 156 L 128 168 L 132 182 L 120 174 L 108 182 L 112 168 L 100 156 L 114 154 Z"/>
    <path d="M 380 120 L 385 132 L 398 134 L 388 144 L 391 157 L 380 150 L 369 157 L 372 144 L 362 134 L 375 132 Z"/>
    <path d="M 256 60 L 261 74 L 276 76 L 264 87 L 268 101 L 256 93 L 244 101 L 248 87 L 236 76 L 251 74 Z"/>
    <circle cx="170" cy="110" r="6" fill="#fde047"/>
    <circle cx="340" cy="90" r="7" fill="#fde047"/>
    <circle cx="90" cy="220" r="5" fill="#fde047"/>
    <circle cx="420" cy="230" r="6" fill="#fde047"/>
  </g>

  <!-- Flying Butter Popcorn Pieces -->
  <g filter="url(#shadow)">
    <!-- High burst popcorn piece 1 -->
    <path d="M 240 110 C 230 95, 250 85, 260 95 C 275 85, 290 100, 280 115 C 295 125, 280 145, 265 135 C 255 145, 235 135, 240 120 Z" fill="#fffbeb" stroke="#fef08a" stroke-width="3"/>
    <circle cx="260" cy="115" r="8" fill="#fde047" opacity="0.8"/>

    <!-- High burst popcorn piece 2 (left) -->
    <path d="M 150 160 C 140 145, 160 135, 170 145 C 185 135, 200 150, 190 165 C 205 175, 190 195, 175 185 C 165 195, 145 185, 150 170 Z" fill="#fffbeb" stroke="#fef08a" stroke-width="3"/>
    <circle cx="170" cy="165" r="7" fill="#fde047" opacity="0.8"/>

    <!-- High burst popcorn piece 3 (right) -->
    <path d="M 330 150 C 320 135, 340 125, 350 135 C 365 125, 380 140, 370 155 C 385 165, 370 185, 355 175 C 345 185, 325 175, 330 160 Z" fill="#fffbeb" stroke="#fef08a" stroke-width="3"/>
    <circle cx="350" cy="155" r="7" fill="#fde047" opacity="0.8"/>
  </g>

  <!-- Striped Popcorn Bucket / Tub -->
  <g filter="url(#shadow)">
    <!-- Bucket base trapezoid -->
    <path d="M 140 280 L 170 470 L 342 470 L 372 280 Z" fill="#f8fafc"/>
    <!-- Red stripes -->
    <path d="M 180 280 L 196 470 L 220 470 L 208 280 Z" fill="#ef4444"/>
    <path d="M 244 280 L 246 470 L 268 470 L 270 280 Z" fill="#ef4444"/>
    <path d="M 304 280 L 292 470 L 316 470 L 332 280 Z" fill="#ef4444"/>

    <!-- Bucket Rim & Shadow -->
    <ellipse cx="256" cy="280" rx="116" ry="24" fill="url(#goldRim)" stroke="#b45309" stroke-width="4"/>
  </g>

  <!-- Mountain of Fluffy Popcorn in Tub -->
  <g filter="url(#shadow)">
    <!-- Base popcorn dome -->
    <path d="M 150 280 C 140 240, 180 210, 210 230 C 230 190, 280 190, 300 230 C 330 210, 370 240, 362 280 Z" fill="#fffbeb"/>
    <!-- Fluffy clusters -->
    <circle cx="180" cy="250" r="24" fill="#fef08a"/>
    <circle cx="178" cy="248" r="20" fill="#fffbeb"/>
    <circle cx="225" cy="235" r="28" fill="#fef08a"/>
    <circle cx="222" cy="232" r="24" fill="#fffbeb"/>
    <circle cx="280" cy="230" r="28" fill="#fef08a"/>
    <circle cx="282" cy="228" r="24" fill="#fffbeb"/>
    <circle cx="330" cy="255" r="24" fill="#fef08a"/>
    <circle cx="328" cy="252" r="20" fill="#fffbeb"/>
    <!-- Butter drizzle -->
    <path d="M 210 230 Q 225 250, 240 235 Q 260 260, 280 240" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Barnyard Chef Mascot: Penny Piglet with Chef Hat Peeking Out -->
  <g transform="translate(60, 330)" filter="url(#shadow)">
    <!-- Piggy Head -->
    <ellipse cx="60" cy="60" rx="45" ry="38" fill="#f472b6" stroke="#db2777" stroke-width="3"/>
    <!-- Left Ear -->
    <path d="M 25 35 Q 10 10, 35 20 Z" fill="#ec4899" stroke="#db2777" stroke-width="2"/>
    <!-- Right Ear -->
    <path d="M 95 35 Q 110 10, 85 20 Z" fill="#ec4899" stroke="#db2777" stroke-width="2"/>
    <!-- Snout -->
    <ellipse cx="60" cy="68" rx="20" ry="14" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/>
    <ellipse cx="53" cy="68" rx="4" ry="6" fill="#be185d"/>
    <ellipse cx="67" cy="68" rx="4" ry="6" fill="#be185d"/>
    <!-- Eyes -->
    <ellipse cx="44" cy="50" rx="5" ry="7" fill="#1e1b4b"/>
    <ellipse cx="76" cy="50" rx="5" ry="7" fill="#1e1b4b"/>
    <circle cx="42" cy="48" r="2" fill="#fff"/>
    <circle cx="74" cy="48" r="2" fill="#fff"/>
    <!-- Rosy Cheeks -->
    <circle cx="28" cy="64" r="8" fill="#f43f5e" opacity="0.5"/>
    <circle cx="92" cy="64" r="8" fill="#f43f5e" opacity="0.5"/>
    <!-- Chef Hat -->
    <path d="M 38 25 C 20 15, 25 -10, 50 -5 C 60 -25, 75 -20, 80 -5 C 95 -10, 105 15, 84 25 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="36" y="20" width="50" height="10" rx="4" fill="#e2e8f0"/>
  </g>

  <!-- Golden Corn Cob (Bottom Right) -->
  <g transform="translate(370, 370) rotate(-25)" filter="url(#shadow)">
    <!-- Green Husk -->
    <path d="M 0 40 Q 15 80, -10 110 Q 30 90, 20 50 Z" fill="#22c55e"/>
    <path d="M 40 40 Q 25 80, 50 110 Q 10 90, 20 50 Z" fill="#16a34a"/>
    <!-- Golden Cob -->
    <rect x="5" y="10" width="30" height="70" rx="15" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <!-- Kernel Grid Texture -->
    <circle cx="14" cy="25" r="3.5" fill="#fef08a"/>
    <circle cx="26" cy="25" r="3.5" fill="#fef08a"/>
    <circle cx="14" cy="38" r="3.5" fill="#fef08a"/>
    <circle cx="26" cy="38" r="3.5" fill="#fef08a"/>
    <circle cx="14" cy="51" r="3.5" fill="#fef08a"/>
    <circle cx="26" cy="51" r="3.5" fill="#fef08a"/>
    <circle cx="20" cy="64" r="3.5" fill="#fef08a"/>
  </g>
</svg>
