<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>
  <!-- Floor -->
  <rect x="0" y="310" width="600" height="90" fill="#020617"/>
  <line x1="0" y1="310" x2="600" y2="310" stroke="#84cc16" stroke-width="6"/>
  <!-- Neon blocks -->
  <rect x="380" y="250" width="64" height="60" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <rect x="468" y="196" width="70" height="114" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  <!-- Spikes -->
  <polygon points="255,254 285,310 225,310" fill="#f43f5e" stroke="#ffffff" stroke-width="3"/>
  <polygon points="315,254 345,310 285,310" fill="#f43f5e" stroke="#ffffff" stroke-width="3"/>
  <!-- Yellow orb -->
  <circle cx="285" cy="180" r="22" fill="none" stroke="#fde047" stroke-width="5"/>
  <circle cx="285" cy="180" r="10" fill="#facc15"/>
  <!-- Jumping Chick Cube -->
  <g transform="translate(175, 195) rotate(28)">
    <rect x="-32" y="-32" width="64" height="64" rx="6" fill="#facc15" stroke="#ffffff" stroke-width="5"/>
    <rect x="-18" y="-14" width="12" height="12" fill="#0f172a"/>
    <rect x="8" y="-14" width="12" height="12" fill="#0f172a"/>
    <rect x="-8" y="6" width="18" height="10" fill="#f97316"/>
  </g>
  <!-- Title pill -->
  <rect x="115" y="22" width="370" height="52" rx="26" fill="#020617" stroke="#84cc16" stroke-width="3"/>
  <text x="300" y="56" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="27" fill="#bef264" text-anchor="middle">BARNYARD DASH</text>
</svg>
