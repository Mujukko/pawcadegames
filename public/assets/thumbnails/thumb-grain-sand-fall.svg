<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Silo Gradient -->
    <linearGradient id="siloBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="60%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>

    <!-- Golden Corn Sand Gradient -->
    <linearGradient id="cornSand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Ruby Cranberry Sand Gradient -->
    <linearGradient id="cranberrySand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Sky Berry Sand Gradient -->
    <linearGradient id="berrySand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="40%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Clover Green Sand Gradient -->
    <linearGradient id="cloverSand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Silo Interior Background -->
  <rect width="512" height="512" fill="url(#siloBg)"/>

  <!-- Wooden Silo Wall Ribs -->
  <g stroke="#44403c" stroke-width="2" opacity="0.4">
    <line x1="0" y1="80" x2="512" y2="80"/>
    <line x1="0" y1="160" x2="512" y2="160"/>
    <line x1="0" y1="240" x2="512" y2="240"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="400" x2="512" y2="400"/>
  </g>

  <!-- 2. Bottom Sand Dunes (Melted sand mounds) -->
  <!-- Layer 1: Clover Green Sand Base -->
  <path d="M 0 460 Q 120 440 240 450 Q 380 430 512 470 L 512 512 L 0 512 Z" fill="url(#cloverSand)"/>

  <!-- Layer 2: Ruby Cranberry Sand Dunes -->
  <path d="M 0 410 Q 150 430 260 380 Q 370 410 512 390 L 512 470 Q 380 430 240 450 Q 120 440 0 460 Z" fill="url(#cranberrySand)"/>

  <!-- Layer 3: Golden Corn Sand Flow (Active Melting Layer!) -->
  <path d="M 0 340 Q 140 310 250 350 Q 390 320 512 360 L 512 390 Q 370 410 260 380 Q 150 430 0 410 Z" fill="url(#cornSand)" filter="url(#glow)"/>

  <!-- Wall-to-Wall Flash Line Dissolving! -->
  <path d="M 0 342 Q 140 312 250 352 Q 390 322 512 362" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 6" fill="none" filter="url(#glow)"/>

  <!-- 3. Falling Grains Cascades (Thousands of tiny sand dots) -->
  <g fill="#fde047" opacity="0.9">
    <circle cx="210" cy="270" r="4"/>
    <circle cx="225" cy="285" r="3"/>
    <circle cx="218" cy="305" r="5"/>
    <circle cx="235" cy="315" r="4"/>
    <circle cx="250" cy="290" r="4"/>
    <circle cx="265" cy="310" r="3.5"/>
    <circle cx="280" cy="280" r="4"/>
  </g>

  <g fill="#f87171" opacity="0.85">
    <circle cx="120" cy="350" r="4"/>
    <circle cx="135" cy="365" r="3.5"/>
    <circle cx="110" cy="375" r="5"/>
    <circle cx="145" cy="380" r="3"/>
  </g>

  <!-- 4. Falling Tetromino Shapes dissolving mid-air -->
  <!-- Falling Corn T-Shape -->
  <g transform="translate(190, 110)" filter="url(#shadow)">
    <!-- Top Row -->
    <rect x="0" y="0" width="40" height="40" rx="8" fill="url(#cornSand)" stroke="#fef08a" stroke-width="2"/>
    <rect x="42" y="0" width="40" height="40" rx="8" fill="url(#cornSand)" stroke="#fef08a" stroke-width="2"/>
    <rect x="84" y="0" width="40" height="40" rx="8" fill="url(#cornSand)" stroke="#fef08a" stroke-width="2"/>
    <!-- Stem -->
    <rect x="42" y="42" width="40" height="40" rx="8" fill="url(#cornSand)" stroke="#fef08a" stroke-width="2"/>

    <!-- Dissolving into sand trails below -->
    <circle cx="50" cy="95" r="5" fill="#fde047"/>
    <circle cx="62" cy="110" r="4" fill="#fde047"/>
    <circle cx="75" cy="100" r="4.5" fill="#fde047"/>
  </g>

  <!-- Falling Sky Berry L-Piece (Top Right) -->
  <g transform="translate(360, 160)" opacity="0.85" filter="url(#shadow)">
    <rect x="0" y="0" width="32" height="32" rx="6" fill="url(#berrySand)"/>
    <rect x="0" y="34" width="32" height="32" rx="6" fill="url(#berrySand)"/>
    <rect x="34" y="34" width="32" height="32" rx="6" fill="url(#berrySand)"/>
  </g>

  <!-- 5. Clucky The Cartoon Hen (Mascot Watching in Awe at Bottom Left) -->
  <g transform="translate(30, 230)" filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="60" cy="90" rx="42" ry="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Red Comb -->
    <circle cx="50" cy="48" r="9" fill="#ef4444"/>
    <circle cx="62" cy="44" r="11" fill="#ef4444"/>
    <circle cx="74" cy="48" r="9" fill="#ef4444"/>
    <!-- Head -->
    <circle cx="65" cy="65" r="26" fill="#ffffff"/>
    <!-- Googly Eyes -->
    <circle cx="75" cy="62" r="7" fill="#0f172a"/>
    <circle cx="77" cy="60" r="2.5" fill="#ffffff"/>
    <!-- Orange Beak -->
    <polygon points="86,65 102,70 86,77" fill="#f97316"/>
    <!-- Red Wattle -->
    <ellipse cx="82" cy="80" rx="6" ry="9" fill="#ef4444"/>
    <!-- Wing -->
    <ellipse cx="45" cy="94" rx="20" ry="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- 6. Floating Stars & Sparkles -->
  <g fill="#fef08a" filter="url(#glow)">
    <text x="310" y="320" font-size="28">✨</text>
    <text x="90" y="160" font-size="24">✨</text>
    <text x="440" y="120" font-size="24">⭐</text>
  </g>

  <!-- 7. Physics Badge (Top Left) -->
  <g transform="translate(25, 25)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="42" rx="21" fill="#ca8a04" stroke="#fef08a" stroke-width="2"/>
    <text x="85" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="1">SAND PHYSICS ⏳</text>
  </g>
</svg>
