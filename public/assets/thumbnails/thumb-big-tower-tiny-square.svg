<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="60%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="pigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Silo Interior -->
  <rect width="400" height="300" fill="url(#bgGrad)" />

  <!-- Outer Silo Walls with Neon Cyan Trim -->
  <rect x="60" y="0" width="280" height="300" fill="#0f172a" opacity="0.6" />
  <line x1="60" y1="0" x2="60" y2="300" stroke="#38bdf8" stroke-width="6" />
  <line x1="340" y1="0" x2="340" y2="300" stroke="#38bdf8" stroke-width="6" />

  <!-- Tower Platforms -->
  <rect x="60" y="260" width="120" height="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <rect x="220" y="210" width="120" height="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <rect x="130" y="140" width="80" height="18" fill="#ca8a04" stroke="#facc15" stroke-width="2" /> <!-- Crumble platform -->
  <rect x="250" y="90" width="90" height="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />

  <!-- Moving Cyan Laser Beam -->
  <rect x="80" y="175" width="130" height="8" rx="4" fill="url(#laserGrad)" filter="url(#shadow)" />

  <!-- Trampoline -->
  <rect x="70" y="250" width="40" height="10" rx="3" fill="#f59e0b" />

  <!-- The Golden Acorn at Silo Summit -->
  <g transform="translate(295, 60)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="10" ry="14" fill="#facc15" />
    <path d="M-10,-5 Q0,-18 10,-5 Z" fill="#78350f" />
    <rect x="-2" y="-18" width="4" height="6" fill="#78350f" />
    <polygon points="-3,0 -1,4 3,2 1,-2" fill="#ffffff" />
    <!-- Golden Glow Rings -->
    <circle cx="0" cy="0" r="22" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.7" />
  </g>

  <!-- Tiny Square Pig (Pip) executing wall jump -->
  <g transform="translate(200, 105)" filter="url(#shadow)">
    <!-- Motion Kick Arc -->
    <path d="M-15,30 Q-5,15 10,5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- Square Body (18x18 for icon scale) -->
    <rect x="-10" y="-10" width="24" height="24" rx="4" fill="url(#pigGrad)" />

    <!-- Cute Snout -->
    <rect x="-4" y="0" width="12" height="9" rx="2" fill="#fb7185" />
    <circle cx="-1" cy="4.5" r="1" fill="#881337" />
    <circle cx="5" cy="4.5" r="1" fill="#881337" />

    <!-- Joyful Eyes -->
    <circle cx="-3" cy="-3" r="2" fill="#0f172a" />
    <circle cx="7" cy="-3" r="2" fill="#0f172a" />

    <!-- Tiny Floppy Ears -->
    <rect x="-12" y="-12" width="5" height="5" rx="1" fill="#db2777" />
    <rect x="11" y="-12" width="5" height="5" rx="1" fill="#db2777" />

    <!-- Curly Corkscrew Tail -->
    <path d="M-10,4 Q-16,2 -14,-2 Q-10,-4 -12,-8" stroke="#f472b6" stroke-width="2" fill="none" />
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(200, 36)">
    <rect x="-140" y="-18" width="280" height="38" rx="19" fill="#090d16" opacity="0.94" filter="url(#shadow)" />
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#facc15" letter-spacing="1">
      BIG TOWER TINY PIG
    </text>
  </g>
</svg>
