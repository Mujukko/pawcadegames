<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Wooden Pegboard Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Rainbow Fever Burst Gradient -->
    <radialGradient id="feverBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f43f5e" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Shiny Acorn Ball Gradient -->
    <radialGradient id="acornGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <!-- Orange Target Peg Gradient -->
    <radialGradient id="orangePegGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>

    <!-- Blue Peg Gradient -->
    <radialGradient id="bluePegGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>

    <!-- Purple Bonus Peg Gradient -->
    <radialGradient id="purplePegGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </radialGradient>

    <!-- Green Magic Peg Gradient -->
    <radialGradient id="greenPegGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </radialGradient>

    <!-- Wooden Cannon Gradient -->
    <linearGradient id="cannonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Board -->
  <rect width="512" height="512" rx="64" fill="url(#boardGrad)" />

  <!-- Pegboard Pin Grid Holes / Decorative Pegs -->
  <g opacity="0.15">
    <circle cx="80" cy="180" r="4" fill="#ffffff" />
    <circle cx="160" cy="180" r="4" fill="#ffffff" />
    <circle cx="240" cy="180" r="4" fill="#ffffff" />
    <circle cx="320" cy="180" r="4" fill="#ffffff" />
    <circle cx="400" cy="180" r="4" fill="#ffffff" />

    <circle cx="120" cy="240" r="4" fill="#ffffff" />
    <circle cx="200" cy="240" r="4" fill="#ffffff" />
    <circle cx="280" cy="240" r="4" fill="#ffffff" />
    <circle cx="360" cy="240" r="4" fill="#ffffff" />

    <circle cx="80" cy="300" r="4" fill="#ffffff" />
    <circle cx="160" cy="300" r="4" fill="#ffffff" />
    <circle cx="240" cy="300" r="4" fill="#ffffff" />
    <circle cx="320" cy="300" r="4" fill="#ffffff" />
    <circle cx="400" cy="300" r="4" fill="#ffffff" />
  </g>

  <!-- Fever Rainbow Burst behind Center Pegs -->
  <circle cx="256" cy="280" r="160" fill="url(#feverBurst)" />

  <!-- Dotted Trajectory Line from Cannon -->
  <path d="M256 60 Q270 160 210 240" stroke="#facc15" stroke-width="4" stroke-dasharray="6,8" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Surrounding Peg Array -->
  <!-- Blue Pegs -->
  <circle cx="130" cy="190" r="18" fill="url(#bluePegGrad)" filter="url(#dropShadow)" />
  <circle cx="370" cy="190" r="18" fill="url(#bluePegGrad)" filter="url(#dropShadow)" />
  <circle cx="100" cy="310" r="18" fill="url(#bluePegGrad)" filter="url(#dropShadow)" />
  <circle cx="400" cy="310" r="18" fill="url(#bluePegGrad)" filter="url(#dropShadow)" />

  <!-- Purple Bonus Peg -->
  <circle cx="320" cy="230" r="20" fill="url(#purplePegGrad)" filter="url(#glow)" />
  <circle cx="320" cy="230" r="8" fill="#ffffff" opacity="0.4" />

  <!-- Green Magic Peg -->
  <circle cx="150" cy="270" r="20" fill="url(#greenPegGrad)" filter="url(#glow)" />
  <circle cx="150" cy="270" r="8" fill="#ffffff" opacity="0.4" />

  <!-- Orange Target Pegs (Shining with High Energy) -->
  <circle cx="270" cy="180" r="22" fill="url(#orangePegGrad)" filter="url(#glow)" />
  <circle cx="205" cy="245" r="24" fill="url(#orangePegGrad)" filter="url(#glow)" />
  <circle cx="290" cy="330" r="22" fill="url(#orangePegGrad)" filter="url(#glow)" />

  <!-- Center Rebounding Acorn Marble (Dynamic Main Focus) -->
  <g transform="translate(230, 215) rotate(25)" filter="url(#glow)">
    <!-- Bouncy Impact Shockwave Rings -->
    <ellipse cx="0" cy="0" rx="34" ry="24" stroke="#fef08a" stroke-width="4" fill="none" opacity="0.8" />
    <ellipse cx="0" cy="0" rx="46" ry="32" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,6" fill="none" opacity="0.6" />

    <!-- Acorn Nut Cap -->
    <path d="M-16 -10 Q0 -24 16 -10 Q14 -4 -14 -4 Z" fill="#78350f" stroke="#451a03" stroke-width="2" />
    <!-- Acorn Stem -->
    <path d="M0 -20 Q2 -28 8 -30" stroke="#451a03" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Acorn Body -->
    <path d="M-15 -4 Q-18 16 0 24 Q18 16 15 -4 Z" fill="url(#acornGrad)" />
    <!-- Golden Gloss Specular Highlight -->
    <ellipse cx="-5" cy="4" rx="5" ry="8" fill="#ffffff" opacity="0.6" transform="rotate(-15 -5 4)" />
  </g>

  <!-- Sparkles Popping Around Hit -->
  <polygon points="210,195 213,203 221,205 213,207 210,215 207,207 199,205 207,203" fill="#ffffff" filter="url(#glow)" />
  <polygon points="260,250 263,257 270,258 263,260 260,267 258,260 251,258 258,257" fill="#fde047" filter="url(#glow)" />
  <polygon points="175,220 177,225 183,226 177,228 175,233 173,228 168,226 173,225" fill="#38bdf8" />

  <!-- Wooden Acorn Cannon (Top Center) -->
  <g transform="translate(256, 45)" filter="url(#dropShadow)">
    <!-- Cannon Base Turret Ring -->
    <ellipse cx="0" cy="0" rx="44" ry="16" fill="#78350f" stroke="#b45309" stroke-width="3" />
    <ellipse cx="0" cy="0" rx="34" ry="12" fill="#451a03" />
    <!-- Cannon Barrel Angled Downward -->
    <path d="M-18 0 L-22 45 L22 45 L18 0 Z" fill="url(#cannonGrad)" stroke="#d97706" stroke-width="2" />
    <!-- Brass Reinforcement Bands -->
    <rect x="-20" y="16" width="40" height="6" fill="#f59e0b" rx="2" />
    <rect x="-23" y="38" width="46" height="7" fill="#f59e0b" rx="2" />
  </g>

  <!-- Bottom Catch Basket (Sliding Hay Cart) -->
  <g transform="translate(256, 455)" filter="url(#dropShadow)">
    <!-- Wheels -->
    <circle cx="-52" cy="18" r="14" fill="#451a03" stroke="#b45309" stroke-width="3" />
    <circle cx="52" cy="18" r="14" fill="#451a03" stroke="#b45309" stroke-width="3" />
    <circle cx="-52" cy="18" r="4" fill="#f59e0b" />
    <circle cx="52" cy="18" r="4" fill="#f59e0b" />

    <!-- Hay Cart Body -->
    <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#78350f" stroke="#d97706" stroke-width="3" />
    <!-- Gold Trim / Free Ball Plaque -->
    <rect x="-35" y="-6" width="70" height="14" rx="4" fill="#f59e0b" />
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#451a03" text-anchor="middle" letter-spacing="1">FREE BALL</text>
    <!-- Fluffy Golden Straw/Hay Spilling Out -->
    <path d="M-60 -14 Q-45 -26 -30 -14 Q-15 -28 0 -14 Q15 -28 30 -14 Q45 -26 60 -14 Z" fill="#fde047" />
  </g>

  <!-- Sammy the Squirrel Mascot (Bottom Right Corner) -->
  <g transform="translate(425, 435)" filter="url(#dropShadow)">
    <!-- Big Bushy Fluffy Tail -->
    <path d="M-10 10 C-10 -40 30 -60 35 -30 C40 -5 15 25 -5 30 Z" fill="#ea580c" stroke="#9a3412" stroke-width="3" />
    <path d="M-4 5 C-4 -30 24 -45 28 -22 C32 -2 12 20 -2 24 Z" fill="#fed7aa" />

    <!-- Squirrel Body -->
    <ellipse cx="-20" cy="15" rx="20" ry="26" fill="#ea580c" />
    <ellipse cx="-18" cy="18" rx="12" ry="18" fill="#ffedd5" />

    <!-- Head -->
    <circle cx="-25" cy="-18" r="22" fill="#ea580c" />
    <!-- Cheeks & Snout -->
    <ellipse cx="-32" cy="-12" rx="12" ry="9" fill="#ffedd5" />
    <!-- Big Curious Eye -->
    <ellipse cx="-32" cy="-22" rx="5" ry="7" fill="#0f172a" />
    <circle cx="-34" cy="-24" r="2.5" fill="#ffffff" />
    <!-- Cute Nose -->
    <circle cx="-42" cy="-14" r="3" fill="#451a03" />

    <!-- Aviator Goggles & Cap -->
    <path d="M-45 -26 Q-25 -40 -8 -26" stroke="#78350f" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="-32" cy="-30" r="7" fill="#38bdf8" stroke="#f59e0b" stroke-width="2" />
    <circle cx="-16" cy="-30" r="7" fill="#38bdf8" stroke="#f59e0b" stroke-width="2" />

    <!-- Tiny Paws Holding an Acorn -->
    <circle cx="-32" cy="4" r="6" fill="#ea580c" />
    <ellipse cx="-28" cy="6" rx="6" ry="8" fill="url(#acornGrad)" />
  </g>

  <!-- Top Banner: 'PEG POP 🌰' -->
  <g transform="translate(110, 60)" filter="url(#dropShadow)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#0f172a" stroke="#facc15" stroke-width="2.5" />
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="1">PEG POP 🌰✨</text>
  </g>
</svg>
