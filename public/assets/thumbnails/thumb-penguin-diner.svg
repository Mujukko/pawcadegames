<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cafeFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="60%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
    <linearGradient id="tableTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
  </defs>

  <!-- Cafe Ice Floor -->
  <rect width="400" height="300" rx="16" fill="url(#cafeFloor)" />

  <!-- Kitchen Food Counter in Background -->
  <rect x="60" y="30" width="280" height="45" rx="8" fill="#0284C7" />
  <rect x="65" y="35" width="270" height="35" rx="6" fill="#38BDF8" />
  <text x="200" y="58" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" text-anchor="middle">
    ICE KITCHEN STATION
  </text>

  <!-- Left Customer Booth with Polar Bear -->
  <g transform="translate(95, 175)">
    <!-- Wooden Booth -->
    <rect x="-40" y="-35" width="80" height="12" rx="4" fill="#78350F" />
    <rect x="-40" y="25" width="80" height="12" rx="4" fill="#78350F" />
    <!-- Tabletop -->
    <ellipse cx="0" cy="0" rx="36" ry="24" fill="url(#tableTop)" />
    <!-- White Checkers -->
    <line x1="-25" y1="-12" x2="25" y2="12" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="-25" y1="12" x2="25" y2="-12" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Polar Bear Customer -->
    <circle cx="0" cy="-18" r="16" fill="#F8FAFC" />
    <circle cx="-10" cy="-30" r="5" fill="#F8FAFC" />
    <circle cx="10" cy="-30" r="5" fill="#F8FAFC" />
    <circle cx="0" cy="-16" r="3" fill="#0F172A" />
    <circle cx="-5" cy="-22" r="2" fill="#0F172A" />
    <circle cx="5" cy="-22" r="2" fill="#0F172A" />

    <!-- Order Thought Bubble -->
    <g transform="translate(24, -38)">
      <circle cx="0" cy="0" r="13" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
      <text x="0" y="4" font-size="12" text-anchor="middle">🍰</text>
    </g>
  </g>

  <!-- Right Side: Penny the Waitress with Silver Tray -->
  <g transform="translate(265, 175)">
    <!-- Skates -->
    <rect x="-12" y="32" width="10" height="5" fill="#94A3B8" />
    <rect x="2" y="32" width="10" height="5" fill="#94A3B8" />
    <line x1="-14" y1="37" x2="14" y2="37" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />

    <!-- Penguin Body -->
    <ellipse cx="0" cy="12" rx="22" ry="26" fill="#0F172A" />
    <ellipse cx="0" cy="15" rx="14" ry="18" fill="#FFFFFF" />

    <!-- Head -->
    <circle cx="0" cy="-16" r="18" fill="#0F172A" />
    <circle cx="0" cy="-14" r="12" fill="#FFFFFF" />

    <!-- Cute Face & Beak -->
    <polygon points="-5,-14 0,-7 5,-14" fill="#F59E0B" />
    <circle cx="-5" cy="-18" r="2.5" fill="#0F172A" />
    <circle cx="5" cy="-18" r="2.5" fill="#0F172A" />

    <!-- Pink Bowtie -->
    <polygon points="-12,-30 0,-24 -12,-18" fill="#F43F5E" />
    <polygon points="12,-30 0,-24 12,-18" fill="#F43F5E" />
    <circle cx="0" cy="-24" r="4" fill="#F43F5E" />

    <!-- Silver Tray Extended -->
    <rect x="-42" y="-2" width="28" height="5" rx="2" fill="#E2E8F0" />
    <circle cx="-28" cy="-10" r="7" fill="#F59E0B" />
    <text x="-28" y="-7" font-size="10" text-anchor="middle">🍨</text>
  </g>

  <!-- Floating Coins -->
  <circle cx="345" cy="110" r="11" fill="#FBBF24" stroke="#F59E0B" stroke-width="2" />
  <text x="345" y="114" fill="#78350F" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">$</text>

  <!-- Title Badge -->
  <rect x="50" y="250" width="300" height="40" rx="20" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
  <text x="200" y="276" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">
    PENGUIN PASTURE DINER
  </text>
</svg>
