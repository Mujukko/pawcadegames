<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Country Sky Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Golden Wheat Field Gradient -->
    <linearGradient id="wheatField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Mowed Fresh Grass Striped Pattern -->
    <linearGradient id="mowedStripe1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>

    <!-- Tractor Red Gloss -->
    <linearGradient id="tractorRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Chrome Blade Gradient -->
    <linearGradient id="chromeBlade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feOffset dx="0" dy="5" result="offset" />
      <feComposite in="SourceGraphic" in2="offset" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="512" height="512" fill="url(#skyGrad)" />

  <!-- Rolling Hills in Distance -->
  <path d="M0,160 Q140,110 280,150 T512,130 L512,512 L0,512 Z" fill="#15803d" opacity="0.5" />
  <path d="M0,190 Q180,150 360,185 T512,170 L512,512 L0,512 Z" fill="#166534" />

  <!-- Farm Ground Base -->
  <rect x="0" y="210" width="512" height="302" fill="#713f12" />

  <!-- Tall Golden Wheat Field (Uncut Area) -->
  <rect x="0" y="210" width="512" height="170" fill="url(#wheatField)" />
  <!-- Wheat Stalks Texture Lines -->
  <g stroke="#eab308" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="40" y1="210" x2="40" y2="280" />
    <line x1="70" y1="210" x2="70" y2="290" />
    <line x1="110" y1="210" x2="110" y2="275" />
    <line x1="160" y1="210" x2="160" y2="285" />
    <line x1="210" y1="210" x2="210" y2="280" />
    <line x1="380" y1="210" x2="380" y2="290" />
    <line x1="420" y1="210" x2="420" y2="275" />
    <line x1="460" y1="210" x2="460" y2="285" />
  </g>

  <!-- Clean Mowed Stripe Trail (Cut Area in Foreground) -->
  <polygon points="170,290 340,290 380,512 130,512" fill="url(#mowedStripe1)" />
  <line x1="256" y1="290" x2="256" y2="512" stroke="#4d7c0f" stroke-width="4" stroke-dasharray="14,10" opacity="0.6" />

  <!-- Straw Bales in Field -->
  <g transform="translate(80, 420)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="52" height="36" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
    <line x1="16" y1="0" x2="16" y2="36" stroke="#b45309" stroke-width="2.5" />
    <line x1="36" y1="0" x2="36" y2="36" stroke="#b45309" stroke-width="2.5" />
  </g>
  <g transform="translate(400, 410)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="48" height="34" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="3" />
    <line x1="15" y1="0" x2="15" y2="34" stroke="#b45309" stroke-width="2.5" />
    <line x1="33" y1="0" x2="33" y2="34" stroke="#b45309" stroke-width="2.5" />
  </g>

  <!-- Zippy Red Farm Tractor (Center Mower) -->
  <g transform="translate(256, 310)" filter="url(#dropShadow)">
    <!-- Big Rear Rubber Wheels -->
    <rect x="-62" y="-10" width="18" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="44" y="-10" width="18" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Front Smaller Steer Wheels -->
    <rect x="-54" y="-55" width="14" height="32" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="40" y="-55" width="14" height="32" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Tractor Hood / Chassis -->
    <rect x="-42" y="-60" width="84" height="85" rx="14" fill="url(#tractorRed)" stroke="#7f1d1d" stroke-width="3" />

    <!-- Front Engine Grille & Headlights -->
    <rect x="-24" y="-56" width="48" height="16" rx="4" fill="#1e293b" />
    <line x1="-16" y1="-50" x2="16" y2="-50" stroke="#f59e0b" stroke-width="2" />
    <circle cx="-30" cy="-48" r="6" fill="#fef08a" stroke="#eab308" stroke-width="1.5" />
    <circle cx="30" cy="-48" r="6" fill="#fef08a" stroke="#eab308" stroke-width="1.5" />

    <!-- Exhaust Smoke Stack -->
    <rect x="22" y="-72" width="7" height="24" rx="2" fill="#475569" stroke="#1e293b" stroke-width="1.5" />
    <!-- Puffs of Smoke -->
    <circle cx="28" cy="-80" r="5" fill="#f1f5f9" opacity="0.6" />
    <circle cx="32" cy="-90" r="8" fill="#f1f5f9" opacity="0.4" />

    <!-- Front Rotary Mower Deck & Spinning Blade -->
    <g transform="translate(0, -68)">
      <rect x="-50" y="-12" width="100" height="16" rx="6" fill="#475569" stroke="#1e293b" stroke-width="3" />
      <!-- Chrome Blades Spinning -->
      <line x1="-35" y1="-4" x2="-15" y2="-4" stroke="url(#chromeBlade)" stroke-width="5" stroke-linecap="round" />
      <line x1="15" y1="-4" x2="35" y2="-4" stroke="url(#chromeBlade)" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Flying Straw Chaff Particles -->
    <g fill="#fde047">
      <circle cx="-55" cy="-75" r="4" />
      <circle cx="-70" cy="-60" r="5" />
      <circle cx="55" cy="-75" r="4" />
      <circle cx="70" cy="-60" r="5" />
      <circle cx="-62" cy="-90" r="3" />
      <circle cx="62" cy="-90" r="3" />
    </g>
    <text x="-75" y="-85" font-size="16">✨</text>
    <text x="65" y="-85" font-size="16">✨</text>

    <!-- Driver: Barnaby in Straw Hat -->
    <ellipse cx="0" cy="0" rx="18" ry="16" fill="#f59e0b" />
    <!-- Straw Hat Brim -->
    <ellipse cx="0" cy="-8" rx="26" ry="8" fill="#fde047" stroke="#ca8a04" stroke-width="2" />
    <ellipse cx="0" cy="-14" rx="15" ry="9" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
    <!-- Eyes & Smile -->
    <circle cx="-6" cy="0" r="2.5" fill="#0f172a" />
    <circle cx="6" cy="0" r="2.5" fill="#0f172a" />
    <circle cx="0" cy="4" r="3" fill="#0f172a" />
  </g>

  <!-- Header Title Banner -->
  <g transform="translate(256, 46)" filter="url(#dropShadow)">
    <rect x="-150" y="-22" width="300" height="44" rx="22" fill="#0f172a" stroke="#f59e0b" stroke-width="3" opacity="0.95" />
    <text x="0" y="7" font-family="system-ui, sans-serif" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      CROP MOWER: HARVEST
    </text>
  </g>
</svg>
