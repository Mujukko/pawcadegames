<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Bakery Background Gradient -->
    <radialGradient id="bakeryGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#fce7f3" />
      <stop offset="100%" stop-color="#f43f5e" />
    </radialGradient>

    <!-- Hamster Fur Gradient -->
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="40%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- White Belly Gradient -->
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Plate Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Cookie Gradient -->
    <linearGradient id="cookieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Donut Frosting -->
    <linearGradient id="frostPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="60%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4c0519" flood-opacity="0.45" />
    </filter>

    <filter id="sparkleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="40" fill="url(#bakeryGlow)" />

  <!-- Pastel Wallpaper Vertical Stripes -->
  <g opacity="0.18">
    <rect x="32" y="0" width="32" height="512" fill="#e11d48" />
    <rect x="96" y="0" width="32" height="512" fill="#e11d48" />
    <rect x="160" y="0" width="32" height="512" fill="#e11d48" />
    <rect x="224" y="0" width="32" height="512" fill="#e11d48" />
    <rect x="288" y="0" width="32" height="512" fill="#e11d48" />
    <rect x="352" y="0" width="32" height="512" fill="#e11d48" />
    <rect x="416" y="0" width="32" height="512" fill="#e11d48" />
    <rect x="480" y="0" width="32" height="512" fill="#e11d48" />
  </g>

  <!-- Floating Falling Rainbow Sprinkles -->
  <g>
    <rect x="80" y="70" width="8" height="18" rx="4" fill="#38bdf8" transform="rotate(25 80 70)" />
    <rect x="410" y="90" width="8" height="18" rx="4" fill="#facc15" transform="rotate(-35 410 90)" />
    <rect x="60" y="180" width="8" height="18" rx="4" fill="#4ade80" transform="rotate(60 60 180)" />
    <rect x="440" y="220" width="8" height="18" rx="4" fill="#c084fc" transform="rotate(15 440 220)" />
    <rect x="110" y="320" width="8" height="18" rx="4" fill="#fb7185" transform="rotate(-40 110 320)" />
    <rect x="400" y="350" width="8" height="18" rx="4" fill="#38bdf8" transform="rotate(45 400 350)" />
  </g>

  <!-- ================= TALL STACKED DESSERT TOWER ================= -->
  <!-- Layer 1: Golden Waffle (Bottom) -->
  <g transform="translate(256, 310)" filter="url(#softShadow)">
    <rect x="-85" y="-14" width="170" height="28" rx="10" fill="#b45309" stroke="#78350f" stroke-width="2" />
    <rect x="-80" y="-12" width="160" height="24" rx="8" fill="#d97706" />
    <!-- Waffle Grid Cells -->
    <rect x="-65" y="-8" width="18" height="16" rx="3" fill="#92400e" />
    <rect x="-35" y="-8" width="18" height="16" rx="3" fill="#92400e" />
    <rect x="-5" y="-8" width="18" height="16" rx="3" fill="#92400e" />
    <rect x="25" y="-8" width="18" height="16" rx="3" fill="#92400e" />
    <rect x="55" y="-8" width="18" height="16" rx="3" fill="#92400e" />
    <!-- Melting Butter Square -->
    <rect x="-10" y="-18" width="22" height="14" rx="3" fill="#fde047" stroke="#eab308" stroke-width="1.5" />
  </g>

  <!-- Layer 2: Jumbo Choc-Chip Cookie -->
  <g transform="translate(256, 260) rotate(-3)" filter="url(#softShadow)">
    <ellipse cx="0" cy="0" rx="75" ry="24" fill="url(#cookieGrad)" stroke="#78350f" stroke-width="2.5" />
    <!-- Chocolate Chips -->
    <ellipse cx="-45" cy="-5" rx="9" ry="6" fill="#451a03" />
    <ellipse cx="-15" cy="4" rx="10" ry="7" fill="#451a03" />
    <ellipse cx="20" cy="-6" rx="9" ry="6.5" fill="#451a03" />
    <ellipse cx="50" cy="2" rx="8" ry="5.5" fill="#451a03" />
  </g>

  <!-- Layer 3: Pink Glazed Donut -->
  <g transform="translate(256, 212) rotate(4)" filter="url(#softShadow)">
    <!-- Golden Dough Base -->
    <ellipse cx="0" cy="4" rx="68" ry="22" fill="#d97706" />
    <!-- Pink Glaze -->
    <path d="M-66,0 C-66,-16 66,-16 66,0 C66,16 45,22 25,18 C10,22 -10,22 -25,18 C-45,22 -66,16 -66,0 Z" fill="url(#frostPink)" />
    <!-- Donut Hole -->
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="#d97706" />
    <ellipse cx="0" cy="-2" rx="16" ry="6" fill="url(#bakeryGlow)" />
    <!-- Sprinkles on Donut -->
    <rect x="-42" y="-4" width="4" height="10" rx="2" fill="#fef08a" transform="rotate(30 -42 -4)" />
    <rect x="-24" y="-8" width="4" height="10" rx="2" fill="#67e8f9" transform="rotate(-40 -24 -8)" />
    <rect x="25" y="-6" width="4" height="10" rx="2" fill="#ffffff" transform="rotate(20 25 -6)" />
    <rect x="42" y="-2" width="4" height="10" rx="2" fill="#a7f3d0" transform="rotate(-60 42 -2)" />
  </g>

  <!-- Layer 4: Pastel Macaron -->
  <g transform="translate(256, 168) rotate(-2)" filter="url(#softShadow)">
    <!-- Bottom Biscuit Shell -->
    <ellipse cx="0" cy="4" rx="55" ry="14" fill="#38bdf8" />
    <!-- Cream Filling -->
    <ellipse cx="0" cy="0" rx="52" ry="10" fill="#ffffff" />
    <!-- Top Biscuit Shell -->
    <ellipse cx="0" cy="-6" rx="56" ry="15" fill="#0ea5e9" stroke="#0284c7" stroke-width="2" />
    <ellipse cx="-15" cy="-10" rx="22" ry="6" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Layer 5: Cupcake Summit with Swirl Frosting & Cherry (Top) -->
  <g transform="translate(256, 115)" filter="url(#softShadow)">
    <!-- Ribbed Cupcake Liner -->
    <path d="M-30,12 L30,12 L22,34 L-22,34 Z" fill="#f43f5e" stroke="#be185d" stroke-width="2" />
    <line x1="-12" y1="12" x2="-8" y2="34" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="0" y1="12" x2="0" y2="34" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="12" y1="12" x2="8" y2="34" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Big Cream Swirl Frosting -->
    <path d="M-36,12 C-38,-6 0,-18 0,-18 C0,-18 38,-6 36,12 C30,18 -30,18 -36,12 Z" fill="#ffffff" stroke="#fbcfe8" stroke-width="2" />
    <path d="M-22,-4 C-24,-18 0,-26 0,-26 C0,-26 24,-18 22,-4 Z" fill="#fdf2f8" />
    <path d="M-10,-16 C-12,-26 0,-34 0,-34 C0,-34 12,-26 10,-16 Z" fill="#ffffff" />

    <!-- Glossy Red Cherry on Top -->
    <circle cx="0" cy="-38" r="11" fill="#dc2626" filter="url(#sparkleGlow)" />
    <circle cx="-3" cy="-41" r="3" fill="#ffffff" />
    <!-- Cherry Stem -->
    <path d="M0,-47 Q14,-62 18,-68" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- ================= CERAMIC BAKERY SERVING TRAY ================= -->
  <g transform="translate(256, 335)" filter="url(#softShadow)">
    <ellipse cx="0" cy="0" rx="110" ry="14" fill="url(#plateGrad)" stroke="#b45309" stroke-width="3" />
    <ellipse cx="0" cy="-2" rx="100" ry="10" fill="#fef08a" opacity="0.6" />
  </g>

  <!-- ================= MOCHI THE CHUBBY BAKER HAMSTER ================= -->
  <g transform="translate(256, 420)" filter="url(#softShadow)">
    <!-- Chubby Body -->
    <ellipse cx="0" cy="20" rx="68" ry="58" fill="url(#furGrad)" />
    <!-- Cream White Belly -->
    <ellipse cx="0" cy="28" rx="46" ry="42" fill="url(#bellyGrad)" />

    <!-- Cute Round Paws Holding Up Tray -->
    <circle cx="-52" cy="-60" r="16" fill="#fed7aa" stroke="#fb923c" stroke-width="2" />
    <circle cx="52" cy="-60" r="16" fill="#fed7aa" stroke="#fb923c" stroke-width="2" />

    <!-- Big Fluffy Cheeks -->
    <circle cx="-42" cy="-5" r="26" fill="url(#furGrad)" />
    <circle cx="42" cy="-5" r="26" fill="url(#furGrad)" />
    <!-- Rosy Blushing Cheeks -->
    <circle cx="-44" cy="4" r="12" fill="#f43f5e" opacity="0.45" />
    <circle cx="44" cy="4" r="12" fill="#f43f5e" opacity="0.45" />

    <!-- Cute Round Ears -->
    <ellipse cx="-44" cy="-48" rx="16" ry="18" fill="url(#furGrad)" />
    <ellipse cx="-44" cy="-48" rx="10" ry="12" fill="#fbcfe8" />
    <ellipse cx="44" cy="-48" rx="16" ry="18" fill="url(#furGrad)" />
    <ellipse cx="44" cy="-48" rx="10" ry="12" fill="#fbcfe8" />

    <!-- Head -->
    <circle cx="0" cy="-18" r="44" fill="url(#furGrad)" />

    <!-- Big Sparkly Eyes -->
    <ellipse cx="-18" cy="-24" rx="9" ry="12" fill="#0f172a" />
    <circle cx="-21" cy="-28" r="4.5" fill="#ffffff" />
    <circle cx="-15" cy="-20" r="2" fill="#ffffff" />
    <ellipse cx="18" cy="-24" rx="9" ry="12" fill="#0f172a" />
    <circle cx="15" cy="-28" r="4.5" fill="#ffffff" />
    <circle cx="21" cy="-20" r="2" fill="#ffffff" />

    <!-- Tiny Pink Nose -->
    <path d="M-5,-10 L5,-10 L0,-5 Z" fill="#f43f5e" />
    <!-- Happy Cheerful Mouth -->
    <path d="M-10,-5 Q0,4 10,-5" stroke="#7c2d12" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Baker's Toque Hat on Head -->
    <g transform="translate(0, -62)">
      <path d="M-28,14 L28,14 L24,4 L-24,4 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Puffy Hat Dome -->
      <path d="M-36,4 C-45,-20 -15,-34 0,-34 C15,-34 45,-20 36,4 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    </g>
  </g>

  <!-- Big Floating "PERFECT x5!" Star Burst Banner -->
  <g transform="translate(115, 120)" filter="url(#sparkleGlow)">
    <circle cx="0" cy="0" r="24" fill="#fde047" stroke="#eab308" stroke-width="3" />
    <path d="M0,-14 L4,-4 L14,-4 L6,2 L9,12 L0,6 L-9,12 L-6,2 L-14,-4 L-4,-4 Z" fill="#f59e0b" />
  </g>

  <!-- Outer Border Frame -->
  <rect width="512" height="512" rx="40" fill="none" stroke="#fb7185" stroke-width="8" stroke-opacity="0.8" />
  <rect width="506" height="506" x="3" y="3" rx="37" fill="none" stroke="#fde047" stroke-width="2" stroke-opacity="0.5" />
</svg>
