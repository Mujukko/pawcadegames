<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pondGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="nestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Pond Water -->
  <rect width="400" height="300" fill="url(#pondGrad)" />

  <!-- Animated Water Ripples -->
  <path d="M20 50 Q60 45 100 50 T180 50 T260 50 T340 50" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
  <path d="M50 110 Q90 105 130 110 T210 110 T290 110 T370 110" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3" />
  <path d="M30 230 Q70 225 110 230 T190 230 T270 230 T350 230" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.35" />

  <!-- Distant Rowboat -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="70" height="18" rx="6" fill="#78350f" />
    <line x1="25" y1="2" x2="35" y2="-10" stroke="#fde047" stroke-width="2.5" />
    <line x1="45" y1="2" x2="55" y2="-10" stroke="#fde047" stroke-width="2.5" />
  </g>

  <!-- Lilypads with Lotus Flowers -->
  <g transform="translate(330, 80)">
    <path d="M0 0 A24 24 0 1 1 15 15 L0 0 Z" fill="#15803d" />
    <circle cx="6" cy="-4" r="6" fill="#f472b6" />
    <circle cx="8" cy="-6" r="3" fill="#ffffff" />
  </g>
  <g transform="translate(60, 240)">
    <path d="M0 0 A20 20 0 1 1 12 12 L0 0 Z" fill="#15803d" />
  </g>

  <!-- Reeds Nest on Shore -->
  <g transform="translate(340, 250)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="45" ry="30" fill="url(#nestGrad)" />
    <ellipse cx="0" cy="0" rx="34" ry="20" fill="#a16207" />
    <!-- Reeds -->
    <line x1="-35" y1="-10" x2="-45" y2="-28" stroke="#166534" stroke-width="3" stroke-linecap="round" />
    <line x1="-20" y1="-20" x2="-25" y2="-40" stroke="#166534" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="-22" x2="0" y2="-45" stroke="#166534" stroke-width="3.5" stroke-linecap="round" />
    <line x1="20" y1="-20" x2="25" y2="-38" stroke="#166534" stroke-width="3" stroke-linecap="round" />
    <line x1="35" y1="-10" x2="42" y2="-26" stroke="#166534" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Follow-the-Leader Duckling Chain -->
  <!-- Duckling 4 -->
  <g transform="translate(100, 195)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="8" fill="#facc15" />
    <circle cx="4" cy="-4" r="5" fill="#facc15" />
    <polygon points="8,-4 13,-2 8,0" fill="#f97316" />
    <circle cx="5" cy="-5" r="1.2" fill="#0f172a" />
  </g>

  <!-- Duckling 3 -->
  <g transform="translate(135, 185)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="9" fill="#facc15" />
    <circle cx="4.5" cy="-4" r="5.5" fill="#facc15" />
    <polygon points="9,-4 14,-2 9,0" fill="#f97316" />
    <circle cx="5.5" cy="-5" r="1.3" fill="#0f172a" />
  </g>

  <!-- Duckling 2 -->
  <g transform="translate(175, 175)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="10" fill="#facc15" />
    <circle cx="5" cy="-4.5" r="6" fill="#facc15" />
    <polygon points="10,-4.5 16,-2 10,0.5" fill="#f97316" />
    <circle cx="6" cy="-5.5" r="1.4" fill="#0f172a" />
  </g>

  <!-- Duckling 1 -->
  <g transform="translate(215, 165)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="11" fill="#facc15" />
    <circle cx="6" cy="-5" r="6.5" fill="#facc15" />
    <polygon points="11,-5 18,-2 11,1" fill="#f97316" />
    <circle cx="7" cy="-6" r="1.5" fill="#0f172a" />
  </g>

  <!-- Mama Duck (Leader in Front) -->
  <g transform="translate(265, 150)" filter="url(#shadow)">
    <!-- Swimming V-Wake -->
    <path d="M-15,0 L-35,-12 M-15,0 L-35,12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- White Body -->
    <ellipse cx="0" cy="0" rx="24" ry="16" fill="#f8fafc" />

    <!-- Head -->
    <circle cx="18" cy="-5" r="13" fill="#f8fafc" />

    <!-- Orange Bill -->
    <polygon points="28,-8 42,-3 28,2" fill="#f97316" />

    <!-- Eye -->
    <circle cx="21" cy="-7" r="2.5" fill="#0f172a" />
    <circle cx="22" cy="-8" r="0.8" fill="#ffffff" />

    <!-- Pink Flower Crown Hat -->
    <circle cx="14" cy="-17" r="4" fill="#f472b6" />
    <circle cx="19" cy="-19" r="4.5" fill="#f43f5e" />
    <circle cx="24" cy="-17" r="4" fill="#f472b6" />
    <circle cx="19" cy="-19" r="1.5" fill="#fef08a" />
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(200, 36)">
    <rect x="-145" y="-18" width="290" height="38" rx="19" fill="#090d16" opacity="0.94" filter="url(#shadow)" />
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#facc15" letter-spacing="1">
      DUCKLING POND RESCUE
    </text>
  </g>
</svg>
