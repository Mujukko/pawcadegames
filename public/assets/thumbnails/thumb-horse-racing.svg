<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="turfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sky & Hills -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <path d="M0,380 Q200,320 400,350 T800,330 L800,420 L0,420 Z" fill="#166534" opacity="0.6"/>
  <path d="M0,400 Q260,360 520,380 T800,370 L800,440 L0,440 Z" fill="#15803d"/>

  <!-- Racetrack Turf -->
  <rect y="420" width="800" height="180" fill="url(#turfGrad)"/>

  <!-- White Rail Dividers -->
  <line x1="0" y1="480" x2="800" y2="480" stroke="#ffffff" stroke-width="4" stroke-dasharray="24,24" opacity="0.6"/>
  <line x1="0" y1="540" x2="800" y2="540" stroke="#ffffff" stroke-width="4" stroke-dasharray="24,24" opacity="0.6"/>

  <!-- Steeplechase Wooden Fence -->
  <g transform="translate(560, 420)">
    <rect x="-6" y="-30" width="12" height="65" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="74" y="-30" width="12" height="65" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="-10" y="-20" width="100" height="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="-10" y="5" width="100" height="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Jumping Horse Group -->
  <g transform="translate(380, 360)" filter="url(#shadow)">
    <!-- Horse Tail -->
    <path d="M-90,-10 C-130,-15 -140,25 -110,40 C-95,30 -85,10 -80,0 Z" fill="#fde047"/>

    <!-- Hind Legs -->
    <path d="M-60,20 L-85,75 L-65,80" stroke="#b45309" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M-40,20 L-60,70 L-40,75" stroke="#92400e" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Horse Body -->
    <ellipse cx="-10" cy="10" rx="75" ry="36" fill="#b45309" transform="rotate(-15)"/>

    <!-- Forelegs Jumping High -->
    <path d="M45,20 L80,0 L110,25" stroke="#92400e" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M55,20 L95,-5 L130,15" stroke="#b45309" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- Neck & Head -->
    <path d="M35,-5 L85,-55 L125,-40 L70,30 Z" fill="#b45309"/>
    <!-- Head/Muzzle -->
    <circle cx="115" cy="-45" r="20" fill="#b45309"/>
    <circle cx="130" cy="-40" r="12" fill="#92400e"/>
    <polygon points="90,-65 96,-85 106,-65" fill="#b45309"/>

    <!-- Mane -->
    <path d="M40,-5 C55,-35 75,-60 85,-65 C82,-45 70,-20 60,10 Z" fill="#fde047"/>

    <!-- Jockey -->
    <rect x="0" y="-45" width="32" height="36" rx="8" fill="#0284c7" transform="rotate(-15)"/>
    <circle cx="18" cy="-55" r="14" fill="#facc15"/>
    <circle cx="28" cy="-55" r="6" fill="#0284c7"/>
    <path d="M12,-20 L35,-10 L50,-30" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Golden Horseshoe Trophy Badge -->
  <g transform="translate(130, 140)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="65" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="5"/>
    <!-- Horseshoe Shape -->
    <path d="M-28,-25 A35,35 0 1,0 28,-25 L16,-20 A22,22 0 1,1 -16,-20 Z" fill="#ffffff"/>
    <circle cx="-22" cy="-22" r="5" fill="#b45309"/>
    <circle cx="22" cy="-22" r="5" fill="#b45309"/>
    <circle cx="-32" cy="0" r="4" fill="#b45309"/>
    <circle cx="32" cy="0" r="4" fill="#b45309"/>
  </g>

  <!-- Big Title Banner -->
  <g transform="translate(400, 85)" filter="url(#shadow)">
    <rect x="-310" y="-50" width="620" height="90" rx="24" fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1">
      BARNYARD DERBY
    </text>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
      HORSE RACING CHAMPION 🐎
    </text>
  </g>
</svg>
