<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfccb"/>
      <stop offset="100%" stop-color="#bef264"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#a3e635" stroke-width="2" opacity="0.55">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
  </g>
  <!-- Fox territory -->
  <rect x="380" y="60" width="160" height="140" rx="14" fill="#f97316"/>
  <rect x="380" y="186" width="160" height="14" rx="6" fill="#c2410c"/>
  <!-- Sheep owned territory -->
  <rect x="70" y="120" width="210" height="200" rx="16" fill="#22c55e"/>
  <rect x="70" y="304" width="210" height="16" rx="6" fill="#15803d"/>
  <!-- Sheep active trail loop -->
  <path d="M 280 180 L 420 180 L 420 290 L 280 290" fill="none" stroke="#4ade80" stroke-width="26" stroke-dasharray="28 14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sheep avatar -->
  <circle cx="345" cy="290" r="34" fill="#16a34a" stroke="#ffffff" stroke-width="6"/>
  <text x="345" y="302" font-size="38" text-anchor="middle">🐑</text>
  <!-- Crown -->
  <text x="345" y="246" font-size="28" text-anchor="middle">👑</text>
  <!-- Rival fox avatar -->
  <circle cx="460" cy="120" r="28" fill="#ea580c" stroke="#ffffff" stroke-width="5"/>
  <text x="460" y="131" font-size="30" text-anchor="middle">🦊</text>
  <!-- Title pill -->
  <rect x="130" y="20" width="340" height="52" rx="26" fill="#052e16" opacity="0.9"/>
  <text x="300" y="54" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="28" fill="#bef264" text-anchor="middle">PASTURE PAPER.IO</text>
</svg>
