<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="slopeSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <radialGradient id="acornGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <linearGradient id="runwayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="speedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="400" fill="url(#slopeSky)" />

  <!-- Distant Mountains -->
  <polygon points="0,160 80,120 180,160 260,110 360,160 460,130 600,160 600,400 0,400" fill="#1c1917" opacity="0.6" />

  <!-- 3D Perspective Track -->
  <polygon points="280,140 320,140 460,400 140,400" fill="url(#runwayGrad)" />

  <!-- Neon Glowing Edges -->
  <line x1="280" y1="140" x2="140" y2="400" stroke="#f59e0b" stroke-width="6" filter="url(#speedGlow)" />
  <line x1="320" y1="140" x2="460" y2="400" stroke="#f59e0b" stroke-width="6" filter="url(#speedGlow)" />

  <!-- Track Horizontal Stripes -->
  <line x1="260" y1="180" x2="340" y2="180" stroke="#facc15" stroke-width="2" opacity="0.5" />
  <line x1="230" y1="230" x2="370" y2="230" stroke="#facc15" stroke-width="3" opacity="0.5" />
  <line x1="190" y1="290" x2="410" y2="290" stroke="#facc15" stroke-width="4" opacity="0.5" />
  <line x1="150" y1="360" x2="450" y2="360" stroke="#facc15" stroke-width="5" opacity="0.5" />

  <!-- Red Tractor Tire Obstacle in Distance -->
  <rect x="250" y="210" width="30" height="20" fill="#dc2626" stroke="#fef08a" stroke-width="2" rx="4" />

  <!-- Speed Motion Streaks -->
  <line x1="180" y1="240" x2="160" y2="320" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
  <line x1="420" y1="240" x2="440" y2="320" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

  <!-- Rolling Acorn (Hero in Foreground) -->
  <g transform="translate(300, 310)">
    <!-- Shadow -->
    <ellipse cx="0" cy="40" rx="36" ry="8" fill="rgba(0,0,0,0.4)" />

    <!-- Motion trail -->
    <path d="M -20 -10 Q 0 -50 20 -10" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.5" fill="none" />

    <!-- Acorn Body -->
    <circle cx="0" cy="0" r="38" fill="url(#acornGrad)" filter="url(#speedGlow)" />

    <!-- Acorn Texture lines -->
    <path d="M -20 10 Q 0 34 20 10" stroke="#92400e" stroke-width="3" fill="none" />
    <path d="M -26 0 Q 0 28 26 0" stroke="#92400e" stroke-width="3" fill="none" />

    <!-- Cap -->
    <path d="M -36 -12 A 38 38 0 0 1 36 -12 Z" fill="#451a03" />
    <rect x="-3" y="-52" width="6" height="16" fill="#292524" rx="2" />
  </g>

  <!-- Title Badge -->
  <rect x="25" y="325" width="220" height="50" rx="12" fill="#090d16" opacity="0.95" stroke="#f59e0b" stroke-width="2" />
  <text x="135" y="348" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">SLOPE</text>
  <text x="135" y="365" fill="#f59e0b" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">ROLLING ACORN DASH</text>
</svg>
