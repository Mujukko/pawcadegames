<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bottleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bottleBg)" />
  <!-- Table Platform -->
  <rect x="180" y="270" width="240" height="45" rx="8" fill="#b45309" />
  <!-- Glass Milk Bottle in Flight -->
  <g transform="translate(300, 180) rotate(-25)">
    <rect x="-20" y="-70" width="40" height="70" rx="8" fill="rgba(255,255,255,0.9)" stroke="#64748b" stroke-width="3" />
    <rect x="-16" y="-55" width="32" height="50" rx="4" fill="#ffffff" />
    <rect x="-16" y="-45" width="32" height="22" fill="#0284c7" />
    <text x="0" y="-30" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">MILK</text>
    <rect x="-10" y="-80" width="20" height="12" fill="#94a3b8" />
    <rect x="-12" y="-86" width="24" height="7" rx="3" fill="#cbd5e1" />
  </g>
  <text x="300" y="365" fill="#451a03" font-family="sans-serif" font-size="24" font-weight="900" text-anchor="middle">MILK BOTTLE FLIP 3D</text>
</svg>
