    <rect x="0" y="0" width="100" height="100"/><rect x="200" y="0" width="100" height="100"/><rect x="400" y="0" width="100" height="100"/>
    <rect x="100" y="100" width="100" height="100"/><rect x="300" y="100" width="100" height="100"/><rect x="500" y="100" width="100" height="100"/>
    <rect x="0" y="200" width="100" height="100"/><rect x="200" y="200" width="100" height="100"/><rect x="400" y="200" width="100" height="100"/>
    <rect x="100" y="300" width="100" height="100"/><rect x="300" y="300" width="100" height="100"/><rect x="500" y="300" width="100" height="100"/>
