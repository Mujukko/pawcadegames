  <!-- worm body -->
  <path d="M 90 250 C 150 250 150 150 230 150 S 330 250 400 220" fill="none" stroke="#65a30d" stroke-width="46" stroke-linecap="round"/>
  <path d="M 90 250 C 150 250 150 150 230 150 S 330 250 400 220" fill="none" stroke="#84cc16" stroke-width="30" stroke-linecap="round"/>
