  <circle cx="494" cy="196" r="7" fill="#fff" opacity="0.55"/>
  <!-- rock -->
  <rect x="120" y="290" width="56" height="44" rx="14" fill="#78716c"/>
  <text x="300" y="60" fill="#14532d" font-family="sans-serif" font-size="30" font-weight="900" text-anchor="middle">BARNYARD SNAKE</text>
