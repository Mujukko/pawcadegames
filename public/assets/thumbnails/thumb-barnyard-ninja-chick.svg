<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Silo Atmosphere Gradients -->
    <linearGradient id="siloBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Wooden Platform Gradient -->
    <linearGradient id="woodPlat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Steel Buzzsaw Blade Gradient -->
    <radialGradient id="steelSaw" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="90%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>

    <!-- Ninja Chick Yellow Gradient -->
    <radialGradient id="ninjaChickGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="90%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Silo Background -->
  <rect width="600" height="400" fill="url(#siloBg)" />

  <!-- Background Wooden Beams & Trusses -->
  <line x1="0" y1="100" x2="600" y2="100" stroke="#475569" stroke-width="6" opacity="0.4" />
  <line x1="0" y1="240" x2="600" y2="240" stroke="#475569" stroke-width="6" opacity="0.4" />
  <line x1="120" y1="0" x2="120" y2="400" stroke="#334155" stroke-width="8" opacity="0.3" />
  <line x1="480" y1="0" x2="480" y2="400" stroke="#334155" stroke-width="8" opacity="0.3" />

  <!-- Wall Climbing Vertical Shaft (Right) -->
  <rect x="440" y="40" width="36" height="340" fill="url(#woodPlat)" stroke="#451a03" stroke-width="3" filter="url(#dropShadow)" />
  <!-- Wall Climbing Shaft (Left) -->
  <rect x="160" y="140" width="36" height="240" fill="url(#woodPlat)" stroke="#451a03" stroke-width="3" filter="url(#dropShadow)" />

  <!-- Mid Wooden Ledges -->
  <rect x="40" y="320" width="160" height="24" rx="4" fill="url(#woodPlat)" stroke="#451a03" stroke-width="2" />
  <rect x="250" y="260" width="120" height="24" rx="4" fill="url(#woodPlat)" stroke="#451a03" stroke-width="2" />

  <!-- Yellow Bouncy Hay Trampoline -->
  <g transform="translate(280, 246)">
    <rect x="0" y="0" width="60" height="14" rx="6" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <path d="M6,6 Q30,-4 54,6" fill="none" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Checkpoint Flagpole (Glowing Green) -->
  <g transform="translate(80, 270)">
    <line x1="0" y1="0" x2="0" y2="50" stroke="#cbd5e1" stroke-width="3" />
    <polygon points="0,4 28,14 0,24" fill="#22c55e" stroke="#15803d" stroke-width="2" />
    <circle cx="0" cy="2" r="4" fill="#facc15" />
  </g>

  <!-- Spinning Steel Buzzsaw Hazard -->
  <g transform="translate(340, 150)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="32" fill="url(#steelSaw)" stroke="#0f172a" stroke-width="2" />
    <!-- Saw Teeth -->
    <path d="M0,-32 L6,-26 L16,-30 L18,-20 L28,-18 L24,-8 L32,0 L24,8 L28,18 L18,20 L16,30 L6,26 L0,32 L-6,26 L-16,30 L-18,20 L-28,18 L-24,8 L-32,0 L-24,-8 L-28,-18 L-18,-20 L-16,-30 L-6,-26 Z" fill="#94a3b8" />
    <circle cx="0" cy="0" r="10" fill="#334155" stroke="#1e293b" stroke-width="2" />
    <!-- Center Bolt -->
    <circle cx="0" cy="0" r="4" fill="#f8fafc" />
    <!-- Spark Particles -->
    <circle cx="28" cy="24" r="2.5" fill="#facc15" />
    <circle cx="36" cy="18" r="1.5" fill="#f97316" />
    <circle cx="22" cy="32" r="2" fill="#fef08a" />
  </g>

  <!-- Hero Ninja Baby Chick (Wall Jumping in Mid-Air) -->
  <g transform="translate(380, 220) rotate(-15)" filter="url(#dropShadow)">
    <!-- Acrobat Kick Streaks -->
    <line x1="45" y1="20" x2="65" y2="35" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="30" y1="35" x2="45" y2="55" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

    <!-- Round Chick Body -->
    <ellipse cx="0" cy="4" rx="26" ry="22" fill="url(#ninjaChickGrad)" stroke="#b45309" stroke-width="2.5" />

    <!-- Extended Ninja Wing -->
    <path d="M-10,-4 Q-34,-18 -16,-22 Q-4,-14 6,-2 Z" fill="url(#ninjaChickGrad)" stroke="#b45309" stroke-width="2" />

    <!-- Chick Head -->
    <circle cx="16" cy="-14" r="20" fill="url(#ninjaChickGrad)" stroke="#b45309" stroke-width="2.5" />

    <!-- Black Ninja Mask / Cowl -->
    <path d="M0,-24 Q18,-32 34,-20 Q36,-8 20,-4 Q6,-4 0,-14 Z" fill="#0f172a" stroke="#020617" stroke-width="2" />

    <!-- Fierce Determined Eyes peering through mask slit -->
    <ellipse cx="18" cy="-16" rx="4" ry="2" fill="#ffffff" />
    <circle cx="19" cy="-16" r="1.5" fill="#ef4444" />

    <!-- Black Headband Ribbon fluttering backward -->
    <path d="M0,-20 L-22,-32 L-14,-18 Z" fill="#0f172a" />
    <path d="M-2,-16 L-28,-24 L-18,-12 Z" fill="#1e293b" />

    <!-- Tiny Orange Beak -->
    <polygon points="32,-14 42,-12 33,-8" fill="#ea580c" stroke="#9a3412" stroke-width="1.5" />

    <!-- Martial Arts Feet in Kick Stance -->
    <ellipse cx="-8" cy="26" rx="9" ry="4" fill="#ea580c" transform="rotate(-30 -8 26)" />
    <ellipse cx="24" cy="24" rx="9" ry="4" fill="#ea580c" transform="rotate(35 24 24)" />
  </g>

  <!-- Title Badge Banner at Top Left -->
  <g transform="translate(24, 24)" filter="url(#dropShadow)">
    <rect width="280" height="66" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
    <rect x="4" y="4" width="272" height="58" rx="14" fill="#0f172a" />
    <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#facc15" letter-spacing="2">🥷 2D PRECISION PLATFORMER</text>
    <text x="18" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff">NINJA CHICK PARKOUR</text>
  </g>
</svg>
