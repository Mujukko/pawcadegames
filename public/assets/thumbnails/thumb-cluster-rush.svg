<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="truckYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="truckRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="400" height="120" fill="url(#skyGrad)" />
  <circle cx="310" cy="50" r="26" fill="#fef08a" opacity="0.9" />

  <!-- Distant Mountains -->
  <polygon points="0,120 70,80 150,115 220,85 300,120" fill="#b45309" opacity="0.7" />
  <polygon points="120,120 200,75 280,120" fill="#9a3412" opacity="0.6" />

  <!-- Road Asphalt (Perspective trapezoid) -->
  <polygon points="0,300 400,300 240,120 160,120" fill="url(#roadGrad)" />

  <!-- Dashed Yellow Lines -->
  <polygon points="198,120 202,120 205,150 195,150" fill="#facc15" />
  <polygon points="194,170 206,170 210,210 190,210" fill="#facc15" />
  <polygon points="188,230 212,230 218,290 182,290" fill="#facc15" />

  <!-- Background Truck 1 (Distant Hay Wagon) -->
  <g transform="translate(170, 130)">
    <polygon points="0,15 45,15 50,0 5,0" fill="#ca8a04" />
    <rect x="0" y="15" width="45" height="15" fill="#a16207" />
    <circle cx="8" cy="30" r="4" fill="#0f172a" />
    <circle cx="37" cy="30" r="4" fill="#0f172a" />
  </g>

  <!-- Midground Truck 2 (Red Livestock Truck on Left) -->
  <g transform="translate(70, 160)">
    <polygon points="0,35 70,35 80,0 10,0" fill="url(#truckRed)" />
    <rect x="0" y="35" width="70" height="30" fill="#991b1b" />
    <circle cx="15" cy="65" r="7" fill="#020617" />
    <circle cx="55" cy="65" r="7" fill="#020617" />
    <!-- Rear Taillights -->
    <circle cx="8" cy="45" r="3" fill="#ef4444" />
    <circle cx="62" cy="45" r="3" fill="#ef4444" />
  </g>

  <!-- Foreground Truck 3 (Big Yellow Hay Wagon on Right) -->
  <g transform="translate(210, 200)">
    <polygon points="0,50 110,50 125,0 15,0" fill="url(#truckYellow)" />
    <rect x="0" y="50" width="110" height="45" fill="#ca8a04" />
    <circle cx="20" cy="95" r="11" fill="#020617" />
    <circle cx="90" cy="95" r="11" fill="#020617" />
    <circle cx="10" cy="65" r="4" fill="#ef4444" />
    <circle cx="100" cy="65" r="4" fill="#ef4444" />
  </g>

  <!-- Daredevil Goat Buster (Leaping from Left Truck to Right Truck) -->
  <g transform="translate(180, 150) rotate(12)" filter="url(#shadow)">
    <!-- Red Cape Fluttering -->
    <polygon points="-15,0 -40,-12 -28,8" fill="#ef4444" />

    <!-- White Goat Body -->
    <ellipse cx="0" cy="4" rx="16" ry="12" fill="#f8fafc" />

    <!-- Goat Head -->
    <circle cx="14" cy="-6" r="11" fill="#f8fafc" />

    <!-- Aviator Goggles -->
    <rect x="8" y="-10" width="14" height="6" rx="2" fill="#0f172a" />
    <rect x="10" y="-9" width="4" height="4" fill="#38bdf8" />
    <rect x="16" y="-9" width="4" height="4" fill="#38bdf8" />

    <!-- Golden Goat Horns -->
    <path d="M12,-16 Q8,-26 2,-28" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M18,-16 Q24,-26 28,-24" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- White Beard -->
    <polygon points="12,4 16,12 18,4" fill="#e2e8f0" />

    <!-- Extended Hooves -->
    <rect x="-8" y="12" width="4" height="10" rx="2" fill="#f8fafc" />
    <rect x="-8" y="20" width="4" height="3" fill="#334155" />
    <rect x="6" y="12" width="4" height="10" rx="2" fill="#f8fafc" />
    <rect x="6" y="20" width="4" height="3" fill="#334155" />

    <!-- Wind Motion Lines -->
    <line x1="-30" y1="20" x2="-5" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="-40" y1="28" x2="-15" y2="28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(200, 36)">
    <rect x="-140" y="-18" width="280" height="38" rx="19" fill="#090d16" opacity="0.92" filter="url(#shadow)" />
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#facc15" letter-spacing="1">
      BARNYARD TRUCK JUMPER
    </text>
  </g>
</svg>
