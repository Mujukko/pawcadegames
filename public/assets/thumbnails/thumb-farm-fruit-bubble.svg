<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <radialGradient id="appleGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>
    <radialGradient id="pearGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#d9f99d" />
      <stop offset="50%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#3f6212" />
    </radialGradient>
    <radialGradient id="plumGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#581c87" />
    </radialGradient>
    <radialGradient id="lemonGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Sky & Pasture Background -->
  <rect width="512" height="512" rx="48" fill="url(#bgGrad)" />

  <!-- Floating Clouds -->
  <path d="M 60 120 A 24 24 0 0 1 100 90 A 32 32 0 0 1 150 110 A 20 20 0 0 1 170 130 Z" fill="#ffffff" opacity="0.8" />
  <path d="M 360 80 A 28 28 0 0 1 410 60 A 36 36 0 0 1 470 90 Z" fill="#ffffff" opacity="0.7" />

  <!-- Top Wooden Beam with Vine Leaves -->
  <rect x="0" y="0" width="512" height="32" fill="#78350f" />
  <rect x="0" y="28" width="512" height="6" fill="#92400e" />
  <path d="M 30 32 C 60 50 100 25 140 32 C 180 50 220 25 260 32 C 300 50 340 25 380 32 C 420 50 460 25 500 32" stroke="#16a34a" stroke-width="6" fill="none" />

  <!-- Bubble Clusters -->
  <!-- Top Row -->
  <circle cx="100" cy="110" r="44" fill="url(#appleGrad)" stroke="#7f1d1d" stroke-width="4" filter="url(#dropShadow)" />
  <text x="100" y="122" font-size="38" text-anchor="middle">🍎</text>
  <ellipse cx="86" cy="94" rx="14" ry="8" fill="#ffffff" opacity="0.5" transform="rotate(-30 86 94)" />

  <circle cx="190" cy="110" r="44" fill="url(#pearGrad)" stroke="#365314" stroke-width="4" filter="url(#dropShadow)" />
  <text x="190" y="122" font-size="38" text-anchor="middle">🍐</text>
  <ellipse cx="176" cy="94" rx="14" ry="8" fill="#ffffff" opacity="0.5" transform="rotate(-30 176 94)" />

  <circle cx="280" cy="110" r="44" fill="url(#plumGrad)" stroke="#581c87" stroke-width="4" filter="url(#dropShadow)" />
  <text x="280" y="122" font-size="38" text-anchor="middle">🍇</text>
  <ellipse cx="266" cy="94" rx="14" ry="8" fill="#ffffff" opacity="0.5" transform="rotate(-30 266 94)" />

  <circle cx="370" cy="110" r="44" fill="url(#lemonGrad)" stroke="#713f12" stroke-width="4" filter="url(#dropShadow)" />
  <text x="370" y="122" font-size="38" text-anchor="middle">🍋</text>
  <ellipse cx="356" cy="94" rx="14" ry="8" fill="#ffffff" opacity="0.5" transform="rotate(-30 356 94)" />

  <!-- Second Row (Staggered) -->
  <circle cx="145" cy="180" r="44" fill="url(#pearGrad)" stroke="#365314" stroke-width="4" filter="url(#dropShadow)" />
  <text x="145" y="192" font-size="38" text-anchor="middle">🍐</text>
  <ellipse cx="131" cy="164" rx="14" ry="8" fill="#ffffff" opacity="0.5" transform="rotate(-30 131 164)" />

  <circle cx="235" cy="180" r="44" fill="url(#appleGrad)" stroke="#7f1d1d" stroke-width="4" filter="url(#dropShadow)" />
  <text x="235" y="192" font-size="38" text-anchor="middle">🍎</text>
  <ellipse cx="221" cy="164" rx="14" ry="8" fill="#ffffff" opacity="0.5" transform="rotate(-30 221 164)" />

  <circle cx="325" cy="180" r="44" fill="url(#appleGrad)" stroke="#7f1d1d" stroke-width="4" filter="url(#dropShadow)" />
  <text x="325" y="192" font-size="38" text-anchor="middle">🍎</text>
  <ellipse cx="311" cy="164" rx="14" ry="8" fill="#ffffff" opacity="0.5" transform="rotate(-30 311 164)" />

  <!-- Popping Golden Starburst Effect on matching Apples -->
  <path d="M 235 140 L 240 160 L 260 165 L 240 170 L 235 190 L 230 170 L 210 165 L 230 160 Z" fill="#facc15" filter="url(#dropShadow)" />
  <circle cx="280" cy="150" r="6" fill="#facc15" />
  <circle cx="190" cy="160" r="8" fill="#facc15" />

  <!-- Flying Apple Bubble -->
  <line x1="256" y1="420" x2="240" y2="280" stroke="#ffffff" stroke-width="5" stroke-dasharray="10 10" opacity="0.8" />
  <circle cx="240" cy="270" r="48" fill="url(#appleGrad)" stroke="#7f1d1d" stroke-width="5" filter="url(#dropShadow)" />
  <text x="240" y="284" font-size="42" text-anchor="middle">🍎</text>
  <ellipse cx="225" cy="252" rx="16" ry="10" fill="#ffffff" opacity="0.6" transform="rotate(-30 225 252)" />

  <!-- Rustic Slingshot at Bottom -->
  <rect x="246" y="440" width="20" height="72" rx="6" fill="#78350f" stroke="#451a03" stroke-width="3" />
  <path d="M 220 400 L 246 450 L 266 450 L 292 400" stroke="#92400e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 220 400 L 256 420 L 292 400" stroke="#451a03" stroke-width="6" fill="none" />

  <!-- Wooden Harvest Crate at Bottom Right -->
  <rect x="360" y="440" width="110" height="60" rx="8" fill="#b45309" stroke="#78350f" stroke-width="4" filter="url(#dropShadow)" />
  <line x1="360" y1="470" x2="470" y2="470" stroke="#78350f" stroke-width="3" />
  <text x="415" y="475" font-size="28" text-anchor="middle">🍎🍐🍇</text>
</svg>
