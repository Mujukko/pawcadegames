<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="60%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>

    <!-- Wooden Grid Board Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Golden Chick Token Gradient (Yellow/Gold) -->
    <radialGradient id="chickTokenGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="90%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>

    <!-- Red Apple / Pig Token Gradient (Red) -->
    <radialGradient id="appleTokenGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="85%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <!-- Slot Cavity Depth Shadow -->
    <radialGradient id="slotInnerShadow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.8" />
    </radialGradient>

    <!-- Glowing Win Beam -->
    <linearGradient id="winBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#fde047" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.2" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Warm Barn Workshop -->
  <rect width="600" height="400" fill="url(#bgGrad)" />

  <!-- Barn Plank Lines -->
  <line x1="0" y1="80" x2="600" y2="80" stroke="#f59e0b" stroke-width="2" opacity="0.4" />
  <line x1="0" y1="160" x2="600" y2="160" stroke="#f59e0b" stroke-width="2" opacity="0.4" />
  <line x1="0" y1="240" x2="600" y2="240" stroke="#f59e0b" stroke-width="2" opacity="0.4" />
  <line x1="0" y1="320" x2="600" y2="320" stroke="#f59e0b" stroke-width="2" opacity="0.4" />

  <!-- The 7x6 Connect 4 Blue Stand Grid -->
  <g transform="translate(75, 70)" filter="url(#dropShadow)">
    <!-- Stand Wooden Feet -->
    <path d="M-15,260 L25,290 L425,290 L465,260 Z" fill="#b45309" stroke="#78350f" stroke-width="3" />
    <rect x="-10" y="240" width="30" height="40" rx="4" fill="#92400e" />
    <rect x="430" y="240" width="30" height="40" rx="4" fill="#92400e" />

    <!-- Blue Vertical Board Case -->
    <rect x="0" y="20" width="450" height="250" rx="20" fill="url(#boardGrad)" stroke="#1e3a8a" stroke-width="4" />

    <!-- Top Column Slots Indicators -->
    <polygon points="40,10 50,18 30,18" fill="#facc15" />
    <polygon points="100,10 110,18 90,18" fill="#facc15" />
    <polygon points="160,10 170,18 150,18" fill="#facc15" />
    <polygon points="225,6 238,18 212,18" fill="#facc15" />
    <polygon points="290,10 300,18 280,18" fill="#facc15" />
    <polygon points="350,10 360,18 340,18" fill="#facc15" />
    <polygon points="410,10 420,18 400,18" fill="#facc15" />

    <!-- 7 Columns x 6 Rows Grid Holes & Settled Tokens -->
    <!-- Col 0 -->
    <circle cx="35" cy="55" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="35" cy="95" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="35" cy="135" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="35" cy="175" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="35" cy="215" r="16" fill="url(#appleTokenGrad)" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="35" cy="250" r="16" fill="url(#chickTokenGrad)" stroke="#a16207" stroke-width="2" />

    <!-- Col 1 -->
    <circle cx="98" cy="55" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="98" cy="95" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="98" cy="135" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="98" cy="175" r="16" fill="url(#chickTokenGrad)" stroke="#a16207" stroke-width="2" />
    <circle cx="98" cy="215" r="16" fill="url(#appleTokenGrad)" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="98" cy="250" r="16" fill="url(#appleTokenGrad)" stroke="#7f1d1d" stroke-width="2" />

    <!-- Col 2 -->
    <circle cx="161" cy="55" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="161" cy="95" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="161" cy="135" r="16" fill="url(#chickTokenGrad)" stroke="#a16207" stroke-width="2" />
    <circle cx="161" cy="175" r="16" fill="url(#appleTokenGrad)" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="161" cy="215" r="16" fill="url(#chickTokenGrad)" stroke="#a16207" stroke-width="2" />
    <circle cx="161" cy="250" r="16" fill="url(#appleTokenGrad)" stroke="#7f1d1d" stroke-width="2" />

    <!-- Col 3 (Center: Dropping Hero Chick Token!) -->
    <circle cx="225" cy="95" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="225" cy="135" r="16" fill="url(#appleTokenGrad)" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="225" cy="175" r="16" fill="url(#chickTokenGrad)" stroke="#a16207" stroke-width="2" />
    <circle cx="225" cy="215" r="16" fill="url(#appleTokenGrad)" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="225" cy="250" r="16" fill="url(#chickTokenGrad)" stroke="#a16207" stroke-width="2" />

    <!-- Col 4 -->
    <circle cx="289" cy="55" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="289" cy="95" r="16" fill="url(#chickTokenGrad)" stroke="#a16207" stroke-width="2" />
    <circle cx="289" cy="135" r="16" fill="url(#appleTokenGrad)" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="289" cy="175" r="16" fill="url(#chickTokenGrad)" stroke="#a16207" stroke-width="2" />
    <circle cx="289" cy="215" r="16" fill="url(#appleTokenGrad)" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="289" cy="250" r="16" fill="url(#appleTokenGrad)" stroke="#7f1d1d" stroke-width="2" />

    <!-- Col 5 -->
    <circle cx="352" cy="55" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="352" cy="95" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="352" cy="135" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="352" cy="175" r="16" fill="url(#appleTokenGrad)" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="352" cy="215" r="16" fill="url(#chickTokenGrad)" stroke="#a16207" stroke-width="2" />
    <circle cx="352" cy="250" r="16" fill="url(#appleTokenGrad)" stroke="#7f1d1d" stroke-width="2" />

    <!-- Col 6 -->
    <circle cx="415" cy="55" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="415" cy="95" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="415" cy="135" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="415" cy="175" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="415" cy="215" r="16" fill="#0f172a" opacity="0.8" />
    <circle cx="415" cy="250" r="16" fill="url(#chickTokenGrad)" stroke="#a16207" stroke-width="2" />

    <!-- Winning 4-in-a-Row Diagonal Line Highlight! -->
    <!-- From (Col 1, Row 175) to (Col 4, Row 95) -->
    <line x1="98" y1="175" x2="289" y2="95" stroke="#facc15" stroke-width="8" stroke-linecap="round" opacity="0.85" filter="url(#dropShadow)" />
    <line x1="98" y1="175" x2="289" y2="95" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Speed Lines for Dropping Center Chick Disc -->
    <line x1="220" y1="-8" x2="220" y2="35" stroke="#facc15" stroke-width="3" stroke-dasharray="4 6" />
    <line x1="230" y1="-8" x2="230" y2="35" stroke="#facc15" stroke-width="3" stroke-dasharray="4 6" />

    <!-- Dropping Hero Chick Disc Falling into Col 3 -->
    <g transform="translate(225, 30)">
      <circle cx="0" cy="0" r="24" fill="url(#chickTokenGrad)" stroke="#a16207" stroke-width="3" />
      <circle cx="0" cy="0" r="18" fill="none" stroke="#fef08a" stroke-width="1.5" />
      <!-- Chick Face -->
      <circle cx="-6" cy="-4" r="2.5" fill="#1e293b" />
      <circle cx="6" cy="-4" r="2.5" fill="#1e293b" />
      <polygon points="0,0 -4,5 4,5" fill="#ea580c" />
      <ellipse cx="-11" cy="2" rx="4" ry="2" fill="#f43f5e" opacity="0.5" />
      <ellipse cx="11" cy="2" rx="4" ry="2" fill="#f43f5e" opacity="0.5" />
    </g>
  </g>

  <!-- Title Badge Banner at Top Left -->
  <g transform="translate(24, 24)" filter="url(#dropShadow)">
    <rect width="275" height="66" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
    <rect x="4" y="4" width="267" height="58" rx="14" fill="#0f172a" />
    <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#facc15" letter-spacing="2">🟡🔴 CLASSIC FOUR IN A ROW</text>
    <text x="18" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff">BARNYARD CONNECT 4</text>
  </g>
</svg>
