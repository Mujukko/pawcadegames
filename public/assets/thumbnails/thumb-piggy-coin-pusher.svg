<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </radialGradient>

    <!-- Coin Pusher Metal Bed -->
    <linearGradient id="metalBed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Barn Red Wooden Cabinet -->
    <linearGradient id="barnWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Shiny Golden Coin Gradient -->
    <radialGradient id="goldCoin" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </radialGradient>

    <!-- Clover Silver Token Gradient -->
    <radialGradient id="silverToken" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="40%" stop-color="#6ee7b7" />
      <stop offset="85%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>

    <!-- Giant Mega Coin -->
    <radialGradient id="megaCoin" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fed7aa" />
      <stop offset="65%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>

    <!-- Piggy Skin -->
    <linearGradient id="piggySkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="60%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="48" fill="url(#bgGrad)" />

  <!-- Carnival / Barnyard Lights Arc -->
  <g fill="#fde047" opacity="0.75" filter="url(#glowFilter)">
    <circle cx="80" cy="50" r="7" />
    <circle cx="140" cy="35" r="7" />
    <circle cx="205" cy="28" r="7" />
    <circle cx="270" cy="28" r="7" />
    <circle cx="335" cy="35" r="7" />
    <circle cx="395" cy="50" r="7" />
  </g>

  <!-- 3D Coin Pusher Cabinet Body -->
  <g filter="url(#shadowFilter)">
    <!-- Outer Red Barn Cabinet Frame -->
    <path d="M 64 80 L 448 80 L 468 460 L 44 460 Z" fill="url(#barnWood)" stroke="#450a0a" stroke-width="8" />

    <!-- Cabinet Inner Walls with Gold Trim -->
    <path d="M 84 96 L 428 96 L 444 444 L 68 444 Z" fill="#1e293b" stroke="#fbbf24" stroke-width="3" />

    <!-- Mirrored Stainless Steel Pusher Bed (Perspective Surface) -->
    <polygon points="104,116 408,116 426,380 86,380" fill="url(#metalBed)" stroke="#475569" stroke-width="2" />

    <!-- Shiny Metal Bed Perspective Grid Lines -->
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.45">
      <line x1="160" y1="116" x2="152" y2="380" />
      <line x1="216" y1="116" x2="216" y2="380" />
      <line x1="272" y1="116" x2="280" y2="380" />
      <line x1="328" y1="116" x2="344" y2="380" />
      <line x1="98" y1="200" x2="414" y2="200" />
      <line x1="92" y1="290" x2="420" y2="290" />
    </g>

    <!-- Heavy Chrome Moving Pusher Blade (Upper Deck) -->
    <g filter="url(#shadowFilter)">
      <rect x="96" y="160" width="320" height="28" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="3" />
      <rect x="102" y="164" width="308" height="8" rx="2" fill="#ffffff" opacity="0.8" />
      <!-- Pusher Bolts -->
      <circle cx="120" cy="174" r="3" fill="#334155" />
      <circle cx="256" cy="174" r="3" fill="#334155" />
      <circle cx="392" cy="174" r="3" fill="#334155" />
    </g>

    <!-- Side Gutter Drop Slots -->
    <polygon points="68,96 104,116 86,380 52,380" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <polygon points="428,96 408,116 426,380 460,380" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Front Drop Ledge Rim -->
    <rect x="76" y="378" width="360" height="18" rx="4" fill="#fbbf24" stroke="#b45309" stroke-width="3" />
  </g>

  <!-- Coins on Bed Layers -->

  <!-- Top Bed Coins (Being Pushed) -->
  <g filter="url(#shadowFilter)">
    <circle cx="140" cy="145" r="16" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />
    <circle cx="175" cy="148" r="16" fill="url(#silverToken)" stroke="#065f46" stroke-width="2" />
    <circle cx="210" cy="144" r="16" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />
    <circle cx="245" cy="147" r="16" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />
    <circle cx="280" cy="145" r="16" fill="url(#silverToken)" stroke="#065f46" stroke-width="2" />
    <circle cx="315" cy="148" r="16" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />
    <circle cx="350" cy="145" r="16" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />
  </g>

  <!-- Main Lower Bed Coin Carpet -->
  <g filter="url(#shadowFilter)">
    <!-- Row 1 -->
    <circle cx="130" cy="225" r="18" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />
    <circle cx="170" cy="228" r="18" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />
    <circle cx="210" cy="222" r="18" fill="url(#silverToken)" stroke="#065f46" stroke-width="2" />
    <circle cx="250" cy="226" r="18" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />
    <circle cx="290" cy="224" r="18" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />
    <circle cx="330" cy="227" r="18" fill="url(#silverToken)" stroke="#065f46" stroke-width="2" />
    <circle cx="370" cy="225" r="18" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />

    <!-- Center Prize Milk Bottle -->
    <g transform="translate(256, 275)">
      <rect x="-10" y="-18" width="20" height="36" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5" />
      <rect x="-6" y="-24" width="12" height="7" rx="2" fill="#38bdf8" />
      <circle cx="0" cy="0" r="6" fill="#38bdf8" opacity="0.6" />
    </g>

    <!-- Giant Heavy Mega Coin in Center -->
    <circle cx="190" cy="285" r="30" fill="url(#megaCoin)" stroke="#7c2d12" stroke-width="3" />
    <circle cx="190" cy="285" r="24" fill="none" stroke="#ffedd5" stroke-width="2" opacity="0.6" />
    <polygon points="190,266 195,278 207,280 198,289 200,301 190,295 180,301 182,289 173,280 185,278" fill="#ffedd5" />

    <!-- Front Ledge Teetering Stack (Cascading Downwards!) -->
    <circle cx="120" cy="335" r="20" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />
    <circle cx="160" cy="340" r="20" fill="url(#silverToken)" stroke="#065f46" stroke-width="2" />
    <circle cx="205" cy="345" r="20" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />
    <circle cx="250" cy="342" r="20" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />
    <circle cx="295" cy="346" r="20" fill="url(#silverToken)" stroke="#065f46" stroke-width="2" />
    <circle cx="340" cy="338" r="20" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />
    <circle cx="380" cy="335" r="20" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />

    <!-- Overhanging Falling Coins at Front Edge -->
    <circle cx="170" cy="378" r="22" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2.5" />
    <circle cx="220" cy="384" r="22" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2.5" />
    <circle cx="270" cy="382" r="22" fill="url(#silverToken)" stroke="#065f46" stroke-width="2.5" />
    <circle cx="320" cy="376" r="22" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2.5" />
  </g>

  <!-- Free-Falling Coins Splashing into Player Prize Chute -->
  <g transform="translate(0, 40)" filter="url(#shadowFilter)">
    <!-- Falling Coin 1 -->
    <g transform="translate(190, 390) rotate(22)">
      <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2" />
      <line x1="-12" y1="-25" x2="-12" y2="-5" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
    </g>
    <!-- Falling Coin 2 -->
    <g transform="translate(250, 405) rotate(-18)">
      <ellipse cx="0" cy="0" rx="24" ry="15" fill="url(#goldCoin)" stroke="#78350f" stroke-width="2.5" />
      <line x1="8" y1="-30" x2="8" y2="-8" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
    </g>
    <!-- Falling Clover Token -->
    <g transform="translate(305, 395) rotate(35)">
      <ellipse cx="0" cy="0" rx="20" ry="13" fill="url(#silverToken)" stroke="#065f46" stroke-width="2" />
    </g>
  </g>

  <!-- Cute Piggy Mascot Cheering from Bottom Corner -->
  <g transform="translate(415, 425)" filter="url(#shadowFilter)">
    <!-- Piggy Head -->
    <circle cx="0" cy="0" r="42" fill="url(#piggySkin)" stroke="#9d174d" stroke-width="3" />
    <!-- Piggy Ears -->
    <path d="M -30 -25 Q -45 -55 -20 -40 Z" fill="#f472b6" stroke="#9d174d" stroke-width="2" />
    <path d="M 30 -25 Q 45 -55 20 -40 Z" fill="#f472b6" stroke="#9d174d" stroke-width="2" />
    <!-- Farmer Cap -->
    <path d="M -32 -25 C -30 -50 30 -50 32 -25 Z" fill="#2563eb" stroke="#1e3a8a" stroke-width="2.5" />
    <ellipse cx="0" cy="-22" rx="36" ry="7" fill="#1d4ed8" />
    <!-- Eyes -->
    <circle cx="-12" cy="-6" r="4.5" fill="#0f172a" />
    <circle cx="12" cy="-6" r="4.5" fill="#0f172a" />
    <circle cx="-14" cy="-8" r="1.5" fill="#ffffff" />
    <circle cx="10" cy="-8" r="1.5" fill="#ffffff" />
    <!-- Snout -->
    <ellipse cx="0" cy="10" rx="16" ry="11" fill="#fbcfe8" stroke="#be185d" stroke-width="2" />
    <ellipse cx="-5" cy="10" rx="3" ry="4" fill="#831843" />
    <ellipse cx="5" cy="10" rx="3" ry="4" fill="#831843" />
    <!-- Happy Cheeks -->
    <circle cx="-25" cy="6" r="6" fill="#f43f5e" opacity="0.6" />
    <circle cx="25" cy="6" r="6" fill="#f43f5e" opacity="0.6" />
  </g>

  <!-- Star Sparkles Bursting from Drops -->
  <g fill="#fde047" filter="url(#glowFilter)">
    <path d="M 230 420 Q 238 428 246 420 Q 238 428 246 436 Q 238 428 230 436 Q 238 428 230 420 Z" />
    <path d="M 140 435 Q 146 441 152 435 Q 146 441 152 447 Q 146 441 140 447 Q 146 441 140 435 Z" />
    <path d="M 320 440 Q 326 446 332 440 Q 326 446 332 452 Q 326 446 320 452 Q 326 446 320 440 Z" />
    <path d="M 100 80 Q 106 86 112 80 Q 106 86 112 92 Q 106 86 100 92 Q 106 86 100 80 Z" />
    <path d="M 400 90 Q 406 96 412 90 Q 406 96 412 102 Q 406 96 400 102 Q 406 96 400 90 Z" />
  </g>
</svg>
