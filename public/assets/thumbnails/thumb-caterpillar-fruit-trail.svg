<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sky & Garden Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Caterpillar Gradients -->
    <linearGradient id="caterpillarHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="60%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    <linearGradient id="caterpillarBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="70%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    <linearGradient id="caterpillarBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Fruit Gradients -->
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="60%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldAppleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shadows & Glow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="512" height="512" rx="36" fill="url(#skyGrad)" />

  <!-- Sun & Clouds -->
  <circle cx="420" cy="80" r="110" fill="#fde047" opacity="0.3" />
  <circle cx="420" cy="80" r="70" fill="#fef08a" opacity="0.6" />
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="130" cy="80" rx="42" ry="20" />
    <ellipse cx="160" cy="70" rx="28" ry="22" />
    <ellipse cx="105" cy="85" rx="22" ry="16" />
  </g>

  <!-- Rolling Garden Meadow -->
  <path d="M-20 330 Q 140 270, 310 310 T 530 280 L 530 530 L -20 530 Z" fill="url(#grassGrad)" />

  <!-- Checkered Garden Soil & Grass Tiles -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="2">
    <line x1="60" y1="360" x2="460" y2="360" />
    <line x1="60" y1="410" x2="460" y2="410" />
    <line x1="60" y1="460" x2="460" y2="460" />
    <line x1="120" y1="320" x2="120" y2="500" />
    <line x1="200" y1="320" x2="200" y2="500" />
    <line x1="280" y1="320" x2="280" y2="500" />
    <line x1="360" y1="320" x2="360" y2="500" />
    <line x1="440" y1="320" x2="440" y2="500" />
  </g>

  <!-- Sammy the Caterpillar (Main Character) -->
  <g transform="translate(200, 370)" filter="url(#softShadow)">
    <!-- Wavy Body Segments -->
    <!-- Tail Segment 4 -->
    <ellipse cx="-135" cy="20" rx="22" ry="20" fill="url(#caterpillarBody)" />
    <circle cx="-135" cy="22" r="7" fill="#fef08a" opacity="0.6" />

    <!-- Segment 3 -->
    <ellipse cx="-95" cy="5" rx="26" ry="24" fill="url(#caterpillarBody)" />
    <circle cx="-95" cy="8" r="8" fill="#fef08a" opacity="0.6" />

    <!-- Segment 2 -->
    <ellipse cx="-50" cy="15" rx="28" ry="26" fill="url(#caterpillarBody)" />
    <circle cx="-50" cy="18" r="9" fill="#fef08a" opacity="0.6" />

    <!-- Segment 1 (Chest) -->
    <ellipse cx="-5" cy="0" rx="32" ry="29" fill="url(#caterpillarBody)" />
    <circle cx="-5" cy="4" r="10" fill="#fef08a" opacity="0.6" />

    <!-- Little Orange Walking Boots / Feet -->
    <ellipse cx="-130" cy="40" rx="8" ry="6" fill="#f97316" />
    <ellipse cx="-90" cy="28" rx="8" ry="6" fill="#f97316" />
    <ellipse cx="-45" cy="38" rx="8" ry="6" fill="#f97316" />
    <ellipse cx="0" cy="26" rx="8" ry="6" fill="#f97316" />

    <!-- Big Smiling Head -->
    <circle cx="48" cy="-25" r="42" fill="url(#caterpillarHead)" />

    <!-- Rosy Pink Cheeks -->
    <circle cx="30" cy="-14" r="9" fill="#f43f5e" opacity="0.4" />
    <circle cx="70" cy="-14" r="9" fill="#f43f5e" opacity="0.4" />

    <!-- Wide Joyful Open Smile -->
    <path d="M 32 -18 Q 50 -2, 68 -18" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 36 -17 Q 50 4, 64 -17 Z" fill="#f43f5e" />

    <!-- Big Sparkling Expressive Eyes -->
    <circle cx="36" cy="-35" r="9" fill="#0f172a" />
    <circle cx="38" cy="-38" r="3.5" fill="#ffffff" />
    <circle cx="33" cy="-33" r="1.8" fill="#ffffff" />

    <circle cx="62" cy="-35" r="9" fill="#0f172a" />
    <circle cx="64" cy="-38" r="3.5" fill="#ffffff" />
    <circle cx="59" cy="-33" r="1.8" fill="#ffffff" />

    <!-- Purple Antennae with Golden Tips -->
    <path d="M 38 -64 Q 28 -95, 20 -105" stroke="#9333ea" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <circle cx="18" cy="-107" r="7.5" fill="#facc15" filter="url(#glow)" />

    <path d="M 58 -64 Q 68 -95, 78 -105" stroke="#9333ea" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <circle cx="80" cy="-107" r="7.5" fill="#facc15" filter="url(#glow)" />
  </g>

  <!-- Big Red Shiny Apple Target in Front of Caterpillar -->
  <g transform="translate(370, 340)" filter="url(#softShadow)">
    <!-- Apple Body -->
    <path d="M -8 -30 C -2 -34, 2 -34, 8 -30 C 26 -22, 28 8, 0 12 C -28 8, -26 -22, -8 -30 Z" fill="url(#appleGrad)" />
    <!-- Highlight -->
    <ellipse cx="-10" cy="-16" rx="6" ry="12" fill="#fca5a5" opacity="0.6" transform="rotate(-15, -10, -16)" />
    <!-- Leaf & Stem -->
    <path d="M 0 -30 Q 4 -44, 2 -46" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round" />
    <ellipse cx="8" cy="-40" rx="9" ry="4.5" transform="rotate(-30, 8, -40)" fill="#22c55e" />
  </g>

  <!-- Juicy Red Cherries (Foreground Right) -->
  <g transform="translate(420, 420)" filter="url(#softShadow)">
    <path d="M -15 -20 Q 0 -45, 10 -40 Q 2 -15, 15 -18" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="-15" cy="-16" r="14" fill="url(#appleGrad)" />
    <circle cx="15" cy="-14" r="14" fill="url(#appleGrad)" />
    <ellipse cx="-18" cy="-20" rx="3" ry="5" fill="#ffffff" opacity="0.6" />
    <ellipse cx="12" cy="-18" rx="3" ry="5" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Golden Apple & Honey Sparkles (Top Left) -->
  <g transform="translate(100, 260)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="18" fill="url(#goldAppleGrad)" />
    <path d="M 0 -18 Q 3 -28, 1 -30" stroke="#78350f" stroke-width="2.5" fill="none" />
    <ellipse cx="5" cy="-25" rx="6" ry="3" transform="rotate(-25, 5, -25)" fill="#22c55e" />
  </g>

  <!-- Floating Star Sparkles -->
  <polygon points="120,200 123,208 131,211 123,214 120,222 117,214 109,211 117,208" fill="#fbbf24" filter="url(#glow)" />
  <polygon points="320,220 322,226 328,228 322,230 320,236 318,230 312,228 318,226" fill="#fbbf24" filter="url(#glow)" />
  <polygon points="270,160 272,165 277,167 272,169 270,174 268,169 263,167 268,165" fill="#fde047" filter="url(#glow)" />
</svg>
