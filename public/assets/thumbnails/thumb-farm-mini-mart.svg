<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="awningRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <radialGradient id="sun" cx="20%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sky & Hills -->
  <rect width="512" height="512" rx="36" fill="url(#skyGrad)"/>
  <circle cx="90" cy="90" r="100" fill="url(#sun)"/>
  <ellipse cx="256" cy="460" rx="360" ry="160" fill="url(#grassGrad)"/>

  <!-- Market Stall Structure -->
  <g filter="url(#drop)">
    <!-- Back wall & counter -->
    <rect x="96" y="220" width="320" height="190" rx="14" fill="url(#woodGrad)"/>
    <rect x="110" y="240" width="292" height="150" rx="8" fill="#5c2605"/>

    <!-- Display Shelves -->
    <!-- Top Shelf: Red Apples -->
    <rect x="124" y="250" width="264" height="14" rx="4" fill="#92400e"/>
    <g fill="#ef4444">
      <circle cx="150" cy="242" r="14"/><circle cx="176" cy="242" r="14"/>
      <circle cx="202" cy="242" r="14"/><circle cx="228" cy="242" r="14"/>
    </g>
    <!-- Apples leaves -->
    <g fill="#16a34a">
      <ellipse cx="152" cy="227" rx="3" ry="5" transform="rotate(20 152 227)"/>
      <ellipse cx="178" cy="227" rx="3" ry="5" transform="rotate(20 178 227)"/>
      <ellipse cx="204" cy="227" rx="3" ry="5" transform="rotate(20 204 227)"/>
      <ellipse cx="230" cy="227" rx="3" ry="5" transform="rotate(20 230 227)"/>
    </g>

    <!-- Top Shelf: Golden Corn -->
    <g fill="#eab308">
      <rect x="270" y="232" width="18" height="26" rx="6" transform="rotate(-15 270 232)"/>
      <rect x="302" y="232" width="18" height="26" rx="6" transform="rotate(-15 302 232)"/>
      <rect x="334" y="232" width="18" height="26" rx="6" transform="rotate(-15 334 232)"/>
    </g>

    <!-- Bottom Shelf: Carrots & Pumpkins -->
    <rect x="124" y="316" width="264" height="14" rx="4" fill="#92400e"/>
    <g fill="#f97316">
      <polygon points="150,305 142,280 158,280"/>
      <polygon points="182,305 174,280 190,280"/>
      <polygon points="214,305 206,280 222,280"/>
    </g>
    <g fill="#22c55e">
      <circle cx="150" cy="278" r="4"/><circle cx="182" cy="278" r="4"/><circle cx="214" cy="278" r="4"/>
    </g>

    <!-- Plump Pumpkin -->
    <g fill="#ea580c">
      <ellipse cx="300" cy="295" rx="22" ry="18"/>
      <ellipse cx="300" cy="295" rx="14" ry="18" fill="#f97316"/>
      <rect x="298" y="272" width="5" height="10" rx="2" fill="#15803d"/>
    </g>

    <!-- Front Counter Board -->
    <rect x="80" y="340" width="352" height="70" rx="12" fill="#78350f"/>
    <rect x="92" y="350" width="328" height="50" rx="8" fill="#92400e"/>

    <!-- Cash Register & Coin Bag -->
    <rect x="320" y="318" width="54" height="34" rx="6" fill="#334155"/>
    <rect x="330" y="308" width="34" height="16" rx="4" fill="#64748b"/>
    <text x="347" y="322" font-family="monospace" font-size="12" fill="#4ade80" font-weight="bold" text-anchor="middle">$99</text>

    <!-- Golden Coin Bag -->
    <path d="M 140 338 Q 126 360 146 368 Q 166 368 152 338 Z" fill="#eab308"/>
    <circle cx="146" cy="354" r="7" fill="#ca8a04"/>
    <text x="146" y="358" font-family="sans-serif" font-size="11" fill="#fef08a" font-weight="900" text-anchor="middle">$</text>

    <!-- Wooden Awning (Striped Red & White) -->
    <g>
      <!-- Pillars -->
      <rect x="92" y="140" width="14" height="110" fill="#78350f"/>
      <rect x="406" y="140" width="14" height="110" fill="#78350f"/>

      <!-- Awning Stripes -->
      <path d="M 64 165 L 114 165 L 100 115 L 56 115 Z" fill="url(#awningRed)"/>
      <path d="M 114 165 L 164 165 L 148 115 L 100 115 Z" fill="#ffffff"/>
      <path d="M 164 165 L 214 165 L 196 115 L 148 115 Z" fill="url(#awningRed)"/>
      <path d="M 214 165 L 264 165 L 244 115 L 196 115 Z" fill="#ffffff"/>
      <path d="M 264 165 L 314 165 L 292 115 L 244 115 Z" fill="url(#awningRed)"/>
      <path d="M 314 165 L 364 165 L 340 115 L 292 115 Z" fill="#ffffff"/>
      <path d="M 364 165 L 414 165 L 388 115 L 340 115 Z" fill="url(#awningRed)"/>
      <path d="M 414 165 L 456 165 L 432 115 L 388 115 Z" fill="#ffffff"/>

      <!-- Scalloped Edges -->
      <circle cx="89" cy="165" r="25" fill="url(#awningRed)"/>
      <circle cx="139" cy="165" r="25" fill="#ffffff"/>
      <circle cx="189" cy="165" r="25" fill="url(#awningRed)"/>
      <circle cx="239" cy="165" r="25" fill="#ffffff"/>
      <circle cx="289" cy="165" r="25" fill="url(#awningRed)"/>
      <circle cx="339" cy="165" r="25" fill="#ffffff"/>
      <circle cx="389" cy="165" r="25" fill="url(#awningRed)"/>
      <circle cx="435" cy="165" r="21" fill="#ffffff"/>
    </g>

    <!-- Signboard -->
    <rect x="156" y="60" width="200" height="48" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
    <text x="256" y="92" font-family="'Fredoka', Nunito, sans-serif" font-size="22" font-weight="bold" fill="#78350f" text-anchor="middle">MINI MART</text>
  </g>
</svg>