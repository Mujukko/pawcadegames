<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Sky & Stadium Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Red Athletic Track -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Baby Duckling Yellow Feathers -->
    <radialGradient id="duckGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="90%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>

    <!-- Gold Olympic Medal -->
    <radialGradient id="medalGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </radialGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="400" fill="url(#skyGrad)" />

  <!-- Stadium Bunting Pennant Flags -->
  <g opacity="0.85">
    <polygon points="40,20 60,50 80,20" fill="#ef4444" />
    <polygon points="80,20 100,50 120,20" fill="#3b82f6" />
    <polygon points="120,20 140,50 160,20" fill="#facc15" />
    <polygon points="160,20 180,50 200,20" fill="#10b981" />
    <polygon points="200,20 220,50 240,20" fill="#a855f7" />
    <polygon points="240,20 260,50 280,20" fill="#ef4444" />
    <polygon points="280,20 300,50 320,20" fill="#3b82f6" />
    <polygon points="320,20 340,50 360,20" fill="#facc15" />
    <polygon points="360,20 380,50 400,20" fill="#10b981" />
    <polygon points="400,20 420,50 440,20" fill="#a855f7" />
    <polygon points="440,20 460,50 480,20" fill="#ef4444" />
    <polygon points="480,20 500,50 520,20" fill="#3b82f6" />
    <polygon points="520,20 540,50 560,20" fill="#facc15" />
    <!-- String line -->
    <path d="M20,20 Q300,32 580,20" fill="none" stroke="#64748b" stroke-width="2" />
  </g>

  <!-- Distant Barnyard Stadium Bleachers & Green Trees -->
  <path d="M0,230 Q280,210 600,230 L600,270 L0,270 Z" fill="#22c55e" opacity="0.8" />
  <rect x="0" y="250" width="600" height="20" fill="#d97706" opacity="0.5" />

  <!-- Red Athletic Running Track -->
  <rect x="0" y="270" width="600" height="130" fill="url(#trackGrad)" />
  <line x1="0" y1="310" x2="600" y2="310" stroke="#ffffff" stroke-width="4" stroke-dasharray="24 16" opacity="0.9" />
  <line x1="0" y1="355" x2="600" y2="355" stroke="#ffffff" stroke-width="4" opacity="0.8" />

  <!-- Wooden Track Hurdle Obstacle -->
  <g transform="translate(180, 245)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="8" height="65" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" />
    <rect x="34" y="0" width="8" height="65" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" />
    <!-- Hurdle Board with Red/White Stripes -->
    <rect x="-6" y="-8" width="54" height="16" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <rect x="4" y="-8" width="12" height="16" fill="#ef4444" />
    <rect x="26" y="-8" width="12" height="16" fill="#ef4444" />
  </g>

  <!-- Flying Golden Corn Seeds -->
  <g filter="url(#dropShadow)">
    <circle cx="270" cy="170" r="8" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
    <circle cx="310" cy="140" r="9" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
    <circle cx="360" cy="125" r="10" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
    <circle cx="410" cy="140" r="9" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
  </g>

  <!-- Hero Jumping Champion Baby Duck (Quacky) -->
  <g transform="translate(340, 195) rotate(-10)" filter="url(#dropShadow)">
    <!-- Motion Speed Streaks -->
    <line x1="-80" y1="20" x2="-40" y2="20" stroke="#facc15" stroke-width="3" stroke-linecap="round" />
    <line x1="-90" y1="0" x2="-45" y2="0" stroke="#facc15" stroke-width="4" stroke-linecap="round" />
    <line x1="-75" y1="-20" x2="-35" y2="-20" stroke="#facc15" stroke-width="3" stroke-linecap="round" />

    <!-- Orange Webbed Running Feet (in stride) -->
    <ellipse cx="-16" cy="42" rx="14" ry="7" fill="#ea580c" stroke="#9a3412" stroke-width="2" transform="rotate(-25 -16 42)" />
    <ellipse cx="22" cy="38" rx="14" ry="7" fill="#ea580c" stroke="#9a3412" stroke-width="2" transform="rotate(20 22 38)" />

    <!-- Fluffy Round Duck Body -->
    <ellipse cx="0" cy="10" rx="38" ry="32" fill="url(#duckGrad)" stroke="#b45309" stroke-width="3" />

    <!-- Extended Flapping Wing -->
    <path d="M-12,4 Q-42,-18 -18,-24 Q-6,-16 4,-4 Z" fill="url(#duckGrad)" stroke="#b45309" stroke-width="2.5" />

    <!-- Duckling Head -->
    <circle cx="24" cy="-22" r="28" fill="url(#duckGrad)" stroke="#b45309" stroke-width="3" />

    <!-- Determined Anime Eye & Eyebrow -->
    <circle cx="34" cy="-24" r="6" fill="#0f172a" />
    <circle cx="36" cy="-26" r="2" fill="#ffffff" />
    <!-- Slanted determined eyebrow -->
    <line x1="26" y1="-34" x2="42" y2="-30" stroke="#78350f" stroke-width="3" stroke-linecap="round" />

    <!-- Orange Bill / Beak (Pouting with determination) -->
    <path d="M44,-22 Q58,-20 54,-14 Q46,-8 40,-12 Z" fill="#ea580c" stroke="#9a3412" stroke-width="2.5" />

    <!-- Athletic Red Headband -->
    <path d="M2,-36 Q26,-42 50,-32" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
    <!-- Headband knot tails fluttering back -->
    <path d="M2,-36 L-16,-46 L-10,-32 Z" fill="#dc2626" />

    <!-- Gold Olympic Medal with Green Ribbon hanging from neck -->
    <path d="M14,-4 L20,16 L28,-2" fill="none" stroke="#16a34a" stroke-width="3.5" />
    <circle cx="20" cy="22" r="11" fill="url(#medalGrad)" stroke="#a16207" stroke-width="1.5" />
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#78350f" text-anchor="middle">1</text>
  </g>

  <!-- Title Badge Banner at Top Left -->
  <g transform="translate(24, 24)" filter="url(#dropShadow)">
    <rect width="280" height="66" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
    <rect x="4" y="4" width="272" height="58" rx="14" fill="#0f172a" />
    <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#facc15" letter-spacing="2">🦆 PET TRAINING &amp; RACING</text>
    <text x="18" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff">DUCK LIFE CHAMPION</text>
  </g>
</svg>
