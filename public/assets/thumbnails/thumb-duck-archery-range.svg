<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sky & Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Wood Bow & Target Gradients -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="bullseyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="duckBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="512" height="512" rx="36" fill="url(#skyGrad)" />
  <circle cx="430" cy="80" r="140" fill="url(#sunGlow)" />

  <!-- Fluffy Cloud -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="140" cy="90" rx="45" ry="22" />
    <ellipse cx="170" cy="80" rx="30" ry="24" />
    <ellipse cx="115" cy="95" rx="25" ry="18" />
  </g>

  <!-- Rolling Pasture Hills -->
  <path d="M-20 380 Q 140 290, 320 350 T 530 310 L 530 530 L -20 530 Z" fill="url(#hillGrad1)" />
  <path d="M-20 420 Q 180 370, 360 410 T 530 380 L 530 530 L -20 530 Z" fill="url(#hillGrad2)" />

  <!-- Wooden Fence Rails -->
  <g stroke="#78350f" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <line x1="20" y1="410" x2="500" y2="390" />
    <line x1="20" y1="435" x2="500" y2="415" />
    <line x1="80" y1="395" x2="80" y2="450" stroke-width="8" />
    <line x1="220" y1="385" x2="220" y2="445" stroke-width="8" />
    <line x1="360" y1="375" x2="360" y2="435" stroke-width="8" />
  </g>

  <!-- Archery Target (Right Side) -->
  <g transform="translate(390, 260)" filter="url(#softShadow)">
    <!-- Wooden Tripod Stand -->
    <line x1="-30" y1="60" x2="0" y2="0" stroke="url(#woodGrad)" stroke-width="12" stroke-linecap="round" />
    <line x1="30" y1="60" x2="0" y2="0" stroke="url(#woodGrad)" stroke-width="12" stroke-linecap="round" />
    <line x1="0" y1="75" x2="0" y2="0" stroke="#78350f" stroke-width="10" stroke-linecap="round" />

    <!-- Outer Straw Rim -->
    <circle cx="0" cy="0" r="82" fill="#d97706" stroke="#92400e" stroke-width="6" />

    <!-- Target Rings -->
    <circle cx="0" cy="0" r="70" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" />
    <circle cx="0" cy="0" r="54" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3" />
    <circle cx="0" cy="0" r="38" fill="#ef4444" stroke="#b91c1c" stroke-width="3" />
    <circle cx="0" cy="0" r="18" fill="url(#bullseyeGrad)" stroke="#d97706" stroke-width="3" />
    <circle cx="0" cy="0" r="5" fill="#f59e0b" />

    <!-- Stuck Arrow in Dead Center! -->
    <g transform="rotate(-15)">
      <line x1="-55" y1="0" x2="-2" y2="0" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
      <polygon points="-55,-8 -40,0 -55,8 -48,0" fill="#22c55e" />
      <!-- Impact Sparkles -->
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#fbbf24" filter="url(#glow)" />
    </g>
  </g>

  <!-- Juicy Red Apple on Wooden Post -->
  <g transform="translate(265, 340)" filter="url(#softShadow)">
    <!-- Wooden Post -->
    <rect x="-10" y="0" width="20" height="70" rx="4" fill="url(#woodGrad)" />
    <!-- Apple -->
    <circle cx="0" cy="-14" r="18" fill="#ef4444" />
    <path d="M-6 -26 C-2 -30, 2 -30, 6 -26 C12 -20, 12 -8, 0 -6 C-12 -8, -12 -20, -6 -26 Z" fill="#dc2626" />
    <ellipse cx="-5" cy="-18" rx="4" ry="7" fill="#f87171" opacity="0.6" />
    <!-- Leaf & Stem -->
    <path d="M0 -26 Q 4 -36, 2 -38" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" />
    <ellipse cx="6" cy="-34" rx="7" ry="3.5" transform="rotate(-30, 6, -34)" fill="#22c55e" />
  </g>

  <!-- Quacky the Robin Duck Archer (Left & Center) -->
  <g transform="translate(145, 320)" filter="url(#softShadow)">
    <!-- Body -->
    <ellipse cx="0" cy="30" rx="55" ry="48" fill="url(#duckBodyGrad)" />
    <!-- Cute Tail Feathers -->
    <path d="M-50 20 Q -75 10, -80 0 Q -65 15, -45 28 Z" fill="#eab308" />

    <!-- Wing Drawn Back in Action -->
    <ellipse cx="-15" cy="32" rx="32" ry="20" transform="rotate(-20, -15, 32)" fill="#facc15" stroke="#ca8a04" stroke-width="3" />

    <!-- Head -->
    <circle cx="15" cy="-25" r="42" fill="url(#duckBodyGrad)" />
    <!-- Rosy Cheek -->
    <circle cx="10" cy="-15" r="9" fill="#f43f5e" opacity="0.4" />

    <!-- Beak with Determined Smile -->
    <path d="M38 -28 Q 72 -20, 60 -10 Q 40 -12, 36 -14 Z" fill="url(#beakGrad)" />
    <line x1="42" y1="-20" x2="58" y2="-15" stroke="#c2410c" stroke-width="2" stroke-linecap="round" />

    <!-- Sparkling Big Eye (Focused Aim) -->
    <ellipse cx="28" cy="-30" rx="8" ry="11" fill="#0f172a" />
    <circle cx="31" cy="-34" r="3.5" fill="#ffffff" />
    <circle cx="26" cy="-27" r="1.8" fill="#ffffff" />

    <!-- Robin Hood Hat -->
    <path d="M-15 -48 Q 20 -78, 48 -45 Q 20 -40, -15 -48 Z" fill="url(#featherGrad)" />
    <path d="M-22 -44 Q 15 -42, 52 -42 Q 15 -35, -22 -44 Z" fill="#15803d" />
    <!-- Red Hat Feather -->
    <path d="M-5 -54 Q -25 -85, -28 -95 Q -10 -75, 5 -58 Z" fill="#ef4444" />
    <line x1="-5" y1="-54" x2="-26" y2="-92" stroke="#b91c1c" stroke-width="2" />

    <!-- Curved Recurve Bow -->
    <g transform="translate(65, 0)">
      <path d="M0 -85 Q 38 10, 0 105" fill="none" stroke="url(#woodGrad)" stroke-width="9" stroke-linecap="round" />
      <!-- Bowstring Drawn Back -->
      <line x1="0" y1="-80" x2="-35" y2="10" stroke="#f8fafc" stroke-width="2.5" />
      <line x1="-35" y1="10" x2="0" y2="100" stroke="#f8fafc" stroke-width="2.5" />

      <!-- Loaded Arrow on Bow -->
      <line x1="-35" y1="10" x2="50" y2="10" stroke="#78350f" stroke-width="4.5" stroke-linecap="round" />
      <polygon points="58,10 46,5 48,10 46,15" fill="#94a3b8" />
      <polygon points="-35,6 -20,10 -35,14 -28,10" fill="#22c55e" />
    </g>
  </g>

  <!-- Floating Golden Feathers & Wind Swirls -->
  <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M190 180 Q 240 160, 310 185 T 410 170" />
    <path d="M220 220 Q 270 200, 330 225" />
  </g>
  <!-- Sparkles -->
  <polygon points="230,150 233,158 241,161 233,164 230,172 227,164 219,161 227,158" fill="#fbbf24" filter="url(#glow)" />
  <polygon points="360,130 362,136 368,138 362,140 360,146 358,140 352,138 358,136" fill="#fbbf24" filter="url(#glow)" />
</svg>
