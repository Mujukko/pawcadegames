<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Wooden Barn Planks -->
    <linearGradient id="barnPlanks" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#291003"/>
    </linearGradient>

    <!-- Shiny Apple Gradient -->
    <radialGradient id="appleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="85%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>

    <!-- Rope Texture -->
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Translucent Bubble -->
    <radialGradient id="bubbleGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#67e8f9" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Piggy Pink -->
    <linearGradient id="piggyPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Swipe Blade Flash Filter -->
    <filter id="bladeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Wooden Barn Background -->
  <rect width="512" height="512" fill="url(#barnPlanks)"/>
  <!-- Plank lines -->
  <line x1="0" y1="128" x2="512" y2="128" stroke="#1c0a00" stroke-width="4"/>
  <line x1="0" y1="256" x2="512" y2="256" stroke="#1c0a00" stroke-width="4"/>
  <line x1="0" y1="384" x2="512" y2="384" stroke="#1c0a00" stroke-width="4"/>

  <!-- Top Wooden Peg Anchors -->
  <circle cx="160" cy="50" r="16" fill="#ca8a04" stroke="#713f12" stroke-width="3"/>
  <circle cx="352" cy="50" r="16" fill="#ca8a04" stroke="#713f12" stroke-width="3"/>

  <!-- Left Rope (Cut & Frayed with sparks) -->
  <path d="M160,50 Q170,110 185,145" fill="none" stroke="url(#ropeGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Frayed severed end -->
  <circle cx="185" cy="145" r="7" fill="#fbbf24"/>
  <line x1="185" y1="145" x2="192" y2="152" stroke="#d97706" stroke-width="2.5"/>
  <line x1="185" y1="145" x2="188" y2="156" stroke="#fef08a" stroke-width="2.5"/>

  <!-- Lower Cut Rope segment continuing to apple -->
  <path d="M210,195 Q230,225 245,235" fill="none" stroke="url(#ropeGrad)" stroke-width="9" stroke-linecap="round"/>

  <!-- Right Rope (Intact Tension Rope) -->
  <path d="M352,50 Q310,140 268,235" fill="none" stroke="url(#ropeGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Glowing Finger Swipe Slash Blade Trail -->
  <path d="M110,170 Q200,150 280,120" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.4" filter="url(#bladeGlow)"/>
  <path d="M120,168 Q200,150 270,122" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" filter="url(#bladeGlow)"/>

  <!-- Slash Sparks -->
  <polygon points="195,140 205,130 200,145 212,142 202,150" fill="#fef08a"/>
  <polygon points="175,160 182,155 178,165 186,163 180,170" fill="#38bdf8"/>

  <!-- JUICY RED APPLE (Target Candy) -->
  <g transform="translate(256, 255)">
    <!-- Shadow -->
    <ellipse cx="0" cy="42" rx="34" ry="10" fill="#000000" opacity="0.35"/>

    <!-- Apple Main Body -->
    <path d="M0,8 C-25,-15 -52,5 -46,36 C-40,65 -15,80 0,65 C15,80 40,65 46,36 C52,5 25,-15 0,8 Z" fill="url(#appleGrad)"/>

    <!-- Specular Highlight Curve -->
    <ellipse cx="-18" cy="22" rx="14" ry="24" fill="#ffffff" opacity="0.35" transform="rotate(-15 -18 22)"/>
    <circle cx="-16" cy="14" r="5" fill="#ffffff" opacity="0.8"/>

    <!-- Apple Stem -->
    <path d="M0,8 Q5,-15 15,-20" fill="none" stroke="#451a03" stroke-width="5" stroke-linecap="round"/>

    <!-- Green Leaf -->
    <path d="M4,-8 Q20,-24 35,-14 Q24,0 4,-8 Z" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  </g>

  <!-- Floating Soap Bubble on Left -->
  <g transform="translate(100, 310)">
    <circle cx="0" cy="0" r="38" fill="url(#bubbleGrad)"/>
    <ellipse cx="-14" cy="-14" rx="12" ry="7" fill="#ffffff" opacity="0.75" transform="rotate(-30 -14 -14)"/>
    <circle cx="16" cy="16" r="4" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Floating Golden Stars -->
  <g transform="translate(180, 240) rotate(12)" filter="url(#bladeGlow)">
    <polygon points="0,-22 6,-7 22,-7 10,4 14,20 0,10 -14,20 -10,4 -22,-7 -6,-7" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="-4" cy="-8" r="2" fill="#ffffff"/>
  </g>

  <g transform="translate(340, 260) rotate(-15)" filter="url(#bladeGlow)">
    <polygon points="0,-22 6,-7 22,-7 10,4 14,20 0,10 -14,20 -10,4 -22,-7 -6,-7" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="-4" cy="-8" r="2" fill="#ffffff"/>
  </g>

  <!-- HUNGRY PENNY PIGLET (Bottom Center Waiting eagerly) -->
  <g transform="translate(256, 440)">
    <!-- Shadow -->
    <ellipse cx="0" cy="65" rx="70" ry="18" fill="#000000" opacity="0.4"/>

    <!-- Cheerful Body & Trotters -->
    <ellipse cx="0" cy="30" rx="58" ry="42" fill="url(#piggyPink)" stroke="#be185d" stroke-width="3"/>
    <ellipse cx="-38" cy="50" rx="16" ry="12" fill="url(#piggyPink)" stroke="#be185d" stroke-width="2"/>
    <ellipse cx="38" cy="50" rx="16" ry="12" fill="url(#piggyPink)" stroke="#be185d" stroke-width="2"/>

    <!-- Little Trotters Hooves -->
    <line x1="-38" y1="44" x2="-38" y2="60" stroke="#be185d" stroke-width="2"/>
    <line x1="38" y1="44" x2="38" y2="60" stroke="#be185d" stroke-width="2"/>

    <!-- Pointy Ears -->
    <polygon points="-40,-15 -65,-55 -25,-30" fill="url(#piggyPink)" stroke="#be185d" stroke-width="2.5"/>
    <polygon points="-36,-17 -55,-48 -26,-28" fill="#fbcfe8"/>

    <polygon points="40,-15 65,-55 25,-30" fill="url(#piggyPink)" stroke="#be185d" stroke-width="2.5"/>
    <polygon points="36,-17 55,-48 26,-28" fill="#fbcfe8"/>

    <!-- Head -->
    <circle cx="0" cy="-6" r="46" fill="url(#piggyPink)" stroke="#be185d" stroke-width="3"/>

    <!-- Excited Big Cartoon Eyes Looking Up -->
    <circle cx="-18" cy="-20" r="14" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
    <circle cx="18" cy="-20" r="14" fill="#ffffff" stroke="#be185d" stroke-width="2"/>

    <circle cx="-16" cy="-24" r="8" fill="#0f172a"/>
    <circle cx="16" cy="-24" r="8" fill="#0f172a"/>

    <circle cx="-14" cy="-26" r="3" fill="#ffffff"/>
    <circle cx="18" cy="-26" r="3" fill="#ffffff"/>

    <!-- Wide Open Hungry Mouth (Ready to eat apple!) -->
    <ellipse cx="0" cy="10" rx="22" ry="16" fill="#881337" stroke="#be185d" stroke-width="2.5"/>
    <!-- Cute Pink Tongue -->
    <ellipse cx="0" cy="18" rx="14" ry="8" fill="#fb7185"/>

    <!-- Little Piggy Snout Above Mouth -->
    <ellipse cx="0" cy="-3" rx="16" ry="10" fill="#f472b6" stroke="#be185d" stroke-width="2"/>
    <circle cx="-6" cy="-3" r="3" fill="#9d174d"/>
    <circle cx="6" cy="-3" r="3" fill="#9d174d"/>

    <!-- Rosy Blushing Cheeks -->
    <circle cx="-32" cy="0" r="8" fill="#f43f5e" opacity="0.6"/>
    <circle cx="32" cy="0" r="8" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>
