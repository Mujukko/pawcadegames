<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cabinet Dark Frame Gradient -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Table Pasture Felt Gradient -->
    <radialGradient id="feltGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="60%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>

    <!-- Chrome Ball Gradient -->
    <radialGradient id="chromeBall" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>

    <!-- Glowing Bumper Red -->
    <radialGradient id="redBumper" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="55%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </radialGradient>

    <!-- Glowing Bumper Gold -->
    <radialGradient id="goldBumper" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- Glowing Bumper Blue -->
    <radialGradient id="blueBumper" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>

    <!-- Flipper Plastic Gradient -->
    <linearGradient id="flipperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feOffset dx="0" dy="5" result="offset" />
      <feComposite in="SourceGraphic" in2="offset" operator="over" />
    </filter>
  </defs>

  <!-- Arcade Cabinet Outer Border -->
  <rect width="512" height="512" fill="url(#frameGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="28" fill="#1e293b" stroke="#f59e0b" stroke-width="4" />

  <!-- Pinball Playfield Inner Board -->
  <rect x="28" y="28" width="456" height="456" rx="22" fill="url(#feltGrad)" />

  <!-- Wooden Edge Rails & Plunger Lane Wall -->
  <path d="M48,80 Q256,20 424,80 L424,460 L48,460 Z" fill="none" stroke="#ca8a04" stroke-width="6" opacity="0.4" />
  <line x1="418" y1="90" x2="418" y2="470" stroke="#facc15" stroke-width="6" stroke-linecap="round" />

  <!-- Rollover Lanes (F - A - R - M) -->
  <g transform="translate(130, 85)">
    <rect x="0" y="0" width="34" height="26" rx="6" fill="#0f172a" stroke="#fde047" stroke-width="2" />
    <text x="17" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#fde047" text-anchor="middle">F</text>
  </g>
  <g transform="translate(175, 75)">
    <rect x="0" y="0" width="34" height="26" rx="6" fill="#0f172a" stroke="#fde047" stroke-width="2" />
    <text x="17" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#fde047" text-anchor="middle">A</text>
  </g>
  <g transform="translate(255, 75)">
    <rect x="0" y="0" width="34" height="26" rx="6" fill="#0f172a" stroke="#fde047" stroke-width="2" />
    <text x="17" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#fde047" text-anchor="middle">R</text>
  </g>
  <g transform="translate(300, 85)">
    <rect x="0" y="0" width="34" height="26" rx="6" fill="#0f172a" stroke="#fde047" stroke-width="2" />
    <text x="17" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#fde047" text-anchor="middle">M</text>
  </g>

  <!-- 3 Illuminated Mushroom Bumpers -->
  <!-- 1. Barn Bumper (Top-Left Red) -->
  <g transform="translate(160, 185)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="38" fill="url(#redBumper)" stroke="#ffffff" stroke-width="4" />
    <circle cx="0" cy="0" r="28" fill="#991b1b" stroke="#fca5a5" stroke-width="2" />
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🏠</text>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.6" filter="url(#neonGlow)" />
  </g>

  <!-- 2. Corn Bumper (Top-Right Gold) -->
  <g transform="translate(300, 185)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="38" fill="url(#goldBumper)" stroke="#ffffff" stroke-width="4" />
    <circle cx="0" cy="0" r="28" fill="#92400e" stroke="#fef08a" stroke-width="2" />
    <text x="0" y="7" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">🌽</text>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.6" filter="url(#neonGlow)" />
  </g>

  <!-- 3. Milk Bumper (Center-Lower Blue) -->
  <g transform="translate(230, 275)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="40" fill="url(#blueBumper)" stroke="#ffffff" stroke-width="4" />
    <circle cx="0" cy="0" r="30" fill="#0369a1" stroke="#bae6fd" stroke-width="2" />
    <text x="0" y="7" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">🥛</text>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6" filter="url(#neonGlow)" />
  </g>

  <!-- Slingshots (Left & Right Kickers) -->
  <polygon points="80,330 135,395 80,410" fill="#b45309" stroke="#fbbf24" stroke-width="3" filter="url(#dropShadow)" />
  <circle cx="108" cy="370" r="6" fill="#fde047" />

  <polygon points="380,330 325,395 380,410" fill="#b45309" stroke="#fbbf24" stroke-width="3" filter="url(#dropShadow)" />
  <circle cx="352" cy="370" r="6" fill="#fde047" />

  <!-- Dual Flippers at Bottom -->
  <!-- Left Flipper (Angled Upward-Right) -->
  <g transform="translate(160, 440) rotate(-26)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#cbd5e1" stroke-width="3" />
    <path d="M-6,-11 L74,-4 Q82,0 74,4 L-6,11 Z" fill="url(#flipperGrad)" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="0" r="6" fill="#e2e8f0" />
  </g>

  <!-- Right Flipper (Angled Upward-Left) -->
  <g transform="translate(300, 440) rotate(206)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#cbd5e1" stroke-width="3" />
    <path d="M-6,-11 L74,-4 Q82,0 74,4 L-6,11 Z" fill="url(#flipperGrad)" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="0" r="6" fill="#e2e8f0" />
  </g>

  <!-- Plunger Spring & Knob (Bottom Right Lane) -->
  <g transform="translate(440, 420)">
    <!-- Metallic Spring Coil -->
    <path d="M-8,0 L8,6 L-8,12 L8,18 L-8,24 L8,30 L-8,36" stroke="#94a3b8" stroke-width="4" fill="none" />
    <circle cx="0" cy="50" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="3" filter="url(#dropShadow)" />
  </g>

  <!-- Shiny Chrome Steel Ball in High-Speed Flight -->
  <g transform="translate(230, 360)" filter="url(#dropShadow)">
    <!-- Motion Sparkle Trail -->
    <circle cx="-15" cy="30" r="5" fill="#fde047" opacity="0.4" />
    <circle cx="-8" cy="18" r="7" fill="#fde047" opacity="0.6" />
    <circle cx="0" cy="0" r="18" fill="url(#chromeBall)" stroke="#ffffff" stroke-width="2.5" />
    <!-- Specular Flare Highlight -->
    <ellipse cx="-6" cy="-6" rx="5" ry="3" fill="#ffffff" opacity="0.9" transform="rotate(-30 -6 -6)" />
    <!-- Star Glints -->
    <text x="14" y="-12" font-size="16">✨</text>
  </g>

  <!-- Mascot in Corner: Barnaby the Puppy -->
  <g transform="translate(70, 75)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="28" fill="#f59e0b" stroke="#d97706" stroke-width="3" />
    <!-- Blue Cap -->
    <path d="M-22,-8 Q0,-24 22,-8 L16,-18 Q0,-30 -16,-18 Z" fill="#2563eb" />
    <ellipse cx="14" cy="-8" rx="14" ry="4" fill="#1d4ed8" />
    <!-- Face -->
    <ellipse cx="0" cy="6" rx="12" ry="10" fill="#ffffff" />
    <circle cx="0" cy="2" r="3.5" fill="#0f172a" />
    <circle cx="-7" cy="-2" r="2.5" fill="#0f172a" />
    <circle cx="7" cy="-2" r="2.5" fill="#0f172a" />
  </g>

  <!-- Header Title Plaque -->
  <g transform="translate(256, 42)" filter="url(#dropShadow)">
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#0f172a" stroke="#f59e0b" stroke-width="3" opacity="0.95" />
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="1">
      BARNYARD PINBALL
    </text>
  </g>
</svg>
