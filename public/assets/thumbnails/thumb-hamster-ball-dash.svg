<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgHamster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="rampGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Hamster Ball Glass Spherical Shader -->
    <radialGradient id="ballShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="95%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Hamster Fur -->
    <linearGradient id="hamsterFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="60%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="36" fill="url(#bgHamster)"/>

  <!-- Wooden Ramp / Track Rolling Down -->
  <g filter="url(#shadow)">
    <!-- Main Roller Ramp -->
    <polygon points="0,460 512,320 512,512 0,512" fill="url(#rampGrad)"/>
    <polygon points="0,460 512,320 512,340 0,480" fill="#d97706"/>

    <!-- Track Guard Rails -->
    <line x1="0" y1="456" x2="512" y2="316" stroke="#fef08a" stroke-width="6"/>
  </g>

  <!-- Golden Sunflower Seeds on Track -->
  <g filter="url(#shadow)">
    <!-- Seed 1 -->
    <ellipse cx="380" cy="300" rx="14" ry="8" fill="#1e293b" stroke="#facc15" stroke-width="2" transform="rotate(-20 380 300)"/>
    <line x1="370" y1="300" x2="390" y2="300" stroke="#fde047" stroke-width="2" transform="rotate(-20 380 300)"/>

    <!-- Seed 2 -->
    <ellipse cx="440" cy="270" rx="14" ry="8" fill="#1e293b" stroke="#facc15" stroke-width="2" transform="rotate(-30 440 270)"/>
    <line x1="430" y1="270" x2="450" y2="270" stroke="#fde047" stroke-width="2" transform="rotate(-30 440 270)"/>
  </g>

  <!-- Rolling Plastic Hamster Ball with Hamster Inside -->
  <g filter="url(#shadow)" transform="translate(190, 240)">
    <!-- Back sphere shadow -->
    <circle cx="0" cy="0" r="110" fill="#0284c7" opacity="0.15"/>

    <!-- Inside Cute Chubby Hamster Running -->
    <g transform="rotate(-15)">
      <!-- Hamster Body -->
      <ellipse cx="0" cy="15" rx="65" ry="55" fill="url(#hamsterFur)" stroke="#c2410c" stroke-width="3"/>
      <!-- White Belly -->
      <ellipse cx="10" cy="25" rx="35" ry="38" fill="#ffffff"/>

      <!-- Hamster Head -->
      <circle cx="35" cy="-10" r="38" fill="url(#hamsterFur)" stroke="#c2410c" stroke-width="3"/>
      <!-- Chubby Cheeks -->
      <ellipse cx="50" cy="2" rx="18" ry="14" fill="#fed7aa"/>
      <ellipse cx="20" cy="5" rx="14" ry="12" fill="#fed7aa"/>

      <!-- Ears -->
      <circle cx="20" cy="-42" r="12" fill="#ea580c"/>
      <circle cx="20" cy="-42" r="7" fill="#fbcfe8"/>
      <circle cx="45" cy="-40" r="12" fill="#ea580c"/>
      <circle cx="45" cy="-40" r="7" fill="#fbcfe8"/>

      <!-- Eyes & Nose -->
      <circle cx="48" cy="-15" r="7" fill="#000000"/>
      <circle cx="50" cy="-17" r="2.5" fill="#ffffff"/>
      <polygon points="62,-6 65,-2 59,-2" fill="#f43f5e"/>

      <!-- Little Paws Running -->
      <ellipse cx="35" cy="62" rx="10" ry="6" fill="#fed7aa"/>
      <ellipse cx="-20" cy="62" rx="10" ry="6" fill="#fed7aa"/>
    </g>

    <!-- Translucent Glass Sphere with Air Slits and Highlight -->
    <circle cx="0" cy="0" r="110" fill="url(#ballShine)" stroke="#ffffff" stroke-width="4"/>

    <!-- Air Slits on Ball -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="-30" y1="-60" x2="-10" y2="-60"/>
      <line x1="10" y1="-60" x2="30" y2="-60"/>
      <line x1="-50" y1="0" x2="-25" y2="0"/>
      <line x1="25" y1="0" x2="50" y2="0"/>
    </g>

    <!-- Glare Reflection Arc -->
    <path d="M -70 -50 A 90 90 0 0 1 50 -70" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Speed Motion Lines -->
  <path d="M 60 360 Q 100 340 140 350" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 40 380 Q 80 370 110 375" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Top Title Badge -->
  <g filter="url(#shadow)">
    <rect x="110" y="14" width="292" height="48" rx="16" fill="#ea580c" stroke="#ffffff" stroke-width="3"/>
    <text x="256" y="46" font-family="'Fredoka', Nunito, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">HAMSTER BALL DASH</text>
  </g>
</svg>