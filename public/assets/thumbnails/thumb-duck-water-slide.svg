<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Water Flume Tube Gradient -->
    <linearGradient id="flumeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="40%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Water Surface Gradient -->
    <linearGradient id="waterSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Inflatable Swim Tube Red Gradient -->
    <linearGradient id="tubeRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Duck Feather Yellow Gradient -->
    <linearGradient id="duckYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Duck Beak Orange Gradient -->
    <linearGradient id="beakOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="512" height="512" rx="36" fill="url(#skyGrad)"/>

  <!-- Distant Fluffy Clouds -->
  <circle cx="100" cy="110" r="38" fill="#ffffff" opacity="0.85"/>
  <circle cx="140" cy="100" r="48" fill="#ffffff" opacity="0.85"/>
  <circle cx="180" cy="115" r="34" fill="#ffffff" opacity="0.85"/>

  <circle cx="360" cy="80" r="32" fill="#ffffff" opacity="0.8"/>
  <circle cx="400" cy="70" r="42" fill="#ffffff" opacity="0.8"/>

  <!-- Winding Flume Water Slide Structure -->
  <!-- Slide Outer Support Frame -->
  <path d="M420 0 Q340 160 256 260 Q170 360 80 512 L160 512 Q240 380 330 280 Q420 180 500 0 Z" fill="#0369a1" opacity="0.5"/>

  <!-- The Main Turquoise Water Slide Channel -->
  <path d="M400 0 Q320 170 236 270 Q150 370 40 512 L140 512 Q230 380 320 280 Q400 170 480 0 Z" fill="url(#flumeGrad)" stroke="#075985" stroke-width="6"/>

  <!-- Rushing Water Torrent Inside Flume -->
  <path d="M410 0 Q330 170 246 270 Q160 370 60 512 L120 512 Q210 380 300 280 Q380 170 460 0 Z" fill="url(#waterSurface)"/>

  <!-- White Speed Foam Streaks on Water -->
  <path d="M430 40 Q350 200 270 290 Q180 400 90 512" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="24 16" opacity="0.85"/>
  <path d="M450 20 Q370 180 290 270 Q200 380 110 512" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="14 10" opacity="0.7"/>

  <!-- Collectible Watermelon Slice on Slide -->
  <g transform="translate(140, 160) rotate(15)">
    <path d="M0 0 A30 30 0 0 0 60 0 Z" fill="#ef4444" stroke="#16a34a" stroke-width="5"/>
    <circle cx="18" cy="10" r="2" fill="#1e293b"/>
    <circle cx="30" cy="14" r="2" fill="#1e293b"/>
    <circle cx="42" cy="10" r="2" fill="#1e293b"/>
  </g>

  <!-- Collectible Mini Yellow Rubber Ducky -->
  <g transform="translate(320, 360) scale(0.9)">
    <circle cx="20" cy="20" r="16" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="28" cy="12" r="10" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <polygon points="36,12 44,14 36,18" fill="#ea580c"/>
    <circle cx="30" cy="10" r="2" fill="#0f172a"/>
  </g>

  <!-- Big Water Splash & Spray Around Tube -->
  <g id="waterSplashes" transform="translate(230, 350)">
    <!-- Rooster-tail spray plumes -->
    <path d="M-60 10 Q-100 -20 -110 -60 Q-80 -40 -50 0 Z" fill="#e0f2fe" opacity="0.85"/>
    <path d="M60 10 Q100 -20 110 -60 Q80 -40 50 0 Z" fill="#e0f2fe" opacity="0.85"/>

    <!-- Water droplets -->
    <circle cx="-90" cy="-40" r="6" fill="#ffffff"/>
    <circle cx="-120" cy="-70" r="5" fill="#38bdf8"/>
    <circle cx="95" cy="-45" r="6" fill="#ffffff"/>
    <circle cx="125" cy="-75" r="5" fill="#38bdf8"/>
  </g>

  <!-- Quacky the Hero Duck on Red Inflatable Tube -->
  <g id="heroDuck" transform="translate(230, 270)">
    <!-- Red Inflatable Tube -->
    <ellipse cx="0" cy="40" rx="75" ry="34" fill="url(#tubeRed)" stroke="#991b1b" stroke-width="5"/>
    <!-- Tube Inner Hole -->
    <ellipse cx="0" cy="38" rx="42" ry="18" fill="#0284c7" stroke="#991b1b" stroke-width="3"/>

    <!-- Tube White Racing Stripes -->
    <path d="M-55 35 Q-50 48 -45 55" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M55 35 Q50 48 45 55" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <!-- Duck Wings Spread High in Joy -->
    <!-- Left Wing -->
    <path d="M-30 10 Q-70 -20 -60 -50 Q-35 -30 -20 -5 Z" fill="url(#duckYellow)" stroke="#ca8a04" stroke-width="3"/>
    <!-- Right Wing -->
    <path d="M30 10 Q70 -20 60 -50 Q35 -30 20 -5 Z" fill="url(#duckYellow)" stroke="#ca8a04" stroke-width="3"/>

    <!-- Duck Body Inside Tube -->
    <ellipse cx="0" cy="15" rx="44" ry="36" fill="url(#duckYellow)" stroke="#ca8a04" stroke-width="4"/>

    <!-- Duck Head -->
    <circle cx="0" cy="-25" r="34" fill="url(#duckYellow)" stroke="#ca8a04" stroke-width="4"/>

    <!-- Cool Blue Sunglasses -->
    <g transform="translate(0, -30)">
      <!-- Left Lens -->
      <rect x="-26" y="-8" width="22" height="18" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="3"/>
      <!-- Right Lens -->
      <rect x="4" y="-8" width="22" height="18" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="3"/>
      <!-- Bridge -->
      <rect x="-6" y="-4" width="12" height="4" fill="#0284c7"/>
      <!-- Lens Reflections -->
      <line x1="-22" y1="-3" x2="-10" y2="5" stroke="#38bdf8" stroke-width="2"/>
      <line x1="8" y1="-3" x2="20" y2="5" stroke="#38bdf8" stroke-width="2"/>
    </g>

    <!-- Happy Open Duck Beak -->
    <ellipse cx="0" cy="-8" rx="22" ry="14" fill="url(#beakOrange)" stroke="#c2410c" stroke-width="3"/>
    <path d="M-15 -8 Q0 4 15 -8" fill="#991b1b"/>
  </g>

  <!-- Big Speed Sparkles -->
  <path d="M320 220 L323 210 L333 207 L323 204 L320 194 L317 204 L307 207 L317 210 Z" fill="#fef08a"/>
  <path d="M120 290 L122 282 L130 280 L122 278 L120 270 L118 278 L110 280 L118 282 Z" fill="#ffffff"/>
  <path d="M280 130 L283 120 L293 117 L283 114 L280 104 L277 114 L267 117 L277 120 Z" fill="#fef08a"/>
</svg>
