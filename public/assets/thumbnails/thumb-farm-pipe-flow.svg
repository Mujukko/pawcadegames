<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Sunlit Barnyard Soil & Pasture -->
    <linearGradient id="farmPasture" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="35%" stop-color="#164e63" />
      <stop offset="70%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Copper Pipe Metallic Gradient -->
    <linearGradient id="copperPipe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="80%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <!-- Glowing Blue Water Gradient -->
    <linearGradient id="waterFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Brass Flange / Valve Ring -->
    <linearGradient id="brassValve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Filters -->
    <filter id="pipeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="waterGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#farmPasture)" />

  <!-- Agricultural Irrigation Plot Bed -->
  <rect x="40" y="44" width="432" height="424" rx="24" fill="#1c1917" stroke="#ca8a04" stroke-width="4" filter="url(#pipeShadow)" />
  <rect x="52" y="56" width="408" height="400" rx="18" fill="#292524" opacity="0.8" />

  <!-- Grid Cell Soil Tiles (3x3 Layout) -->
  <g opacity="0.35">
    <rect x="68" y="72" width="116" height="116" rx="14" fill="#44403c" />
    <rect x="198" y="72" width="116" height="116" rx="14" fill="#44403c" />
    <rect x="328" y="72" width="116" height="116" rx="14" fill="#44403c" />

    <rect x="68" y="202" width="116" height="116" rx="14" fill="#44403c" />
    <rect x="198" y="202" width="116" height="116" rx="14" fill="#44403c" />
    <rect x="328" y="202" width="116" height="116" rx="14" fill="#44403c" />

    <rect x="68" y="332" width="116" height="116" rx="14" fill="#44403c" />
    <rect x="198" y="332" width="116" height="116" rx="14" fill="#44403c" />
    <rect x="328" y="332" width="116" height="116" rx="14" fill="#44403c" />
  </g>

  <!-- CONNECTED PIPELINE (Glowing Copper with Blue Water Surge) -->

  <!-- Top Row: Source (0,0) -> Straight (0,1) -> Elbow turning down (0,2) -->
  <g filter="url(#pipeShadow)">
    <!-- Source Pump Tank at (0,0) -->
    <rect x="76" y="80" width="100" height="100" rx="18" fill="#b91c1c" stroke="#f87171" stroke-width="3" />
    <!-- Pressure Gauge Dial -->
    <circle cx="126" cy="120" r="22" fill="#ffffff" stroke="#991b1b" stroke-width="2.5" />
    <line x1="126" y1="120" x2="136" y2="112" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
    <text x="126" y="158" font-size="12" font-weight="900" fill="#fef08a" text-anchor="middle">PUMP</text>

    <!-- Source Outlet Spigot to East -->
    <rect x="166" y="115" width="22" height="30" rx="4" fill="url(#brassValve)" />

    <!-- Straight Pipe (0,1) East-West -->
    <rect x="188" y="115" width="136" height="30" rx="6" fill="url(#copperPipe)" stroke="#7c2d12" stroke-width="2.5" />
    <!-- Flange Joints -->
    <rect x="246" y="110" width="10" height="40" rx="3" fill="url(#brassValve)" />

    <!-- Elbow Pipe (0,2) West to South -->
    <!-- Horizontal arm -->
    <path d="M 324 115 L 386 115 A 30 30 0 0 1 416 145 L 416 188 L 386 188 L 386 145 L 324 145 Z" fill="url(#copperPipe)" stroke="#7c2d12" stroke-width="2" />
    <circle cx="386" cy="145" r="14" fill="url(#brassValve)" stroke="#78350f" stroke-width="2" />
  </g>

  <!-- Middle Row: Vertical Straight Pipe down to (2,2) -->
  <g filter="url(#pipeShadow)">
    <rect x="371" y="188" width="30" height="144" rx="6" fill="url(#copperPipe)" stroke="#7c2d12" stroke-width="2.5" />
    <!-- Flange Joint -->
    <rect x="366" y="250" width="40" height="10" rx="3" fill="url(#brassValve)" />
  </g>

  <!-- Bottom Row: Target Destination at (2,2) (Crop Garden) -->
  <g filter="url(#pipeShadow)">
    <!-- Pipe entry into soil plot -->
    <rect x="371" y="332" width="30" height="45" rx="5" fill="url(#copperPipe)" />
    <!-- Sprinkler Spray Head -->
    <circle cx="386" cy="380" r="18" fill="url(#brassValve)" stroke="#78350f" stroke-width="2.5" />

    <!-- Thirsty Crops Blooming with Water! -->
    <rect x="336" y="340" width="100" height="100" rx="16" fill="#15803d" stroke="#4ade80" stroke-width="2.5" />
    <text x="386" y="395" font-size="44" text-anchor="middle">🥕</text>
    <text x="352" y="420" font-size="28" text-anchor="middle">🍓</text>
    <text x="418" y="420" font-size="28" text-anchor="middle">🌸</text>
  </g>

  <!-- GLOWING WATER CORE STREAM (Flowing Through Pipes) -->
  <g filter="url(#waterGlow)">
    <!-- Water stream from source -->
    <rect x="176" y="123" width="148" height="14" rx="7" fill="url(#waterFlow)" />
    <!-- Water stream around bend -->
    <path d="M 324 123 L 386 123 A 20 20 0 0 1 406 143 L 406 332" stroke="url(#waterFlow)" stroke-width="14" fill="none" stroke-linecap="round" />
    
    <!-- Water Spray Droplets at Target -->
    <circle cx="370" cy="355" r="4" fill="#67e8f9" />
    <circle cx="395" cy="345" r="5" fill="#67e8f9" />
    <circle cx="410" cy="365" r="3.5" fill="#67e8f9" />
    <circle cx="355" cy="370" r="4.5" fill="#67e8f9" />
  </g>

  <!-- Starburst Victory Sparkles -->
  <g filter="url(#waterGlow)">
    <polygon points="386,305 389,313 398,315 391,321 393,329 386,325 379,329 381,321 374,315 383,313" fill="#fde047" />
    <polygon points="260,85 262,91 269,92 264,96 265,103 260,99 255,103 256,96 251,92 258,91" fill="#fde047" />
  </g>

  <!-- Rotatable Pipe in Middle Left with Directional Arrow (Interactive Teaser) -->
  <g filter="url(#pipeShadow)">
    <rect x="80" y="214" width="92" height="92" rx="14" fill="#44403c" stroke="#f59e0b" stroke-width="2" />
    <!-- Elbow pipe inside -->
    <path d="M 96 260 L 126 260 A 20 20 0 0 1 146 240 L 146 220" stroke="url(#copperPipe)" stroke-width="24" fill="none" stroke-linecap="round" />
    <!-- Rotation Arrow -->
    <path d="M 148 275 A 25 25 0 0 1 105 275" stroke="#facc15" stroke-width="3" fill="none" stroke-dasharray="4 3" />
    <polygon points="103,275 109,270 109,280" fill="#facc15" />
  </g>

  <!-- Floating Level Badge -->
  <g filter="url(#pipeShadow)" transform="translate(140, 20)">
    <rect x="0" y="0" width="232" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <text x="116" y="27" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#67e8f9">
      FLOW CONNECTED! 💧
    </text>
  </g>
</svg>
