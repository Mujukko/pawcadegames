<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#facc15" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Pig Pink Gradient -->
    <linearGradient id="pigGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Chick Yellow Gradient -->
    <linearGradient id="chickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Sheep White Gradient -->
    <linearGradient id="sheepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Cow Gradient -->
    <linearGradient id="cowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Hay Cart Wood -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="512" height="512" fill="url(#skyGrad)"/>
  <circle cx="90" cy="90" r="140" fill="url(#sunGlow)"/>

  <!-- Puffy Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="390" cy="110" r="45"/>
    <circle cx="430" cy="115" r="35"/>
    <circle cx="355" cy="120" r="30"/>
    <circle cx="100" cy="220" r="35"/>
    <circle cx="130" cy="225" r="28"/>
  </g>

  <!-- Crane Cable at Top -->
  <rect x="254" y="0" width="4" height="65" fill="#451a03"/>
  <path d="M 248 65 Q 256 78 264 65" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>

  <!-- Top Swinging Chick (Dangling from Crane) -->
  <g transform="translate(256, 105)">
    <rect x="-42" y="-36" width="84" height="72" rx="20" fill="url(#chickGrad)" stroke="#a16207" stroke-width="4"/>
    <!-- Chick Eyes -->
    <circle cx="-16" cy="-10" r="6" fill="#1e293b"/>
    <circle cx="16" cy="-10" r="6" fill="#1e293b"/>
    <circle cx="-18" cy="-12" r="2" fill="#ffffff"/>
    <circle cx="14" cy="-12" r="2" fill="#ffffff"/>
    <!-- Orange Beak -->
    <polygon points="0,-4 -12,8 12,8" fill="#ea580c"/>
    <!-- Blush -->
    <circle cx="-26" cy="4" r="5" fill="#f87171" opacity="0.6"/>
    <circle cx="26" cy="4" r="5" fill="#f87171" opacity="0.6"/>
  </g>

  <!-- Starburst Sparkles around Crane Drop -->
  <g fill="#fde047">
    <polygon points="180,85 186,95 198,97 189,105 192,117 180,110 168,117 171,105 162,97 174,95"/>
    <polygon points="340,90 344,98 353,100 346,106 348,115 340,110 332,115 334,106 327,100 336,98"/>
  </g>

  <!-- Stacked Animals (From Top to Bottom) -->
  <!-- 1. Fluffy Sheep -->
  <g transform="translate(256, 185)">
    <rect x="-48" y="-38" width="96" height="76" rx="24" fill="url(#sheepGrad)" stroke="#64748b" stroke-width="4"/>
    <!-- Wool puffs -->
    <circle cx="-38" cy="-32" r="14" fill="#ffffff"/>
    <circle cx="38" cy="-32" r="14" fill="#ffffff"/>
    <circle cx="0" cy="-38" r="16" fill="#ffffff"/>
    <!-- Sheep Face -->
    <ellipse cx="0" cy="-4" rx="26" ry="22" fill="#f1f5f9"/>
    <circle cx="-10" cy="-6" r="4" fill="#0f172a"/>
    <circle cx="10" cy="-6" r="4" fill="#0f172a"/>
    <path d="M -6,6 Q 0,12 6,6" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 2. Piglet -->
  <g transform="translate(254, 260)">
    <rect x="-52" y="-38" width="104" height="76" rx="24" fill="url(#pigGrad)" stroke="#be185d" stroke-width="4"/>
    <!-- Pig Ears -->
    <polygon points="-42,-34 -56,-52 -28,-40" fill="#f472b6"/>
    <polygon points="42,-34 56,-52 28,-40" fill="#f472b6"/>
    <!-- Pig Snout -->
    <ellipse cx="0" cy="2" rx="20" ry="14" fill="#f472b6" stroke="#db2777" stroke-width="3"/>
    <circle cx="-7" cy="2" r="3" fill="#831843"/>
    <circle cx="7" cy="2" r="3" fill="#831843"/>
    <!-- Eyes -->
    <circle cx="-20" cy="-14" r="5" fill="#0f172a"/>
    <circle cx="20" cy="-14" r="5" fill="#0f172a"/>
  </g>

  <!-- 3. Bessie Cow -->
  <g transform="translate(256, 342)">
    <rect x="-62" y="-42" width="124" height="84" rx="26" fill="url(#cowGrad)" stroke="#334155" stroke-width="4"/>
    <!-- Black Cow Patches -->
    <path d="M -50 -30 Q -30 -10 -40 10 Q -58 20 -60 -10 Z" fill="#1e293b"/>
    <path d="M 40 -35 Q 58 -10 50 15 Q 30 10 38 -20 Z" fill="#1e293b"/>
    <!-- Horns -->
    <path d="M -46 -40 Q -56 -60 -36 -50" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <path d="M 46 -40 Q 56 -60 36 -50" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <!-- Cow Muzzle -->
    <ellipse cx="0" cy="12" rx="28" ry="18" fill="#fbcfe8" stroke="#f472b6" stroke-width="3"/>
    <circle cx="-10" cy="12" r="4" fill="#be185d"/>
    <circle cx="10" cy="12" r="4" fill="#be185d"/>
    <!-- Eyes -->
    <circle cx="-24" cy="-10" r="5" fill="#0f172a"/>
    <circle cx="24" cy="-10" r="5" fill="#0f172a"/>
  </g>

  <!-- Hay Cart Base -->
  <g transform="translate(256, 420)">
    <!-- Golden Hay Overflow -->
    <ellipse cx="0" cy="-8" rx="80" ry="16" fill="#fde047" stroke="#ca8a04" stroke-width="3"/>
    <!-- Wooden Cart Bed -->
    <rect x="-85" y="0" width="170" height="42" rx="8" fill="url(#woodGrad)" stroke="#1c1917" stroke-width="4"/>
    <!-- Wooden Planks Detail -->
    <line x1="-80" y1="14" x2="80" y2="14" stroke="#451a03" stroke-width="2"/>
    <line x1="-80" y1="28" x2="80" y2="28" stroke="#451a03" stroke-width="2"/>
    <!-- Cart Wheels -->
    <circle cx="-50" cy="46" r="18" fill="#1c1917" stroke="#78350f" stroke-width="4"/>
    <circle cx="-50" cy="46" r="7" fill="#d97706"/>
    <circle cx="50" cy="46" r="18" fill="#1c1917" stroke="#78350f" stroke-width="4"/>
    <circle cx="50" cy="46" r="7" fill="#d97706"/>
  </g>

  <!-- Farm Ground Pasture -->
  <rect x="0" y="468" width="512" height="44" fill="#15803d"/>
  <rect x="0" y="464" width="512" height="6" fill="#22c55e"/>
</svg>
