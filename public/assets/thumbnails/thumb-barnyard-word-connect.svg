<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="woodDial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="36" fill="url(#bgGrad)"/>

  <!-- Radial Glow Behind Grid -->
  <circle cx="256" cy="160" r="140" fill="#38bdf8" opacity="0.12"/>

  <!-- Floating Crossword Grid Tiles (Top Area) -->
  <g filter="url(#shadow)">
    <!-- Row 0: B A R N -->
    <!-- Tile B -->
    <rect x="146" y="80" width="50" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="171" y="116" font-family="sans-serif" font-weight="900" font-size="28" fill="#38bdf8" text-anchor="middle">B</text>

    <!-- Tile A -->
    <rect x="202" y="80" width="50" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="227" y="116" font-family="sans-serif" font-weight="900" font-size="28" fill="#38bdf8" text-anchor="middle">A</text>

    <!-- Tile R -->
    <rect x="258" y="80" width="50" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="283" y="116" font-family="sans-serif" font-weight="900" font-size="28" fill="#38bdf8" text-anchor="middle">R</text>

    <!-- Tile N -->
    <rect x="314" y="80" width="50" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="339" y="116" font-family="sans-serif" font-weight="900" font-size="28" fill="#38bdf8" text-anchor="middle">N</text>

    <!-- Column down from B: A, R (BAR) -->
    <rect x="146" y="136" width="50" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="171" y="172" font-family="sans-serif" font-weight="900" font-size="28" fill="#94a3b8" text-anchor="middle">A</text>

    <rect x="146" y="192" width="50" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="171" y="228" font-family="sans-serif" font-weight="900" font-size="28" fill="#94a3b8" text-anchor="middle">R</text>

    <!-- Column down from R: A, N (RAN) -->
    <rect x="258" y="136" width="50" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="283" y="172" font-family="sans-serif" font-weight="900" font-size="28" fill="#94a3b8" text-anchor="middle">A</text>

    <rect x="258" y="192" width="50" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="283" y="228" font-family="sans-serif" font-weight="900" font-size="28" fill="#94a3b8" text-anchor="middle">N</text>
  </g>

  <!-- Golden Stars & Sparkles -->
  <g fill="#fef08a" opacity="0.9">
    <path d="M 100 80 L 105 92 L 117 94 L 108 103 L 110 115 L 100 109 L 90 115 L 92 103 L 83 94 L 95 92 Z"/>
    <path d="M 400 90 L 404 100 L 414 102 L 406 109 L 408 119 L 400 114 L 392 119 L 394 109 L 386 102 L 396 100 Z"/>
    <circle cx="390" cy="180" r="5" fill="#38bdf8"/>
    <circle cx="110" cy="170" r="4" fill="#38bdf8"/>
  </g>

  <!-- Circular Wooden Dial (Bottom Half) -->
  <g filter="url(#shadow)">
    <!-- Outer Rim -->
    <circle cx="256" cy="380" r="110" fill="url(#woodDial)" stroke="#d97706" stroke-width="5"/>
    <circle cx="256" cy="380" r="102" fill="#291104" stroke="#451a03" stroke-width="2"/>

    <!-- Connecting Energy Drag Lines -->
    <path d="M 256 305 L 330 380 L 256 455" fill="none" stroke="url(#lineGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Dial Letter Buttons -->
  <!-- Top: B (cx: 256, cy: 305) -->
  <g transform="translate(256, 305)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="28" fill="url(#tileGrad)" stroke="#b45309" stroke-width="2"/>
    <text x="0" y="9" font-family="sans-serif" font-weight="900" font-size="26" fill="#451a03" text-anchor="middle">B</text>
  </g>

  <!-- Right: A (cx: 330, cy: 380) -->
  <g transform="translate(330, 380)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="28" fill="url(#tileGrad)" stroke="#b45309" stroke-width="2"/>
    <text x="0" y="9" font-family="sans-serif" font-weight="900" font-size="26" fill="#451a03" text-anchor="middle">A</text>
  </g>

  <!-- Bottom: R (cx: 256, cy: 455) -->
  <g transform="translate(256, 455)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="28" fill="url(#tileGrad)" stroke="#b45309" stroke-width="2"/>
    <text x="0" y="9" font-family="sans-serif" font-weight="900" font-size="26" fill="#451a03" text-anchor="middle">R</text>
  </g>

  <!-- Left: N (cx: 182, cy: 380) -->
  <g transform="translate(182, 380)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="28" fill="#fef08a" stroke="#b45309" stroke-width="2"/>
    <text x="0" y="9" font-family="sans-serif" font-weight="900" font-size="26" fill="#451a03" text-anchor="middle">N</text>
  </g>

  <!-- Cute Sunny Corgi Peeking from Bottom Right -->
  <g transform="translate(360, 370)" filter="url(#shadow)">
    <!-- Corgi Head -->
    <ellipse cx="60" cy="55" rx="42" ry="36" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
    <!-- White Face Mask -->
    <path d="M 60 40 C 50 40, 42 60, 42 75 C 42 85, 78 85, 78 75 C 78 60, 70 40, 60 40 Z" fill="#fffbeb"/>
    <!-- Big Pointy Left Ear -->
    <path d="M 30 35 L 12 -5 Q 35 5, 42 28 Z" fill="#ea580c" stroke="#b45309" stroke-width="2"/>
    <path d="M 28 30 L 16 2 Q 32 10, 38 25 Z" fill="#fed7aa"/>
    <!-- Big Pointy Right Ear -->
    <path d="M 90 35 L 108 -5 Q 85 5, 78 28 Z" fill="#ea580c" stroke="#b45309" stroke-width="2"/>
    <path d="M 92 30 L 104 2 Q 88 10, 82 25 Z" fill="#fed7aa"/>
    <!-- Snout & Nose -->
    <ellipse cx="60" cy="65" rx="7" ry="5" fill="#1e1b4b"/>
    <circle cx="58" cy="64" r="1.5" fill="#fff"/>
    <!-- Mouth & Tongue -->
    <path d="M 55 70 Q 60 75, 65 70" fill="none" stroke="#1e1b4b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 58 72 Q 60 80, 62 72 Z" fill="#f43f5e"/>
    <!-- Sparkly Eyes -->
    <ellipse cx="44" cy="50" rx="5" ry="7" fill="#1e1b4b"/>
    <ellipse cx="76" cy="50" rx="5" ry="7" fill="#1e1b4b"/>
    <circle cx="42" cy="48" r="2" fill="#fff"/>
    <circle cx="74" cy="48" r="2" fill="#fff"/>
    <!-- Red Bandana -->
    <path d="M 35 80 Q 60 92, 85 80 L 60 102 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="50" cy="85" r="1.5" fill="#fff"/>
    <circle cx="65" cy="87" r="1.5" fill="#fff"/>
  </g>
</svg>
