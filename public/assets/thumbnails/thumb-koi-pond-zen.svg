<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="pondGrad" cx="50%" cy="45%" r="55%" fx="45%" fy="40%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="80%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </radialGradient>

    <!-- Deep Water Depth -->
    <radialGradient id="deepGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0f766e" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0.85" />
    </radialGradient>

    <!-- Kohaku White Body -->
    <linearGradient id="kohakuBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Kohaku Red Markings -->
    <linearGradient id="kohakuRed" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Yamabuki Gold Body -->
    <linearGradient id="goldBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Fin Translucency -->
    <linearGradient id="finGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.3" />
    </linearGradient>

    <!-- Lily Pad Gradient -->
    <linearGradient id="lilyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="60%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Lotus Petal Gradients -->
    <linearGradient id="lotusPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="lotusCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#021c1a" flood-opacity="0.6" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="40" fill="#042f2e" />

  <!-- Zen Pond Basin -->
  <circle cx="256" cy="256" r="236" fill="url(#pondGrad)" filter="url(#softShadow)" />
  <circle cx="256" cy="256" r="236" fill="url(#deepGlow)" />

  <!-- Pond Ripple Circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.18" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="85" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35" />

  <!-- Additional Ripple Cluster near drop -->
  <circle cx="340" cy="180" r="45" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="340" cy="180" r="25" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.45" />
  <circle cx="340" cy="180" r="6" fill="#fde047" />

  <!-- ================= KOI 1: KOHAKU (Red & White) ================= -->
  <g transform="translate(200, 290) rotate(-42)">
    <!-- Fish Shadow in Water -->
    <ellipse cx="6" cy="14" rx="38" ry="80" fill="#042f2e" opacity="0.45" transform="rotate(6)" />

    <!-- Flowing Tail Fin -->
    <path d="M-8,75 Q-28,125 -10,140 Q0,105 10,140 Q28,125 8,75 Z" fill="url(#finGlow)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7" />
    <path d="M0,75 L-6,130 M0,75 L0,120 M0,75 L6,130" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5" />

    <!-- Left Pectoral Fin -->
    <path d="M-30,-15 Q-70,-5 -55,30 Q-30,20 -24,5 Z" fill="url(#finGlow)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Right Pectoral Fin -->
    <path d="M30,-15 Q70,-5 55,30 Q30,20 24,5 Z" fill="url(#finGlow)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Dorsal Fin -->
    <path d="M-4,10 Q-6,45 -2,70 Q4,45 2,10 Z" fill="url(#finGlow)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8" />

    <!-- Main Fish Body (Silky White) -->
    <path d="M0,-65 C-42,-25 -40,35 -8,75 C0,80 0,80 8,75 C40,35 42,-25 0,-65 Z" fill="url(#kohakuBody)" filter="url(#softShadow)" />

    <!-- Kohaku Vivid Scarlet Markings (Hi) -->
    <!-- Head Patch (Menkaburi) -->
    <path d="M0,-58 C-18,-42 -14,-20 0,-18 C14,-20 18,-42 0,-58 Z" fill="url(#kohakuRed)" />
    <!-- Mid-body Saddle Patch -->
    <path d="M-12,-8 C-32,5 -28,38 -6,44 C12,42 22,25 18,-4 C6,-12 -4,-12 -12,-8 Z" fill="url(#kohakuRed)" />
    <!-- Tail-peduncle Patch -->
    <path d="M-5,52 C-14,60 -6,72 2,70 C10,68 8,56 -5,52 Z" fill="url(#kohakuRed)" />

    <!-- Cute Stylized Eyes -->
    <ellipse cx="-16" cy="-42" rx="4.5" ry="6" fill="#0f172a" />
    <circle cx="-17" cy="-44" r="2" fill="#ffffff" />
    <ellipse cx="16" cy="-42" rx="4.5" ry="6" fill="#0f172a" />
    <circle cx="15" cy="-44" r="2" fill="#ffffff" />

    <!-- Cute Whiskers (Barbels) -->
    <path d="M-8,-62 Q-18,-70 -24,-66" stroke="#e2e8f0" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M8,-62 Q18,-70 24,-66" stroke="#e2e8f0" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- ================= KOI 2: YAMABUKI OGON (Golden Koi) ================= -->
  <g transform="translate(325, 215) rotate(138)">
    <!-- Shadow -->
    <ellipse cx="6" cy="12" rx="34" ry="72" fill="#042f2e" opacity="0.4" transform="rotate(-5)" />

    <!-- Flowing Tail Fin -->
    <path d="M-6,65 Q-24,110 -8,125 Q0,95 8,125 Q24,110 6,65 Z" fill="url(#goldBody)" opacity="0.75" />
    <path d="M-6,65 Q-24,110 -8,125 Q0,95 8,125 Q24,110 6,65 Z" fill="url(#finGlow)" stroke="#fde047" stroke-width="1.5" stroke-opacity="0.8" />

    <!-- Pectoral Fins -->
    <path d="M-26,-12 Q-60,-2 -48,26 Q-26,18 -20,4 Z" fill="url(#finGlow)" stroke="#fde047" stroke-width="1.5" stroke-opacity="0.7" />
    <path d="M26,-12 Q60,-2 48,26 Q26,18 20,4 Z" fill="url(#finGlow)" stroke="#fde047" stroke-width="1.5" stroke-opacity="0.7" />

    <!-- Dorsal Fin -->
    <path d="M-3,8 Q-5,38 -2,60 Q3,38 2,8 Z" fill="url(#finGlow)" stroke="#fde047" stroke-width="1" />

    <!-- Main Golden Body -->
    <path d="M0,-55 C-36,-20 -34,30 -6,65 C0,70 0,70 6,65 C34,30 36,-20 0,-55 Z" fill="url(#goldBody)" filter="url(#softShadow)" />

    <!-- Golden Metallic Scales Shine -->
    <path d="M-8,-25 Q0,-32 8,-25 Q0,-18 -8,-25 Z" fill="#ffffff" opacity="0.5" />
    <path d="M-12,-2 Q0,-10 12,-2 Q0,6 -12,-2 Z" fill="#ffffff" opacity="0.4" />
    <path d="M-8,22 Q0,15 8,22 Q0,29 -8,22 Z" fill="#ffffff" opacity="0.35" />

    <!-- Eyes -->
    <ellipse cx="-14" cy="-35" rx="4" ry="5.5" fill="#451a03" />
    <circle cx="-15" cy="-37" r="1.8" fill="#ffffff" />
    <ellipse cx="14" cy="-35" rx="4" ry="5.5" fill="#451a03" />
    <circle cx="13" cy="-37" r="1.8" fill="#ffffff" />

    <!-- Whiskers -->
    <path d="M-6,-52 Q-16,-60 -20,-56" stroke="#fef08a" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M6,-52 Q16,-60 20,-56" stroke="#fef08a" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- ================= FLOATING LILY PAD & LOTUS ================= -->
  <g transform="translate(130, 150) rotate(-18)">
    <!-- Lily Pad Shadow -->
    <ellipse cx="4" cy="8" rx="64" ry="60" fill="#022c22" opacity="0.5" />

    <!-- Lily Pad with Notched Cut -->
    <path d="M0,0 L18,-56 A60,56 0 1,1 -18,-56 Z" fill="url(#lilyGrad)" stroke="#15803d" stroke-width="3" />
    <!-- Lily Pad Veins -->
    <path d="M0,0 L0,48 M0,0 L36,30 M0,0 L48,-10 M0,0 L32,-42 M0,0 L-36,30 M0,0 L-48,-10 M0,0 L-32,-42" stroke="#86efac" stroke-width="1.8" stroke-opacity="0.4" fill="none" />

    <!-- Water Dew Droplet on Lily Pad -->
    <ellipse cx="22" cy="18" rx="6" ry="5" fill="#ffffff" opacity="0.75" />
    <circle cx="21" cy="16" r="2" fill="#ffffff" />

    <!-- Blooming Pink Lotus Flower -->
    <g transform="translate(0, 4) scale(0.95)">
      <!-- Outer Petals -->
      <path d="M0,18 C-32,18 -46,-10 0,-44 C46,-10 32,18 0,18 Z" fill="url(#lotusPink)" opacity="0.9" />
      <path d="M-18,12 C-45,8 -52,-25 -20,-38 C-2,-30 6,-8 -18,12 Z" fill="url(#lotusPink)" />
      <path d="M18,12 C45,8 52,-25 20,-38 C2,-30 -6,-8 18,12 Z" fill="url(#lotusPink)" />

      <!-- Inner Bright Petals -->
      <path d="M-10,14 C-28,4 -30,-22 0,-34 C30,-22 28,4 10,14 Z" fill="#f472b6" />
      <path d="M0,15 C-16,6 -18,-18 0,-28 C18,-18 16,6 0,15 Z" fill="#fbcfe8" />

      <!-- Golden Lotus Crown Stamen -->
      <circle cx="0" cy="-2" r="8" fill="url(#lotusCenter)" filter="url(#glowFilter)" />
      <circle cx="-3" cy="-4" r="1.5" fill="#78350f" />
      <circle cx="3" cy="-4" r="1.5" fill="#78350f" />
      <circle cx="0" cy="1" r="1.5" fill="#78350f" />
    </g>
  </g>

  <!-- Smaller Second Lily Pad in Lower Right -->
  <g transform="translate(415, 385) rotate(75)">
    <ellipse cx="3" cy="5" rx="42" ry="38" fill="#022c22" opacity="0.45" />
    <path d="M0,0 L12,-36 A38,36 0 1,1 -12,-36 Z" fill="url(#lilyGrad)" stroke="#15803d" stroke-width="2" />
    <!-- Tiny Lotus Bud -->
    <ellipse cx="2" cy="-2" rx="9" ry="14" fill="url(#lotusPink)" />
  </g>

  <!-- Floating Sakura Petals -->
  <g filter="url(#softShadow)">
    <path d="M280,95 C272,85 285,75 292,85 C298,95 288,105 280,95 Z" fill="#fda4af" opacity="0.9" transform="rotate(25 280 95)" />
    <path d="M180,410 C172,400 185,390 192,400 C198,410 188,420 180,410 Z" fill="#fda4af" opacity="0.85" transform="rotate(-35 180 410)" />
    <path d="M380,285 C374,277 384,268 390,277 C395,285 386,293 380,285 Z" fill="#f472b6" opacity="0.8" transform="rotate(60 380 285)" />
  </g>

  <!-- Glowing Water Sparkles / Fireflies -->
  <circle cx="190" cy="220" r="3.5" fill="#fef08a" opacity="0.8" filter="url(#glowFilter)" />
  <circle cx="370" cy="140" r="2.5" fill="#ffffff" opacity="0.9" />
  <circle cx="270" cy="380" r="3" fill="#fef08a" opacity="0.75" filter="url(#glowFilter)" />
  <circle cx="105" cy="330" r="2" fill="#a7f3d0" opacity="0.7" />

  <!-- Outer Bamboo Border Rim Frame -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ca8a04" stroke-width="7" stroke-opacity="0.7" />
  <circle cx="256" cy="256" r="239" fill="none" stroke="#78350f" stroke-width="2" />
</svg>
