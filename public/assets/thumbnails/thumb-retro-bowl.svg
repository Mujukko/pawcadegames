<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <radialGradient id="ballGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="60%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>

    <filter id="ballGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Stadium Field Background -->
  <rect width="600" height="400" fill="url(#grassGrad)" />

  <!-- Field Grass Alternating Stripes -->
  <rect x="0" y="80" width="600" height="40" fill="#15803d" opacity="0.4" />
  <rect x="0" y="160" width="600" height="40" fill="#15803d" opacity="0.4" />
  <rect x="0" y="240" width="600" height="40" fill="#15803d" opacity="0.4" />
  <rect x="0" y="320" width="600" height="40" fill="#15803d" opacity="0.4" />

  <!-- Yard Lines -->
  <line x1="80" y1="0" x2="80" y2="400" stroke="#ffffff" stroke-width="4" opacity="0.8" />
  <line x1="200" y1="0" x2="200" y2="400" stroke="#ffffff" stroke-width="4" opacity="0.8" />
  <line x1="320" y1="0" x2="320" y2="400" stroke="#ffffff" stroke-width="4" opacity="0.8" />
  <line x1="440" y1="0" x2="440" y2="400" stroke="#ffffff" stroke-width="4" opacity="0.8" />
  <line x1="560" y1="0" x2="560" y2="400" stroke="#facc15" stroke-width="8" opacity="0.9" />

  <!-- Yard Numbers -->
  <text x="200" y="50" fill="#ffffff" font-size="28" font-weight="900" font-family="monospace" text-anchor="middle" opacity="0.6">20</text>
  <text x="320" y="50" fill="#ffffff" font-size="28" font-weight="900" font-family="monospace" text-anchor="middle" opacity="0.6">30</text>
  <text x="440" y="50" fill="#ffffff" font-size="28" font-weight="900" font-family="monospace" text-anchor="middle" opacity="0.6">40</text>

  <!-- Passing Trajectory Arc (Yellow dotted) -->
  <path d="M 80 280 Q 240 100 420 220" stroke="#facc15" stroke-width="5" stroke-dasharray="10 8" fill="none" opacity="0.85" />

  <!-- Target Reticle -->
  <circle cx="420" cy="220" r="24" stroke="#ef4444" stroke-width="3" fill="none" opacity="0.8" />
  <circle cx="420" cy="220" r="8" fill="#ef4444" opacity="0.8" />

  <!-- Flying Football with motion blur -->
  <g transform="translate(260, 160) rotate(-22)" filter="url(#ballGlow)">
    <ellipse cx="0" cy="0" rx="55" ry="34" fill="url(#ballGrad)" />
    <!-- White stripes -->
    <path d="M -30 -22 C -24 -10 -24 10 -30 22" stroke="#ffffff" stroke-width="6" fill="none" />
    <path d="M 30 -22 C 24 -10 24 10 30 22" stroke="#ffffff" stroke-width="6" fill="none" />
    <!-- Laces -->
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#ffffff" stroke-width="4" />
    <line x1="-10" y1="-7" x2="-10" y2="7" stroke="#ffffff" stroke-width="3" />
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#ffffff" stroke-width="3" />
    <line x1="10" y1="-7" x2="10" y2="7" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Player Helmets -->
  <!-- Blue QB -->
  <circle cx="80" cy="280" r="26" fill="#2563eb" stroke="#ffffff" stroke-width="4" />
  <text x="80" y="286" fill="#ffffff" font-size="14" font-weight="900" font-family="sans-serif" text-anchor="middle">QB</text>

  <!-- Receiver WR -->
  <circle cx="420" cy="220" r="24" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />
  <text x="420" y="226" fill="#ffffff" font-size="13" font-weight="900" font-family="sans-serif" text-anchor="middle">WR</text>

  <!-- Defender CB -->
  <circle cx="480" cy="180" r="24" fill="#dc2626" stroke="#ffffff" stroke-width="3" />
  <text x="480" y="186" fill="#ffffff" font-size="13" font-weight="900" font-family="sans-serif" text-anchor="middle">CB</text>

  <!-- Title Badge -->
  <rect x="25" y="325" width="230" height="50" rx="12" fill="#0f172a" opacity="0.9" stroke="#facc15" stroke-width="2" />
  <text x="140" y="348" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">RETRO BOWL</text>
  <text x="140" y="365" fill="#facc15" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">BARNYARD GRIDIRON</text>
</svg>
