<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="foxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Manor Barn -->
  <rect width="400" height="300" fill="url(#bgGrad)" />

  <!-- Moon Beam Window -->
  <rect x="20" y="20" width="60" height="80" rx="4" fill="#1e293b" />
  <rect x="25" y="25" width="22" height="32" fill="#38bdf8" opacity="0.3" />
  <rect x="53" y="25" width="22" height="32" fill="#38bdf8" opacity="0.3" />
  <rect x="25" y="63" width="22" height="32" fill="#38bdf8" opacity="0.3" />
  <rect x="53" y="63" width="22" height="32" fill="#38bdf8" opacity="0.3" />

  <!-- Wooden Floor & Beams -->
  <rect x="0" y="240" width="400" height="60" fill="#451a03" />
  <rect x="0" y="240" width="400" height="6" fill="#78350f" />
  <rect x="180" y="140" width="220" height="12" fill="#451a03" />
  <rect x="180" y="140" width="220" height="4" fill="#78350f" />

  <!-- Wooden Ladder -->
  <rect x="200" y="140" width="4" height="100" fill="#92400e" />
  <rect x="220" y="140" width="4" height="100" fill="#92400e" />
  <line x1="200" y1="160" x2="224" y2="160" stroke="#b45309" stroke-width="3" />
  <line x1="200" y1="180" x2="224" y2="180" stroke="#b45309" stroke-width="3" />
  <line x1="200" y1="200" x2="224" y2="200" stroke="#b45309" stroke-width="3" />
  <line x1="200" y1="220" x2="224" y2="220" stroke="#b45309" stroke-width="3" />

  <!-- Shadow Doorway -->
  <rect x="60" y="150" width="50" height="90" rx="6" fill="#020617" />
  <rect x="60" y="150" width="50" height="90" rx="6" stroke="#1e293b" stroke-width="2" fill="none" />

  <!-- Flashlight Cone from Patrolling Guard -->
  <polygon points="380,80 260,110 270,140" fill="#facc15" opacity="0.18" />

  <!-- Sleeping Bulldog Guard (Barnaby) on Upper Floor -->
  <g transform="translate(320, 126)">
    <rect x="-16" y="-12" width="32" height="26" rx="8" fill="#78716c" />
    <circle x="12" y="-10" r="10" fill="#57534e" />
    <!-- Blue Nightcap -->
    <polygon points="0,-16 16,-28 14,-14" fill="#3b82f6" />
    <circle cx="16" cy="-28" r="3" fill="#ffffff" />
    <!-- Zzz Floating -->
    <text x="24" y="-22" font-family="sans-serif" font-weight="900" font-size="12" fill="#93c5fd" opacity="0.8">Zzz</text>
  </g>

  <!-- Sly the Fox Thief in Forefront -->
  <g transform="translate(140, 200)" filter="url(#shadow)">
    <!-- Bushy Tail with white tip -->
    <path d="M-20,10 Q-45,25 -50,-5 Q-40,-20 -25,-5 Z" fill="url(#foxGrad)" />
    <circle cx="-46" cy="-10" r="8" fill="#ffffff" />

    <!-- Fox Body -->
    <ellipse cx="0" cy="10" rx="20" ry="24" fill="url(#foxGrad)" />
    <!-- White Chest -->
    <ellipse cx="8" cy="14" rx="10" ry="15" fill="#f8fafc" />

    <!-- Fox Head -->
    <circle cx="14" cy="-16" r="16" fill="url(#foxGrad)" />
    <!-- Fox Ears -->
    <polygon points="6,-30 14,-46 20,-30" fill="url(#foxGrad)" />
    <polygon points="9,-30 14,-42 18,-30" fill="#fed7aa" />
    <polygon points="18,-28 26,-44 30,-28" fill="url(#foxGrad)" />
    <polygon points="20,-28 26,-40 28,-28" fill="#fed7aa" />

    <!-- White Snout -->
    <ellipse cx="26" cy="-12" rx="10" ry="7" fill="#f8fafc" />
    <circle cx="33" cy="-14" r="3.5" fill="#0f172a" />

    <!-- Domino Mask -->
    <rect x="8" cy="-24" width="22" height="9" rx="3" fill="#0f172a" />
    <circle cx="16" cy="-20" r="3.5" fill="#ffffff" />
    <circle cx="17.5" cy="-20" r="2" fill="#020617" />
    <circle cx="25" cy="-20" r="3.5" fill="#ffffff" />
    <circle cx="26.5" cy="-20" r="2" fill="#020617" />

    <!-- Claws holding Golden Egg -->
    <g transform="translate(24, 8)">
      <ellipse cx="0" cy="0" rx="12" ry="16" fill="url(#goldGrad)" filter="url(#shadow)" />
      <!-- Egg sparkle -->
      <polygon points="0,-10 2,-4 8,-2 2,0 0,6 -2,0 -8,-2 -2,-4" fill="#ffffff" opacity="0.9" />
    </g>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(200, 36)">
    <rect x="-145" y="-18" width="290" height="38" rx="19" fill="#090d16" opacity="0.92" filter="url(#shadow)" />
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#facc15" letter-spacing="1">
      BARNYARD STEALTH FOX
    </text>
  </g>
</svg>
