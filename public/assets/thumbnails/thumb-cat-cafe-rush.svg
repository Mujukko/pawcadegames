<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cafeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="counterWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="whiteFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="taiyakiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="strawberryRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="70%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="matchaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="60%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4c0519" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Cafe Wall -->
  <rect width="512" height="512" rx="48" fill="url(#cafeBg)" />

  <!-- Cozy Cafe Awning Stripes at Top -->
  <g>
    <path d="M 0 0 L 512 0 L 512 70 Q 256 90 0 70 Z" fill="#fff1f2" opacity="0.9" />
    <path d="M 40 0 L 90 0 L 85 75 Q 60 76 40 73 Z" fill="#f43f5e" />
    <path d="M 150 0 L 200 0 L 195 80 Q 170 82 150 79 Z" fill="#f43f5e" />
    <path d="M 260 0 L 310 0 L 310 82 Q 285 82 260 80 Z" fill="#f43f5e" />
    <path d="M 370 0 L 420 0 L 425 78 Q 400 80 370 79 Z" fill="#f43f5e" />
    <path d="M 470 0 L 512 0 L 512 70 Q 490 73 470 72 Z" fill="#f43f5e" />
  </g>

  <!-- Background Cute Customer Cats (Peeking) -->
  <!-- Calico Customer (Left) -->
  <g transform="translate(90, 240) scale(0.65)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="50" fill="#fed7aa" stroke="#c2410c" stroke-width="6" />
    <path d="M -35 -35 L -45 -75 L -10 -50 Z" fill="#ea580c" stroke="#c2410c" stroke-width="5" />
    <path d="M 35 -35 L 45 -75 L 10 -50 Z" fill="#475569" stroke="#1e293b" stroke-width="5" />
    <circle cx="-16" cy="-6" r="8" fill="#1e293b" />
    <circle cx="16" cy="-6" r="8" fill="#1e293b" />
    <circle cx="-14" cy="-9" r="3" fill="#ffffff" />
    <circle cx="18" cy="-9" r="3" fill="#ffffff" />
    <polygon points="0,6 -6,14 6,14" fill="#f43f5e" />
    <!-- Happy Paws Up -->
    <ellipse cx="-45" cy="40" rx="16" ry="14" fill="#ffffff" stroke="#c2410c" stroke-width="4" />
  </g>

  <!-- Tabby Customer (Right) -->
  <g transform="translate(420, 250) scale(0.65)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="50" fill="#e2e8f0" stroke="#475569" stroke-width="6" />
    <path d="M -35 -35 L -45 -75 L -10 -50 Z" fill="#94a3b8" stroke="#475569" stroke-width="5" />
    <path d="M 35 -35 L 45 -75 L 10 -50 Z" fill="#94a3b8" stroke="#475569" stroke-width="5" />
    <circle cx="-16" cy="-6" r="8" fill="#1e293b" />
    <circle cx="16" cy="-6" r="8" fill="#1e293b" />
    <circle cx="-14" cy="-9" r="3" fill="#ffffff" />
    <circle cx="18" cy="-9" r="3" fill="#ffffff" />
    <polygon points="0,6 -6,14 6,14" fill="#f43f5e" />
    <ellipse cx="45" cy="40" rx="16" ry="14" fill="#ffffff" stroke="#475569" stroke-width="4" />
  </g>

  <!-- Polished Wooden Bakery Counter -->
  <g filter="url(#softShadow)">
    <rect x="20" y="360" width="472" height="135" rx="20" fill="url(#counterWood)" stroke="#78350f" stroke-width="6" />
    <rect x="24" y="364" width="464" height="20" rx="10" fill="#fef3c7" opacity="0.6" />
    <!-- Counter Paneling Planks -->
    <line x1="160" y1="390" x2="160" y2="490" stroke="#78350f" stroke-width="4" />
    <line x1="350" y1="390" x2="350" y2="490" stroke="#78350f" stroke-width="4" />
  </g>

  <!-- Main Hero Barista: Chibi White Kitten (Center) -->
  <g transform="translate(256, 260)" filter="url(#softShadow)">
    <!-- Cat Ears -->
    <path d="M -50 -55 L -65 -125 L -15 -85 Z" fill="url(#whiteFur)" stroke="#94a3b8" stroke-width="6" />
    <path d="M -46 -65 L -56 -112 L -24 -85 Z" fill="#fda4af" />

    <path d="M 50 -55 L 65 -125 L 15 -85 Z" fill="url(#whiteFur)" stroke="#94a3b8" stroke-width="6" />
    <path d="M 46 -65 L 56 -112 L 24 -85 Z" fill="#fda4af" />

    <!-- Cute Baker Hat (Toque) -->
    <ellipse cx="0" cy="-90" rx="42" ry="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" />
    <path d="M -35 -90 C -45 -135 -15 -145 0 -140 C 15 -145 45 -135 35 -90 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="5" />
    <circle cx="0" cy="-140" r="12" fill="#fb7185" />

    <!-- Chubby Head -->
    <ellipse cx="0" cy="-25" rx="68" ry="60" fill="url(#whiteFur)" stroke="#94a3b8" stroke-width="7" />

    <!-- Sparkling Kawaii Eyes -->
    <ellipse cx="-24" cy="-30" rx="11" ry="13" fill="#0f172a" />
    <ellipse cx="24" cy="-30" rx="11" ry="13" fill="#0f172a" />
    <circle cx="-21" cy="-34" r="5" fill="#ffffff" />
    <circle cx="27" cy="-34" r="5" fill="#ffffff" />
    <circle cx="-26" cy="-25" r="2.5" fill="#ffffff" />
    <circle cx="22" cy="-25" r="2.5" fill="#ffffff" />

    <!-- Sweet Pink Nose & Whiskers -->
    <polygon points="0,-14 -6,-6 6,-6" fill="#f43f5e" />
    <path d="M -6 -4 Q 0 4 6 -4" fill="none" stroke="#64748b" stroke-width="3.5" />
    <!-- Whiskers -->
    <line x1="-35" y1="-12" x2="-65" y2="-18" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="-35" y1="-6" x2="-68" y2="-5" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="35" y1="-12" x2="65" y2="-18" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="35" y1="-6" x2="68" y2="-5" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="-40" cy="-14" r="10" fill="#fb7185" opacity="0.65" />
    <circle cx="40" cy="-14" r="10" fill="#fb7185" opacity="0.65" />

    <!-- Pink Apron -->
    <path d="M -35 25 L 35 25 L 42 105 L -42 105 Z" fill="#fb7185" stroke="#e11d48" stroke-width="5" />
    <circle cx="0" cy="55" r="12" fill="#ffffff" />
    <path d="M -5 55 Q 0 50 5 55 Q 0 60 -5 55" fill="#e11d48" />
  </g>

  <!-- Serving Tray & Delicious Cat Bakery Delicacies -->
  <g transform="translate(256, 385)" filter="url(#softShadow)">
    <!-- Serving Platter -->
    <ellipse cx="0" cy="0" rx="145" ry="32" fill="#e2e8f0" stroke="#94a3b8" stroke-width="5" />
    <ellipse cx="0" cy="-4" rx="138" ry="26" fill="#ffffff" />

    <!-- 1. Taiyaki Fish Pastry (Center Left) -->
    <g transform="translate(-60, -14) rotate(-10)">
      <ellipse cx="0" cy="0" rx="36" ry="22" fill="url(#taiyakiGold)" stroke="#b45309" stroke-width="4" />
      <!-- Fish Tail -->
      <polygon points="-32,0 -52,-14 -46,0 -52,14" fill="url(#taiyakiGold)" stroke="#b45309" stroke-width="4" />
      <!-- Fish Eye & Scales -->
      <circle cx="20" cy="-5" r="4" fill="#78350f" />
      <path d="M -10 -10 Q 0 -5 -10 0 Q 0 5 -10 10" fill="none" stroke="#92400e" stroke-width="2.5" />
      <path d="M 5 -8 Q 15 -3 5 2 Q 15 7 5 12" fill="none" stroke="#92400e" stroke-width="2.5" />
    </g>

    <!-- 2. Strawberry Cat Shortcake (Center) -->
    <g transform="translate(5, -20)">
      <polygon points="0,-18 32,8 -32,8" fill="#fef08a" stroke="#ca8a04" stroke-width="4" />
      <!-- Cream Layer -->
      <rect x="-28" y="-2" width="56" height="6" fill="#ffffff" />
      <!-- Shiny Strawberry on Top -->
      <circle cx="0" cy="-22" r="10" fill="url(#strawberryRed)" stroke="#881337" stroke-width="2.5" />
      <polygon points="0,-32 -4,-26 4,-26" fill="#15803d" />
    </g>

    <!-- 3. Steaming Cat-Ear Milk Tea (Right) -->
    <g transform="translate(68, -12)">
      <rect x="-18" y="-20" width="36" height="34" rx="8" fill="url(#matchaGreen)" stroke="#166534" stroke-width="4" />
      <!-- Cat Ear Mug Lid -->
      <path d="M -18 -20 L -12 -28 L -6 -20 L 6 -20 L 12 -28 L 18 -20 Z" fill="#ffffff" stroke="#166534" stroke-width="3" />
      <!-- Steam Swirls -->
      <path d="M -6 -35 Q -10 -45 -4 -50" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      <path d="M 6 -32 Q 2 -42 8 -48" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    </g>
  </g>

  <!-- Golden Stars & Sparkles -->
  <g fill="#fde047" stroke="#ca8a04" stroke-width="2">
    <path d="M 75 140 L 80 152 L 92 154 L 83 162 L 86 174 L 75 167 L 64 174 L 67 162 L 58 154 L 70 152 Z" />
    <path d="M 430 145 L 435 157 L 447 159 L 438 167 L 441 179 L 430 172 L 419 179 L 422 167 L 413 159 L 425 157 Z" />
  </g>
</svg>
