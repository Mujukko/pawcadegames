<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="60%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldHorseshoe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Barn Workshop Wall -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Rustic Wooden Wall Planks -->
  <line x1="0" y1="120" x2="512" y2="120" stroke="#292524" stroke-width="3" opacity="0.6"/>
  <line x1="0" y1="240" x2="512" y2="240" stroke="#292524" stroke-width="3" opacity="0.6"/>
  <line x1="0" y1="360" x2="512" y2="360" stroke="#292524" stroke-width="3" opacity="0.6"/>
  <line x1="0" y1="480" x2="512" y2="480" stroke="#292524" stroke-width="3" opacity="0.6"/>

  <!-- Concentric Puzzle Rings Safe in the Center (Center cx=256, cy=270) -->
  <g transform="translate(256, 270)" filter="url(#heavyShadow)">
    <!-- Base Mounting Plate -->
    <circle cx="0" cy="0" r="190" fill="#292524" stroke="#78350f" stroke-width="10"/>

    <!-- Outer Iron Ring (Radius 165, Thickness 28) with notch at top (90 deg) -->
    <circle cx="0" cy="0" r="165" fill="none" stroke="url(#ironGrad)" stroke-width="28" stroke-dasharray="900 120" transform="rotate(35)"/>
    <!-- Iron Rivets -->
    <circle cx="0" cy="-165" r="4" fill="#cbd5e1"/>
    <circle cx="165" cy="0" r="4" fill="#cbd5e1"/>
    <circle cx="-165" cy="0" r="4" fill="#cbd5e1"/>

    <!-- Middle Oak Wooden Ring (Radius 120, Thickness 26) with notch at 180 deg -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#78350f" stroke-width="26" stroke-dasharray="640 100" transform="rotate(110)"/>

    <!-- Inner Polished Brass Ring (Radius 78, Thickness 24) with notch aligned -->
    <circle cx="0" cy="0" r="78" fill="none" stroke="url(#brassGrad)" stroke-width="24" stroke-dasharray="400 85" transform="rotate(-40)"/>

    <!-- Golden Alignment Ray (Green Laser Beam indicating unlocked notch) -->
    <line x1="0" y1="0" x2="190" y2="0" stroke="#22c55e" stroke-width="6" stroke-dasharray="8 6" opacity="0.8" filter="url(#goldGlow)"/>

    <!-- Central Hub -->
    <circle cx="0" cy="0" r="45" fill="#1c1917" stroke="url(#brassGrad)" stroke-width="6"/>

    <!-- The Lucky Golden Horseshoe! (Hero Centerpiece) -->
    <g transform="translate(0, -5) scale(0.75)" filter="url(#goldGlow)">
      <!-- U-Shape Horseshoe -->
      <path d="M-30 -25 L-30 15 C-30 38 30 38 30 15 L30 -25 C20 -25 18 -20 18 12 C18 22 -18 22 -18 12 C-18 -20 -20 -25 -30 -25 Z" fill="url(#goldHorseshoe)" stroke="#78350f" stroke-width="2"/>
      <!-- Horseshoe Nail Holes -->
      <circle cx="-24" cy="-15" r="2.5" fill="#451a03"/>
      <circle cx="-24" cy="0" r="2.5" fill="#451a03"/>
      <circle cx="-24" cy="15" r="2.5" fill="#451a03"/>
      <circle cx="24" cy="-15" r="2.5" fill="#451a03"/>
      <circle cx="24" cy="0" r="2.5" fill="#451a03"/>
      <circle cx="24" cy="15" r="2.5" fill="#451a03"/>
    </g>

    <!-- Keyway Pin sliding outward -->
    <circle cx="90" cy="0" r="10" fill="#facc15" stroke="#ffffff" stroke-width="3" filter="url(#goldGlow)"/>
  </g>

  <!-- Clover the Friendly Horse (Peeking from top-left) -->
  <g transform="translate(60, 20)" filter="url(#heavyShadow)">
    <!-- Horse Neck & Mane -->
    <path d="M40 90 Q30 50 80 40 L110 90 Z" fill="#b45309"/>
    <!-- Mane hair tufts -->
    <path d="M45 40 Q25 20 50 10 Q65 30 85 20" fill="#78350f"/>
    <!-- Head -->
    <ellipse cx="100" cy="70" rx="36" ry="26" fill="#b45309" transform="rotate(-15 100 70)"/>
    <!-- Snout & Nostril -->
    <ellipse cx="130" cy="80" rx="16" ry="14" fill="#d97706" transform="rotate(-15 130 80)"/>
    <circle cx="136" cy="82" r="3" fill="#451a03"/>
    <!-- Ears -->
    <polygon points="65,30 75,5 88,32" fill="#b45309"/>
    <polygon points="70,28 76,12 82,30" fill="#fbcfe8"/>
    <!-- Eye with happy sparkle -->
    <circle cx="95" cy="62" r="6" fill="#ffffff"/>
    <circle cx="96" cy="62" r="3.5" fill="#0f172a"/>
    <circle cx="98" cy="60.5" r="1.5" fill="#ffffff"/>
    <!-- Rosy Cheek -->
    <circle cx="108" cy="74" r="6" fill="#f43f5e" opacity="0.4"/>
  </g>

  <!-- Sparkling Golden Stars & Unlocking Magic -->
  <polygon points="380,180 387,196 404,196 391,207 396,223 380,212 364,223 369,207 356,196 373,196" fill="#facc15" filter="url(#goldGlow)"/>
  <polygon points="440,320 445,332 458,332 448,340 452,352 440,344 428,352 432,340 422,332 435,332" fill="#facc15" opacity="0.9"/>
  <polygon points="120,400 125,412 138,412 128,420 132,432 120,424 108,432 112,420 102,412 115,412" fill="#facc15" opacity="0.8"/>

  <!-- Unlock Rotation Arrow Badges -->
  <g transform="translate(390, 80)" filter="url(#goldGlow)">
    <circle cx="28" cy="28" r="28" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
    <!-- Curved Rotation Arrow -->
    <path d="M16 32 A 14 14 0 1 1 38 34" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <polygon points="36,26 44,36 34,40" fill="#ffffff"/>
  </g>
</svg>
