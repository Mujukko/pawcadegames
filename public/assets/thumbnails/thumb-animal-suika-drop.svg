<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glass Box Tint -->
    <linearGradient id="boxGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Box Wood Frame -->
    <linearGradient id="woodFrame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Watermelon Elephant Gradients -->
    <radialGradient id="melonRind" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </radialGradient>
    <radialGradient id="melonFlesh" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="70%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </radialGradient>

    <!-- Piglet Gradient -->
    <radialGradient id="pigletGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="65%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </radialGradient>

    <!-- Capybara Gradient -->
    <radialGradient id="capyGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <!-- Kitten Gradient -->
    <radialGradient id="kittenGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="65%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </radialGradient>

    <!-- Chick Gradient -->
    <radialGradient id="chickGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="60%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>

    <!-- Star Glow & Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Ambient Floating Sparkles -->
  <circle cx="80" cy="100" r="3" fill="#fef08a" opacity="0.6" />
  <circle cx="430" cy="80" r="4" fill="#a7f3d0" opacity="0.7" />
  <circle cx="60" cy="380" r="3" fill="#f472b6" opacity="0.5" />
  <circle cx="450" cy="360" r="4" fill="#fde68a" opacity="0.6" />

  <!-- The Suika Drop Container Box -->
  <g filter="url(#dropShadow)">
    <!-- Back glass fill -->
    <rect x="56" y="80" width="400" height="400" rx="16" fill="url(#boxGlass)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />
    
    <!-- Red Dotted Danger Overflow Line -->
    <line x1="58" y1="140" x2="454" y2="140" stroke="#f43f5e" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />
    <polygon points="68,140 76,134 76,146" fill="#f43f5e" />
    <polygon points="444,140 436,134 436,146" fill="#f43f5e" />

    <!-- Container Wall Frames (Wood Border) -->
    <!-- Left Wall -->
    <rect x="44" y="70" width="16" height="416" rx="6" fill="url(#woodFrame)" />
    <!-- Right Wall -->
    <rect x="452" y="70" width="16" height="416" rx="6" fill="url(#woodFrame)" />
    <!-- Bottom Floor -->
    <rect x="36" y="476" width="440" height="22" rx="8" fill="url(#woodFrame)" />
  </g>

  <!-- STACKED ANIMAL BALLS INSIDE BOX -->

  <!-- Mega Watermelon Elephant (Center-Right, Tier 9) -->
  <g filter="url(#dropShadow)">
    <!-- Main Elephant Sphere -->
    <circle cx="280" cy="365" r="105" fill="url(#melonRind)" stroke="#14532d" stroke-width="4" />
    <!-- Dark Green Watermelon Stripes -->
    <path d="M 230 270 Q 255 365 240 460" stroke="#14532d" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.75" />
    <path d="M 280 262 Q 295 365 285 470" stroke="#14532d" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.75" />
    <path d="M 330 270 Q 345 365 335 460" stroke="#14532d" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.75" />
    
    <!-- Floppy Big Elephant Ears -->
    <ellipse cx="190" cy="335" rx="26" ry="38" fill="#4ade80" stroke="#166534" stroke-width="3" transform="rotate(-15 190 335)" />
    <ellipse cx="190" cy="335" rx="16" ry="26" fill="#fda4af" opacity="0.8" transform="rotate(-15 190 335)" />
    
    <!-- Elephant Cute Face -->
    <!-- Cheerful Eyes -->
    <ellipse cx="235" cy="340" rx="9" ry="12" fill="#0f172a" />
    <circle cx="232" cy="336" r="3.5" fill="#ffffff" />
    <ellipse cx="275" cy="340" rx="9" ry="12" fill="#0f172a" />
    <circle cx="272" cy="336" r="3.5" fill="#ffffff" />
    
    <!-- Rosy Watermelon Cheeks -->
    <circle cx="218" cy="355" r="14" fill="#f43f5e" opacity="0.65" />
    <circle cx="292" cy="355" r="14" fill="#f43f5e" opacity="0.65" />

    <!-- Cute Trunk Curled Up -->
    <path d="M 255 350 Q 255 390 270 388 Q 282 386 280 374" stroke="#166534" stroke-width="10" fill="none" stroke-linecap="round" />
    <path d="M 255 350 Q 255 390 270 388 Q 282 386 280 374" stroke="#86efac" stroke-width="5" fill="none" stroke-linecap="round" />

    <!-- Glossy Highlight Crescent -->
    <path d="M 220 285 A 95 95 0 0 1 340 285" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Capybara (Bottom Left, Tier 8) -->
  <g filter="url(#dropShadow)">
    <circle cx="125" cy="405" r="62" fill="url(#capyGrad)" stroke="#78350f" stroke-width="3.5" />
    <!-- Ears -->
    <circle cx="85" cy="365" r="12" fill="#78350f" />
    <circle cx="85" cy="365" r="7" fill="#fde68a" />
    <!-- Chill Closed Zen Eyes -->
    <path d="M 100 395 Q 112 390 124 395" stroke="#451a03" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 136 395 Q 148 390 160 395" stroke="#451a03" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Snout & Nose -->
    <ellipse cx="130" cy="415" rx="18" ry="12" fill="#92400e" opacity="0.7" />
    <ellipse cx="130" cy="412" rx="7" ry="5" fill="#451a03" />
    <!-- Yuzu on top of Capy head -->
    <circle cx="125" cy="340" r="14" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <path d="M 125 326 Q 130 320 134 322" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- Piglet (Middle Left, Tier 5) -->
  <g filter="url(#dropShadow)">
    <circle cx="135" cy="275" r="44" fill="url(#pigletGrad)" stroke="#db2777" stroke-width="3" />
    <!-- Pointy Ears -->
    <polygon points="105,245 118,225 130,245" fill="#db2777" />
    <polygon points="140,245 152,225 165,245" fill="#db2777" />
    <!-- Happy Big Eyes -->
    <ellipse cx="122" cy="265" rx="6" ry="8" fill="#1e1b4b" />
    <circle cx="120" cy="262" r="2.5" fill="#ffffff" />
    <ellipse cx="148" cy="265" rx="6" ry="8" fill="#1e1b4b" />
    <circle cx="146" cy="262" r="2.5" fill="#ffffff" />
    <!-- Oval Snout -->
    <ellipse cx="135" cy="282" rx="14" ry="10" fill="#f43f5e" />
    <circle cx="130" cy="282" r="3" fill="#881337" />
    <circle cx="140" cy="282" r="3" fill="#881337" />
  </g>

  <!-- Kitten (Center Mid-Air Merging, Tier 2) -->
  <g filter="url(#dropShadow)">
    <circle cx="225" cy="210" r="32" fill="url(#kittenGrad)" stroke="#ea580c" stroke-width="3" />
    <polygon points="205,190 215,172 225,190" fill="#ea580c" />
    <polygon points="230,190 240,172 250,190" fill="#ea580c" />
    <ellipse cx="218" cy="208" rx="4" ry="6" fill="#1e1b4b" />
    <circle cx="216" cy="206" r="1.5" fill="#ffffff" />
    <ellipse cx="232" cy="208" rx="4" ry="6" fill="#1e1b4b" />
    <circle cx="230" cy="206" r="1.5" fill="#ffffff" />
    <!-- Whiskers -->
    <line x1="202" y1="210" x2="192" y2="208" stroke="#7c2d12" stroke-width="2" />
    <line x1="202" y1="214" x2="192" y2="216" stroke="#7c2d12" stroke-width="2" />
    <line x1="248" y1="210" x2="258" y2="208" stroke="#7c2d12" stroke-width="2" />
    <line x1="248" y1="214" x2="258" y2="216" stroke="#7c2d12" stroke-width="2" />
  </g>

  <!-- MERGE STARBURST EFFECT (Kitten Merging) -->
  <g filter="url(#softGlow)">
    <circle cx="225" cy="210" r="42" fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="10 6" opacity="0.85" />
    <!-- Sparkle Stars -->
    <path d="M 280 180 L 284 192 L 296 196 L 284 200 L 280 212 L 276 200 L 264 196 L 276 192 Z" fill="#fde047" />
    <path d="M 180 185 L 183 193 L 191 196 L 183 199 L 180 207 L 177 199 L 169 196 L 177 193 Z" fill="#fde047" />
  </g>

  <!-- AIMING DROPPER MECHANIC AT TOP -->
  <!-- Aiming Dotted Line -->
  <line x1="310" y1="65" x2="310" y2="240" stroke="#facc15" stroke-width="3" stroke-dasharray="6 6" opacity="0.9" />

  <!-- Aiming Chick (Tier 0) ready to drop -->
  <g filter="url(#softGlow)">
    <circle cx="310" cy="55" r="22" fill="url(#chickGrad)" stroke="#ca8a04" stroke-width="3" />
    <polygon points="310,33 306,23 314,25" fill="#ca8a04" />
    <!-- Beak -->
    <polygon points="314,56 324,59 314,64" fill="#f97316" />
    <!-- Eye -->
    <ellipse cx="304" cy="52" rx="3.5" ry="5" fill="#0f172a" />
    <circle cx="303" cy="50" r="1.5" fill="#ffffff" />
    <!-- Wing -->
    <ellipse cx="296" cy="58" rx="7" ry="5" fill="#fde047" />
  </g>

  <!-- Floating Score & Combo Badge -->
  <g filter="url(#dropShadow)" transform="translate(320, 95)">
    <rect x="0" y="0" width="120" height="38" rx="19" fill="#0f172a" stroke="#facc15" stroke-width="2.5" />
    <text x="60" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#fef08a">
      MERGE! +128
    </text>
  </g>
</svg>
