<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="20%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>
    <linearGradient id="tractorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="400" height="300" fill="url(#skyGrad)" />

  <!-- Sun -->
  <circle cx="340" cy="60" r="36" fill="#facc15" opacity="0.85" filter="url(#dropShadow)" />

  <!-- Distant Hills -->
  <path d="M-20 220 Q60 160 160 210 T340 190 T420 230 L420 300 L-20 300 Z" fill="#86efac" opacity="0.7" />

  <!-- Wooden Ramp -->
  <polygon points="40,260 160,180 160,260 40,260" fill="#b45309" />
  <line x1="40" y1="260" x2="160" y2="180" stroke="#78350f" stroke-width="8" stroke-linecap="round" />
  <line x1="70" y1="260" x2="70" y2="240" stroke="#78350f" stroke-width="4" />
  <line x1="110" y1="260" x2="110" y2="215" stroke="#78350f" stroke-width="4" />

  <!-- Ground Slope -->
  <path d="M0 260 L400 260 L400 300 L0 300 Z" fill="url(#grassGrad)" />
  <path d="M0 260 L400 260" stroke="#4ade80" stroke-width="6" />

  <!-- Water Splash Pit -->
  <rect x="220" y="260" width="120" height="40" fill="#38bdf8" />
  <!-- Splash drops -->
  <circle cx="210" cy="245" r="4" fill="#60a5fa" />
  <circle cx="230" cy="235" r="5" fill="#93c5fd" />
  <circle cx="250" cy="248" r="3" fill="#60a5fa" />
  <circle cx="330" cy="240" r="5" fill="#93c5fd" />

  <!-- Airborne Tractor (Mid-Stunt Leap) -->
  <g transform="translate(240, 130) rotate(-22)" filter="url(#dropShadow)">
    <!-- Speed Lines -->
    <line x1="-80" y1="-10" x2="-40" y2="-10" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <line x1="-90" y1="10" x2="-50" y2="10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Exhaust Smoke -->
    <circle cx="-35" cy="-35" r="6" fill="#f1f5f9" opacity="0.7" />
    <circle cx="-48" cy="-44" r="9" fill="#e2e8f0" opacity="0.6" />
    <circle cx="-62" cy="-55" r="12" fill="#cbd5e1" opacity="0.5" />

    <!-- Tractor Body -->
    <rect x="-30" y="-18" width="65" height="26" rx="8" fill="url(#tractorGrad)" />
    <!-- Engine Hood -->
    <rect x="15" y="-14" width="22" height="20" rx="4" fill="#991b1b" />
    <rect x="33" y="-8" width="5" height="10" fill="#facc15" />
    
    <!-- Exhaust Stack -->
    <rect x="-20" y="-34" width="5" height="18" fill="#475569" />
    <rect x="-20" y="-36" width="9" height="3" fill="#334155" />

    <!-- Driver (Farmer Pig) -->
    <circle cx="-6" cy="-28" r="13" fill="#f472b6" />
    <!-- Straw Hat -->
    <rect x="-18" y="-38" width="24" height="5" rx="2" fill="#fde047" />
    <rect x="-13" y="-46" width="14" height="9" rx="3" fill="#eab308" />
    <!-- Pig Snout -->
    <ellipse cx="2" cy="-26" rx="5" ry="4" fill="#fb7185" />
    <circle cx="1" cy="-26" r="1" fill="#881337" />
    <circle cx="4" cy="-26" r="1" fill="#881337" />
    <!-- Excited Eye -->
    <circle cx="-2" cy="-32" r="3" fill="#ffffff" />
    <circle cx="-1" cy="-32" r="1.8" fill="#0f172a" />
    <!-- Overalls -->
    <rect x="-14" y="-16" width="18" height="14" rx="3" fill="#2563eb" />

    <!-- Rear Big Wheel -->
    <g transform="translate(-20, 16)">
      <circle cx="0" cy="0" r="24" fill="#18181b" />
      <circle cx="0" cy="0" r="14" fill="#27272a" />
      <circle cx="0" cy="0" r="8" fill="#facc15" />
      <!-- Wheel Treads -->
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#facc15" stroke-width="3" />
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#facc15" stroke-width="3" />
    </g>

    <!-- Front Guide Wheel -->
    <g transform="translate(28, 16)">
      <circle cx="0" cy="0" r="16" fill="#18181b" />
      <circle cx="0" cy="0" r="9" fill="#27272a" />
      <circle cx="0" cy="0" r="6" fill="#facc15" />
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#facc15" stroke-width="2" />
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#facc15" stroke-width="2" />
    </g>
  </g>

  <!-- Title Badge Overlay -->
  <g transform="translate(200, 42)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#0f172a" opacity="0.92" filter="url(#dropShadow)" />
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#facc15" letter-spacing="1">
      TRACTOR STUNT TRIALS
    </text>
  </g>
</svg>
