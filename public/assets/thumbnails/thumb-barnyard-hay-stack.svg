<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#stackBg)" />
  <!-- Isometric Hay/Wood Blocks -->
  <polygon points="300,160 380,200 300,240 220,200" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
  <polygon points="300,200 380,240 300,280 220,240" fill="#10b981" stroke="#059669" stroke-width="2" />
  <polygon points="300,240 380,280 300,320 220,280" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
  <polygon points="300,280 380,320 300,360 220,320" fill="#f43f5e" stroke="#e11d48" stroke-width="2" />
  <text x="300" y="80" fill="#fef08a" font-family="sans-serif" font-size="26" font-weight="900" text-anchor="middle">BARNYARD HAY STACK</text>
</svg>
