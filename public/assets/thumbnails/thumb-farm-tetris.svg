<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Block Gradients -->
    <linearGradient id="blockOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="blockYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/><stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="blockGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="blockCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="blockPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="blockRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="36" fill="url(#bgNight)"/>

  <!-- Matrix Playing Field Container -->
  <rect x="76" y="46" width="360" height="420" rx="18" fill="url(#gridGrad)" stroke="#6366f1" stroke-width="4" stroke-opacity="0.4" filter="url(#shadow)"/>

  <!-- Background Grid Lines -->
  <g stroke="#334155" stroke-width="1.5" stroke-opacity="0.5">
    <line x1="136" y1="46" x2="136" y2="466"/>
    <line x1="196" y1="46" x2="196" y2="466"/>
    <line x1="256" y1="46" x2="256" y2="466"/>
    <line x1="316" y1="46" x2="316" y2="466"/>
    <line x1="376" y1="46" x2="376" y2="466"/>

    <line x1="76" y1="106" x2="436" y2="106"/>
    <line x1="76" y1="166" x2="436" y2="166"/>
    <line x1="76" y1="226" x2="436" y2="226"/>
    <line x1="76" y1="286" x2="436" y2="286"/>
    <line x1="76" y1="346" x2="436" y2="346"/>
    <line x1="76" y1="406" x2="436" y2="406"/>
  </g>

  <!-- Placed Bottom Blocks -->
  <!-- Row 1 Bottom: Orange L-piece base -->
  <g filter="url(#shadow)">
    <!-- Cyan Line base pieces -->
    <rect x="80" y="410" width="52" height="52" rx="8" fill="url(#blockCyan)" stroke="#bae6fd" stroke-width="2"/>
    <rect x="140" y="410" width="52" height="52" rx="8" fill="url(#blockCyan)" stroke="#bae6fd" stroke-width="2"/>
    <rect x="200" y="410" width="52" height="52" rx="8" fill="url(#blockYellow)" stroke="#fef08a" stroke-width="2"/>
    <rect x="260" y="410" width="52" height="52" rx="8" fill="url(#blockYellow)" stroke="#fef08a" stroke-width="2"/>
    <rect x="320" y="410" width="52" height="52" rx="8" fill="url(#blockGreen)" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="380" y="410" width="52" height="52" rx="8" fill="url(#blockGreen)" stroke="#bbf7d0" stroke-width="2"/>

    <!-- Row 2 -->
    <rect x="80" y="350" width="52" height="52" rx="8" fill="url(#blockRed)" stroke="#fecaca" stroke-width="2"/>
    <rect x="200" y="350" width="52" height="52" rx="8" fill="url(#blockYellow)" stroke="#fef08a" stroke-width="2"/>
    <rect x="260" y="350" width="52" height="52" rx="8" fill="url(#blockYellow)" stroke="#fef08a" stroke-width="2"/>
    <rect x="380" y="350" width="52" height="52" rx="8" fill="url(#blockGreen)" stroke="#bbf7d0" stroke-width="2"/>

    <!-- Row 3 -->
    <rect x="80" y="290" width="52" height="52" rx="8" fill="url(#blockRed)" stroke="#fecaca" stroke-width="2"/>
    <rect x="140" y="290" width="52" height="52" rx="8" fill="url(#blockRed)" stroke="#fecaca" stroke-width="2"/>
    <rect x="320" y="290" width="52" height="52" rx="8" fill="url(#blockPurple)" stroke="#f3e8ff" stroke-width="2"/>

    <!-- Falling T-piece in the center -->
    <g transform="translate(0, 10)">
      <rect x="200" y="110" width="52" height="52" rx="8" fill="url(#blockPurple)" stroke="#f3e8ff" stroke-width="3"/>
      <rect x="140" y="170" width="52" height="52" rx="8" fill="url(#blockPurple)" stroke="#f3e8ff" stroke-width="3"/>
      <rect x="200" y="170" width="52" height="52" rx="8" fill="url(#blockPurple)" stroke="#f3e8ff" stroke-width="3"/>
      <rect x="260" y="170" width="52" height="52" rx="8" fill="url(#blockPurple)" stroke="#f3e8ff" stroke-width="3"/>
    </g>

    <!-- Sparkles and stars -->
    <circle cx="166" cy="196" r="4" fill="#ffffff"/>
    <circle cx="226" cy="136" r="4" fill="#ffffff"/>
    <circle cx="286" cy="196" r="4" fill="#ffffff"/>
  </g>

  <!-- Title Badge -->
  <g filter="url(#shadow)">
    <rect x="140" y="14" width="232" height="46" rx="14" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
    <text x="256" y="45" font-family="'Fredoka', Nunito, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">FARM TETRIS</text>
  </g>
</svg>