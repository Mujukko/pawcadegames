<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sky & Pasture Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>

    <!-- Orchard Hill Gradient -->
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Watermelon Outer Rind Gradient -->
    <linearGradient id="rindGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Watermelon Flesh Gradient -->
    <linearGradient id="fleshGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Glowing Blade Trail Gradient -->
    <linearGradient id="bladeTrailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Apple Gradient -->
    <radialGradient id="appleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="60%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <!-- Golden Pineapple Gradient -->
    <linearGradient id="goldPineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="512" height="512" rx="64" fill="url(#skyGrad)" />

  <!-- Rolling Hills -->
  <path d="M-20 420 Q120 360 260 410 T532 390 L532 532 L-20 532 Z" fill="url(#hillGrad)" />
  <path d="M-20 460 Q180 430 340 470 T532 460 L532 532 L-20 532 Z" fill="#166534" />

  <!-- Sun Rays in Sky -->
  <circle cx="256" cy="180" r="140" fill="#fef08a" opacity="0.25" filter="url(#glow)" />

  <!-- Flying Apple (Upper Left) -->
  <g transform="translate(100, 140) rotate(-15)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="42" fill="url(#appleGrad)" />
    <!-- Apple Highlight -->
    <ellipse cx="-12" cy="-14" rx="14" ry="10" fill="#ffffff" opacity="0.4" transform="rotate(-20 -12 -14)" />
    <!-- Stem & Leaf -->
    <path d="M0 -42 C2 -56 12 -60 16 -62" stroke="#78350f" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M4 -50 Q18 -58 24 -46 Q16 -40 4 -50" fill="#22c55e" />
  </g>

  <!-- Flying Golden Pineapple / Corn (Upper Right) -->
  <g transform="translate(400, 160) rotate(20)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="36" ry="48" fill="url(#goldPineGrad)" />
    <!-- Texture Diamonds -->
    <path d="M-20 -20 L20 20 M-20 0 L20 40 M-20 -40 L20 0 M20 -20 L-20 20 M20 0 L-20 40 M20 -40 L-20 0" stroke="#ca8a04" stroke-width="3" opacity="0.5" />
    <!-- Crown Leaves -->
    <path d="M-15 -48 L0 -72 L15 -48 M-8 -48 L-18 -68 M8 -48 L18 -68" stroke="#15803d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="#22c55e" />
  </g>

  <!-- Giant Sliced Watermelon (Center Highlight) -->
  <!-- Top Half (Flying Up-Left) -->
  <g transform="translate(225, 255) rotate(-22)" filter="url(#dropShadow)">
    <path d="M-80 0 A80 80 0 0 1 80 0 Z" fill="url(#rindGrad)" />
    <path d="M-72 0 A72 72 0 0 1 72 0 Z" fill="#ecfdf5" />
    <path d="M-64 0 A64 64 0 0 1 64 0 Z" fill="url(#fleshGrad)" />
    <!-- Seeds -->
    <ellipse cx="-32" cy="-24" rx="3" ry="5" fill="#0f172a" transform="rotate(25 -32 -24)" />
    <ellipse cx="0" cy="-38" rx="3" ry="5" fill="#0f172a" />
    <ellipse cx="32" cy="-24" rx="3" ry="5" fill="#0f172a" transform="rotate(-25 32 -24)" />
  </g>

  <!-- Bottom Half (Flying Down-Right) -->
  <g transform="translate(285, 325) rotate(-18)" filter="url(#dropShadow)">
    <path d="M-80 0 A80 80 0 0 0 80 0 Z" fill="url(#rindGrad)" />
    <path d="M-72 0 A72 72 0 0 0 72 0 Z" fill="#ecfdf5" />
    <path d="M-64 0 A64 64 0 0 0 64 0 Z" fill="url(#fleshGrad)" />
    <!-- Seeds -->
    <ellipse cx="-28" cy="24" rx="3" ry="5" fill="#0f172a" transform="rotate(-25 -28 24)" />
    <ellipse cx="6" cy="36" rx="3" ry="5" fill="#0f172a" />
    <ellipse cx="36" cy="22" rx="3" ry="5" fill="#0f172a" transform="rotate(25 36 22)" />
  </g>

  <!-- Dynamic Blade Slash Trail (Cyan Laser Beam Cutting Across Center) -->
  <path d="M60 410 Q240 280 460 170" stroke="url(#bladeTrailGrad)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#glow)" />
  <path d="M60 410 Q240 280 460 170" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Blade Sparkles & Juice Splashes -->
  <circle cx="255" cy="285" r="8" fill="#ffffff" filter="url(#glow)" />
  <polygon points="255,270 259,282 271,285 259,288 255,300 251,288 239,285 251,282" fill="#fef08a" />
  <polygon points="340,230 343,238 351,240 343,242 340,250 337,242 329,240 337,238" fill="#ffffff" />
  <polygon points="170,340 173,346 179,348 173,350 170,356 167,350 161,348 167,346" fill="#38bdf8" />

  <!-- Red Juice Droplets -->
  <circle cx="210" cy="260" r="6" fill="#f43f5e" />
  <circle cx="230" cy="330" r="8" fill="#f43f5e" />
  <circle cx="310" cy="270" r="7" fill="#f43f5e" />
  <circle cx="280" cy="360" r="5" fill="#f43f5e" />
  <circle cx="150" cy="310" r="4" fill="#f43f5e" />
  <circle cx="370" cy="240" r="5" fill="#f43f5e" />

  <!-- Barnaby Puppy Head & Wooden Bokken (Bottom Left Mascot) -->
  <g transform="translate(90, 440)" filter="url(#dropShadow)">
    <!-- Golden Fur Ears -->
    <ellipse cx="-35" cy="-20" rx="14" ry="24" fill="#f59e0b" transform="rotate(-25 -35 -20)" />
    <ellipse cx="35" cy="-20" rx="14" ry="24" fill="#f59e0b" transform="rotate(25 35 -20)" />
    <!-- Head Base -->
    <circle cx="0" cy="0" r="42" fill="#fbbf24" />
    <ellipse cx="0" cy="12" rx="26" ry="18" fill="#fef3c7" />
    <!-- Big Happy Eyes -->
    <ellipse cx="-14" cy="-6" rx="7" ry="9" fill="#0f172a" />
    <circle cx="-16" cy="-9" r="3" fill="#ffffff" />
    <ellipse cx="14" cy="-6" rx="7" ry="9" fill="#0f172a" />
    <circle cx="12" cy="-9" r="3" fill="#ffffff" />
    <!-- Cute Button Nose -->
    <ellipse cx="0" cy="6" rx="6" ry="4" fill="#0f172a" />
    <!-- Wide Grin & Tongue -->
    <path d="M-10 14 Q0 24 10 14" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M-5 18 Q0 26 5 18 Z" fill="#f43f5e" />
    <!-- Red Headband with Gold Star -->
    <path d="M-38 -14 Q0 -28 38 -14" stroke="#ef4444" stroke-width="10" stroke-linecap="round" fill="none" />
    <polygon points="0,-24 2,-18 8,-18 3,-14 5,-8 0,-12 -5,-8 -3,-14 -8,-18 -2,-18" fill="#fde047" />
  </g>

  <!-- Wooden Slicer Bokken / Katana in Paw -->
  <g transform="translate(130, 420) rotate(-40)" filter="url(#dropShadow)">
    <!-- Wooden Blade -->
    <rect x="0" y="-120" width="10" height="120" rx="4" fill="#d97706" />
    <!-- Blade Edge Glow -->
    <line x1="2" y1="-118" x2="2" y2="0" stroke="#fef3c7" stroke-width="2" />
    <!-- Tsuba / Guard -->
    <ellipse cx="5" cy="0" rx="12" ry="4" fill="#78350f" />
    <!-- Grip Hilt -->
    <rect x="1" y="4" width="8" height="32" rx="3" fill="#451a03" />
    <circle cx="5" cy="38" r="5" fill="#d97706" />
  </g>

  <!-- Floating 'COMBO x3' Badge (Top Center) -->
  <g transform="translate(256, 75)" filter="url(#dropShadow)">
    <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#0f172a" stroke="#facc15" stroke-width="3" />
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#fde047" text-anchor="middle" letter-spacing="1">COMBO x3! 🍉</text>
  </g>
</svg>
