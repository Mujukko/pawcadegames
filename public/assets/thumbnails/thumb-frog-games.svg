<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Pond Water Background -->
  <rect width="800" height="600" fill="url(#waterGrad)"/>

  <!-- Water Ripple Rings -->
  <ellipse cx="220" cy="420" rx="90" ry="25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <ellipse cx="580" cy="340" rx="110" ry="30" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>

  <!-- Floating Lily Pads -->
  <!-- Left Pad -->
  <g transform="translate(220, 420)" filter="url(#shadow)">
    <path d="M 0,-50 A 65,65 0 1,1 -30,58 L 0,0 Z" fill="url(#padGrad)" stroke="#15803d" stroke-width="4"/>
  </g>

  <!-- Right Pad with Lotus Flower -->
  <g transform="translate(580, 340)" filter="url(#shadow)">
    <path d="M 0,-60 A 75,75 0 1,1 40,65 L 0,0 Z" fill="url(#padGrad)" stroke="#15803d" stroke-width="4"/>
    <!-- Pink Lotus -->
    <circle cx="20" cy="-20" r="14" fill="#f43f5e"/>
    <circle cx="5" cy="-25" r="12" fill="#fb7185"/>
    <circle cx="35" cy="-25" r="12" fill="#fb7185"/>
    <circle cx="20" cy="-20" r="6" fill="#fde047"/>
  </g>

  <!-- Jumping Frog in Mid-Air -->
  <g transform="translate(380, 290)" filter="url(#shadow)">
    <!-- Shadow beneath on water -->
    <ellipse cx="0" cy="110" rx="45" ry="16" fill="rgba(2, 44, 34, 0.4)"/>

    <!-- Hind Extended Legs -->
    <path d="M-25,25 L-65,70 L-95,65" stroke="#16a34a" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M25,25 L65,70 L95,65" stroke="#16a34a" stroke-width="16" stroke-linecap="round" fill="none"/>

    <!-- Webbed Feet -->
    <polygon points="-95,65 -115,55 -110,75" fill="#15803d"/>
    <polygon points="95,65 115,55 110,75" fill="#15803d"/>

    <!-- Main Green Body -->
    <ellipse cx="0" cy="0" rx="46" ry="54" fill="#22c55e"/>
    <ellipse cx="0" cy="10" rx="28" ry="34" fill="#bef264"/>

    <!-- Forelegs reaching out -->
    <path d="M-30,-20 L-60,-50 L-80,-45" stroke="#16a34a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M30,-20 L60,-50 L80,-45" stroke="#16a34a" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Big Bulbous Eyes -->
    <circle cx="-26" cy="-42" r="20" fill="#22c55e"/>
    <circle cx="-26" cy="-42" r="13" fill="#0f172a"/>
    <circle cx="-30" cy="-46" r="5" fill="#ffffff"/>

    <circle cx="26" cy="-42" r="20" fill="#22c55e"/>
    <circle cx="26" cy="-42" r="13" fill="#0f172a"/>
    <circle cx="22" cy="-46" r="5" fill="#ffffff"/>

    <!-- Long Sticky Pink Tongue shooting up-right -->
    <path d="M 0,-15 Q 80,-80 180,-110" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="180" cy="-110" r="14" fill="#fb7185"/>
  </g>

  <!-- Glowing Dragonfly being caught! -->
  <g transform="translate(580, 160)" filter="url(#shadow)">
    <!-- Wings -->
    <ellipse cx="-16" cy="-8" rx="26" ry="8" fill="rgba(255,255,255,0.85)" transform="rotate(-25)"/>
    <ellipse cx="16" cy="-8" rx="26" ry="8" fill="rgba(255,255,255,0.85)" transform="rotate(25)"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="8" ry="24" fill="#06b6d4" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="0" cy="-22" r="7" fill="#0284c7"/>
  </g>

  <!-- Title Banner -->
  <g transform="translate(400, 85)" filter="url(#shadow)">
    <rect x="-310" y="-50" width="620" height="90" rx="24" fill="#0f172a" stroke="#22c55e" stroke-width="4"/>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#86efac" text-anchor="middle" letter-spacing="1">
      BARNYARD POND HOP
    </text>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#fde047" text-anchor="middle" letter-spacing="2">
      FROG GAMES ONLINE 🐸🪷
    </text>
  </g>
</svg>
