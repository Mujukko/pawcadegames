<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Garden Soil & Sky -->
    <linearGradient id="gardenSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#bae6fd"/>
      <stop offset="48%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#291203"/>
    </linearGradient>

    <!-- Golden Crown Sparkle -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Gopher Fur -->
    <linearGradient id="gopherFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Carrot Orange -->
    <linearGradient id="carrotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Mallet Wood -->
    <linearGradient id="malletWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#gardenSky)"/>

  <!-- Rustic Garden Fence in background -->
  <g fill="#a16207" stroke="#451a03" stroke-width="3">
    <rect x="40" y="140" width="22" height="120" rx="4"/>
    <rect x="110" y="140" width="22" height="120" rx="4"/>
    <rect x="180" y="140" width="22" height="120" rx="4"/>
    <rect x="250" y="140" width="22" height="120" rx="4"/>
    <rect x="320" y="140" width="22" height="120" rx="4"/>
    <rect x="390" y="140" width="22" height="120" rx="4"/>
    <rect x="460" y="140" width="22" height="120" rx="4"/>
    <!-- Cross rails -->
    <rect x="20" y="165" width="480" height="16" rx="3"/>
    <rect x="20" y="215" width="480" height="16" rx="3"/>
  </g>

  <!-- Left & Right Soil Mounds in background -->
  <ellipse cx="110" cy="310" rx="70" ry="35" fill="#451a03" stroke="#291203" stroke-width="4"/>
  <ellipse cx="400" cy="310" rx="70" ry="35" fill="#451a03" stroke="#291203" stroke-width="4"/>

  <!-- Center Big Soil Mound (Hero Mound) -->
  <ellipse cx="256" cy="410" rx="140" ry="60" fill="#451a03" stroke="#1c0d02" stroke-width="6"/>

  <!-- Giant Golden King Gopher Popping Out -->
  <g transform="translate(256, 310)">
    <!-- Gopher Body -->
    <ellipse cx="0" cy="0" rx="80" ry="95" fill="url(#gopherFur)" stroke="#451a03" stroke-width="5"/>

    <!-- Shiny Golden Crown on King Gopher -->
    <polygon points="-40,-95 -25,-65 0,-105 25,-65 40,-95 32,-55 -32,-55" fill="url(#crownGrad)" stroke="#b45309" stroke-width="3"/>
    <circle cx="-40" cy="-95" r="4" fill="#ef4444"/>
    <circle cx="0" cy="-105" r="5" fill="#3b82f6"/>
    <circle cx="40" cy="-95" r="4" fill="#ef4444"/>

    <!-- Gopher Ears -->
    <circle cx="-65" cy="-55" r="18" fill="#92400e" stroke="#451a03" stroke-width="4"/>
    <circle cx="-65" cy="-55" r="10" fill="#fbcfe8"/>
    <circle cx="65" cy="-55" r="18" fill="#92400e" stroke="#451a03" stroke-width="4"/>
    <circle cx="65" cy="-55" r="10" fill="#fbcfe8"/>

    <!-- Cute Big Round Eyes -->
    <circle cx="-28" cy="-25" r="16" fill="#0f172a"/>
    <circle cx="28" cy="-25" r="16" fill="#0f172a"/>
    <circle cx="-32" cy="-30" r="6" fill="#ffffff"/>
    <circle cx="24" cy="-30" r="6" fill="#ffffff"/>

    <!-- Snout & Buck Teeth -->
    <ellipse cx="0" cy="8" rx="34" ry="24" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
    <!-- Nose -->
    <ellipse cx="0" cy="-2" rx="12" ry="8" fill="#451a03"/>
    <!-- Buck Teeth -->
    <rect x="-8" y="12" width="7" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="1" y="12" width="7" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Crunchy Prize Carrot in Gopher's Paws -->
    <g transform="translate(0, 48) rotate(-15)">
      <!-- Carrot Body -->
      <polygon points="-12,0 12,0 0,60" fill="url(#carrotGrad)" stroke="#9a3412" stroke-width="3"/>
      <!-- Carrot Tops (Green leaves) -->
      <path d="M -8 0 Q -18 -20 -8 -25 Q -2 -15 0 0" fill="#22c55e"/>
      <path d="M 0 0 Q 0 -30 8 -30 Q 10 -15 0 0" fill="#16a34a"/>
    </g>

    <!-- Gopher Paws holding carrot -->
    <ellipse cx="-32" cy="46" rx="14" ry="12" fill="#d97706" stroke="#78350f" stroke-width="3"/>
    <ellipse cx="32" cy="46" rx="14" ry="12" fill="#d97706" stroke="#78350f" stroke-width="3"/>
  </g>

  <!-- Big Toy Whack Mallet Coming Down from Right -->
  <g transform="translate(385, 140) rotate(-35)">
    <!-- Wooden Mallet Handle -->
    <rect x="-10" y="30" width="20" height="150" rx="8" fill="url(#woodGrad)" stroke="#451a03" stroke-width="3"/>
    <!-- Mallet Head -->
    <rect x="-45" y="-30" width="90" height="65" rx="14" fill="url(#malletWood)" stroke="#451a03" stroke-width="5"/>
    <!-- Rubber impact pads -->
    <rect x="-52" y="-22" width="10" height="48" rx="4" fill="#ef4444"/>
    <rect x="42" y="-22" width="10" height="48" rx="4" fill="#ef4444"/>
  </g>

  <!-- Impact Sparkle Stars -->
  <g fill="#fde047">
    <polygon points="210,180 216,192 228,194 219,203 222,216 210,208 198,216 201,203 192,194 204,192"/>
    <polygon points="340,195 344,203 353,205 346,211 348,220 340,215 332,220 334,211 327,205 336,203"/>
    <polygon points="170,250 173,257 180,259 175,264 176,271 170,267 164,271 165,264 160,259 167,257"/>
  </g>

  <!-- Golden Corn & Pumpkin in dirt border -->
  <g transform="translate(70, 430)">
    <circle cx="0" cy="0" r="22" fill="#f97316" stroke="#9a3412" stroke-width="3"/>
    <path d="M -4 -22 L 0 -28 L 4 -22" fill="#15803d"/>
  </g>
  <g transform="translate(440, 430)">
    <ellipse cx="0" cy="0" rx="14" ry="24" fill="#eab308" stroke="#a16207" stroke-width="3"/>
    <path d="M 0 -24 L 0 -30" stroke="#15803d" stroke-width="4"/>
  </g>
</svg>
