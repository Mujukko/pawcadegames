<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background & Grass Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="fairwayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="greenFringe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Corgi Gradients -->
    <linearGradient id="corgiFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="corgiWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Shadows & Glow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="512" height="512" rx="36" fill="url(#skyGrad)" />

  <!-- Sun & Clouds -->
  <circle cx="430" cy="80" r="130" fill="#fde047" opacity="0.3" />
  <circle cx="430" cy="80" r="80" fill="#fef08a" opacity="0.6" />
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="120" cy="85" rx="42" ry="20" />
    <ellipse cx="150" cy="75" rx="28" ry="22" />
    <ellipse cx="95" cy="90" rx="22" ry="16" />
  </g>

  <!-- Rolling Golf Fairway -->
  <path d="M-20 340 Q 120 280, 290 320 T 530 290 L 530 530 L -20 530 Z" fill="url(#fairwayGrad)" />
  <ellipse cx="360" cy="380" rx="140" ry="80" fill="url(#greenFringe)" />

  <!-- Sand Trap Bunker -->
  <path d="M 280 430 C 260 410, 310 390, 350 405 C 390 420, 370 460, 320 465 C 290 470, 270 445, 280 430 Z" fill="url(#sandGrad)" stroke="#ca8a04" stroke-width="4" />

  <!-- Wooden Border Rails -->
  <g stroke="url(#woodGrad)" stroke-width="12" stroke-linecap="round" opacity="0.75">
    <line x1="30" y1="410" x2="160" y2="440" />
    <line x1="160" y1="440" x2="220" y2="520" />
  </g>

  <!-- Golf Cup & Red Flag Pin -->
  <g transform="translate(410, 350)" filter="url(#softShadow)">
    <!-- Putting Cup (Hole) -->
    <ellipse cx="0" cy="10" rx="24" ry="12" fill="#0f172a" />
    <ellipse cx="0" cy="8" rx="20" ry="9" fill="#1e293b" />

    <!-- Flagstick -->
    <line x1="0" y1="10" x2="0" y2="-120" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round" />
    <!-- Golden Finial Ball -->
    <circle cx="0" cy="-122" r="5" fill="#facc15" />

    <!-- Triangular Red Flag -->
    <polygon points="0,-120 45,-100 0,-80" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />
    <!-- Flag Number 1 -->
    <circle cx="15" cy="-100" r="10" fill="#ffffff" />
    <text x="15" y="-96" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#ef4444" text-anchor="middle">1</text>
  </g>

  <!-- Sunny the Corgi Golfer (Left & Center) -->
  <g transform="translate(185, 340)" filter="url(#softShadow)">
    <!-- Back Paw -->
    <ellipse cx="-45" cy="55" rx="14" ry="10" fill="url(#corgiWhite)" />
    <!-- Front Paw leaning on Putter -->
    <ellipse cx="38" cy="50" rx="13" ry="9" fill="url(#corgiWhite)" />

    <!-- Body -->
    <ellipse cx="-20" cy="20" rx="58" ry="46" fill="url(#corgiFur)" />
    <ellipse cx="10" cy="24" rx="34" ry="32" fill="url(#corgiWhite)" />

    <!-- Red Checkered Bandana -->
    <polygon points="-8,-4 26,0 12,24" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />

    <!-- Head -->
    <circle cx="18" cy="-35" r="44" fill="url(#corgiFur)" />

    <!-- Big Pointy Corgi Ears -->
    <polygon points="-22,-50 -48,-115 -2,-80" fill="url(#corgiFur)" />
    <polygon points="-20,-55 -40,-105 -8,-80" fill="#fbcfe8" />
    <polygon points="26,-50 56,-115 44,-75" fill="url(#corgiFur)" />
    <polygon points="28,-55 50,-105 40,-75" fill="#fbcfe8" />

    <!-- White Snout Stripe -->
    <path d="M 12 -55 Q 18 -20, 24 -55 Z" fill="url(#corgiWhite)" />
    <!-- White Muzzle -->
    <ellipse cx="26" cy="-22" rx="22" ry="16" fill="url(#corgiWhite)" />

    <!-- Black Button Nose -->
    <ellipse cx="32" cy="-28" rx="7" ry="5" fill="#0f172a" />

    <!-- Joyful Wide Smile & Pink Tongue -->
    <path d="M 24 -22 Q 32 -14, 40 -22" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <ellipse cx="32" cy="-14" rx="6" ry="7" fill="#f43f5e" />

    <!-- Sparkling Big Brown Eyes -->
    <circle cx="14" cy="-42" r="7" fill="#451a03" />
    <circle cx="16" cy="-44" r="2.5" fill="#ffffff" />
    <circle cx="36" cy="-40" r="7" fill="#451a03" />
    <circle cx="38" cy="-42" r="2.5" fill="#ffffff" />

    <!-- Rosy Cheek -->
    <circle cx="6" cy="-28" r="8" fill="#f43f5e" opacity="0.35" />

    <!-- Green Golf Visor -->
    <path d="M -15 -52 Q 22 -62, 52 -44 L 62 -42 Q 22 -50, -18 -48 Z" fill="url(#visorGrad)" stroke="#065f46" stroke-width="2" />

    <!-- Wooden Putter Club in Paw -->
    <g transform="translate(42, 10)">
      <!-- Shaft -->
      <line x1="0" y1="-20" x2="20" y2="70" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" />
      <!-- Putter Head -->
      <path d="M 14 70 L 32 68 L 30 78 L 10 78 Z" fill="url(#woodGrad)" stroke="#78350f" stroke-width="2" />
    </g>
  </g>

  <!-- Golf Ball with Paw Print Emblem (Foreground Right) -->
  <g transform="translate(295, 410)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <!-- Dimples texture -->
    <circle cx="-8" cy="-8" r="2.5" fill="#e2e8f0" />
    <circle cx="8" cy="-8" r="2.5" fill="#e2e8f0" />
    <circle cx="-10" cy="6" r="2" fill="#e2e8f0" />
    <circle cx="10" cy="6" r="2" fill="#e2e8f0" />
    <!-- Golden Paw Print on Ball -->
    <g fill="#f59e0b" transform="translate(0, 0)">
      <ellipse cx="0" cy="3" rx="5" ry="4" />
      <circle cx="-4" cy="-4" r="2" />
      <circle cx="0" cy="-6" r="2" />
      <circle cx="4" cy="-4" r="2" />
    </g>
  </g>

  <!-- Floating Sparkles & Golden Bones -->
  <g transform="translate(140, 220)">
    <!-- Bone -->
    <path d="M -15 -4 C -18 -8, -24 -4, -20 0 C -24 4, -18 8, -15 4 L 15 4 C 18 8, 24 4, 20 0 C 24 -4, 18 -8, 15 -4 Z" fill="#fef08a" stroke="#eab308" stroke-width="2" filter="url(#glow)" />
  </g>
  <polygon points="320,250 323,258 331,261 323,264 320,272 317,264 309,261 317,258" fill="#fbbf24" filter="url(#glow)" />
  <polygon points="430,220 432,226 438,228 432,230 430,236 428,230 422,228 428,226" fill="#fbbf24" filter="url(#glow)" />
</svg>
