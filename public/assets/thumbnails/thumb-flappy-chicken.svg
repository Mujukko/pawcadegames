<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="fencePipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="36" fill="url(#skyFlap)"/>

  <!-- Fluffy White Clouds -->
  <g fill="url(#cloudGrad)" opacity="0.85">
    <circle cx="80" cy="120" r="34"/><circle cx="120" cy="110" r="44"/><circle cx="160" cy="120" r="34"/>
    <circle cx="380" cy="180" r="30"/><circle cx="420" cy="170" r="40"/><circle cx="450" cy="180" r="28"/>
  </g>

  <!-- Obstacle Pipes (Barnyard Wooden Picket Posts) -->
  <!-- Top Pipe -->
  <g filter="url(#shadow)">
    <rect x="340" y="0" width="76" height="150" fill="url(#fencePipe)" stroke="#451a03" stroke-width="4"/>
    <rect x="330" y="130" width="96" height="34" rx="6" fill="#78350f" stroke="#451a03" stroke-width="4"/>
  </g>

  <!-- Bottom Pipe -->
  <g filter="url(#shadow)">
    <rect x="340" y="320" width="76" height="192" fill="url(#fencePipe)" stroke="#451a03" stroke-width="4"/>
    <rect x="330" y="300" width="96" height="34" rx="6" fill="#78350f" stroke="#451a03" stroke-width="4"/>
  </g>

  <!-- Green Ground & Grass -->
  <rect x="0" y="440" width="512" height="72" fill="#15803d"/>
  <rect x="0" y="440" width="512" height="12" fill="#4ade80"/>

  <!-- Plump Flapping Chicken (Center Left, leaping up) -->
  <g filter="url(#shadow)" transform="rotate(-8 210 240)">
    <!-- Chicken Body -->
    <ellipse cx="210" cy="240" rx="54" ry="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>

    <!-- Wing (Flapping up/down) -->
    <ellipse cx="180" cy="245" rx="26" ry="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" transform="rotate(-20 180 245)"/>

    <!-- Red Comb on Head -->
    <g fill="#ef4444">
      <circle cx="215" cy="190" r="10"/>
      <circle cx="230" cy="186" r="12"/>
      <circle cx="245" cy="190" r="10"/>
    </g>

    <!-- Beak (Orange) -->
    <polygon points="264,232 296,242 264,252" fill="#f97316" stroke="#ea580c" stroke-width="2"/>

    <!-- Wattle (Red) under beak -->
    <ellipse cx="260" cy="260" rx="7" ry="10" fill="#ef4444"/>

    <!-- Big Anime Eye -->
    <circle cx="242" cy="226" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <circle cx="246" cy="226" r="7" fill="#0f172a"/>
    <circle cx="244" cy="223" r="3" fill="#ffffff"/>

    <!-- Cute Chicken Tail Feathers -->
    <polygon points="156,230 134,220 150,244" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="154,240 130,240 152,254" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Wind Gust Motion Lines -->
    <path d="M 130 260 Q 110 260 100 275" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 140 275 Q 120 280 115 295" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Top Title Badge -->
  <g filter="url(#shadow)">
    <rect x="120" y="14" width="272" height="48" rx="16" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
    <text x="256" y="46" font-family="'Fredoka', Nunito, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">FLAPPY CHICKEN</text>
  </g>
</svg>