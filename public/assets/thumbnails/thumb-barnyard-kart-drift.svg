<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sky & Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Pasture Grass Gradient -->
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Asphalt / Dirt Racetrack Gradient -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Tractor Red Gradient -->
    <linearGradient id="tractorRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Tractor Yellow Hood Stripe -->
    <linearGradient id="yellowStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Chrome / Exhaust Metal -->
    <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Tire Rubber -->
    <linearGradient id="tireRubber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Tire Rim Gold -->
    <linearGradient id="rimGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Corgi Fur -->
    <linearGradient id="corgiFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Speed Blur / Glow -->
    <filter id="speedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky & Far Farm Hills -->
  <rect width="512" height="512" fill="url(#skyGrad)"/>
  <ellipse cx="256" cy="180" rx="340" ry="90" fill="url(#grassGrad)"/>

  <!-- Distant Barn & Silo Silhouette -->
  <rect x="360" y="90" width="75" height="55" rx="4" fill="#b91c1c" opacity="0.85"/>
  <polygon points="350,90 397,60 445,90" fill="#7f1d1d" opacity="0.9"/>
  <rect x="445" y="70" width="30" height="75" rx="14" fill="#94a3b8" opacity="0.85"/>

  <!-- Curving Racetrack with Kerbs -->
  <path d="M-40,480 Q160,260 380,240 T540,160" fill="none" stroke="#ef4444" stroke-width="190" stroke-linecap="round"/>
  <path d="M-40,480 Q160,260 380,240 T540,160" fill="none" stroke="#f8fafc" stroke-width="170" stroke-dasharray="25,25" stroke-linecap="round"/>
  <path d="M-40,480 Q160,260 380,240 T540,160" fill="none" stroke="url(#trackGrad)" stroke-width="150" stroke-linecap="round"/>

  <!-- Skid Marks on Track -->
  <path d="M120,440 Q180,360 250,330" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" opacity="0.45"/>
  <path d="M150,470 Q210,390 280,350" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round" opacity="0.55"/>

  <!-- Drift Smoke & Spark Particles -->
  <circle cx="160" cy="440" r="26" fill="#f8fafc" opacity="0.5" filter="url(#speedGlow)"/>
  <circle cx="130" cy="460" r="34" fill="#cbd5e1" opacity="0.6"/>
  <circle cx="190" cy="420" r="18" fill="#f8fafc" opacity="0.7"/>
  <!-- Sparks -->
  <polygon points="175,410 185,405 180,418 192,414 182,425" fill="#facc15"/>
  <polygon points="140,450 148,446 144,456 154,453 146,462" fill="#fb923c"/>

  <!-- TRACTOR BODY (Angled In Drift) -->
  <g transform="translate(290, 310) rotate(-16)">
    <!-- Rear Big Tires (Left & Right) -->
    <!-- Far Rear Tire -->
    <rect x="-115" y="-105" width="46" height="85" rx="16" fill="url(#tireRubber)"/>
    <rect x="-105" y="-85" width="26" height="45" rx="8" fill="url(#rimGold)"/>

    <!-- Front Far Tire -->
    <rect x="75" y="-85" width="30" height="60" rx="12" fill="url(#tireRubber)"/>
    <rect x="82" y="-70" width="16" height="30" rx="6" fill="url(#rimGold)"/>

    <!-- Tractor Main Chassis Body -->
    <rect x="-90" y="-60" width="180" height="85" rx="14" fill="url(#tractorRed)" stroke="#7f1d1d" stroke-width="3"/>

    <!-- Yellow Hood Racing Stripe & Grille -->
    <rect x="0" y="-55" width="90" height="24" rx="6" fill="url(#yellowStripe)"/>
    <path d="M90,-50 L95,-20 L90,15 Z" fill="#0f172a"/>
    <line x1="88" y1="-40" x2="88" y2="5" stroke="#94a3b8" stroke-width="4"/>

    <!-- Glowing Chrome Headlight -->
    <ellipse cx="94" cy="-38" rx="8" ry="12" fill="#fef08a" filter="url(#speedGlow)"/>

    <!-- Tall Chrome Exhaust Stack with Fire Sparks -->
    <rect x="-10" y="-110" width="12" height="55" rx="5" fill="url(#chromeMetal)"/>
    <path d="M-10,-110 C-10,-125 15,-120 18,-110 Z" fill="url(#chromeMetal)"/>
    <!-- Exhaust Flame / Popcorn -->
    <polygon points="12,-125 22,-145 10,-138 2,-152 -4,-135" fill="#f97316" filter="url(#speedGlow)"/>
    <polygon points="8,-128 16,-140 9,-135 4,-144 0,-132" fill="#facc15"/>

    <!-- Wooden Steering Wheel -->
    <ellipse cx="-15" cy="-25" rx="10" ry="24" fill="#78350f" stroke="#451a03" stroke-width="3"/>

    <!-- DRIVER: SUNNY CORGI -->
    <g transform="translate(-35, -55)">
      <!-- Corgi Head -->
      <circle cx="0" cy="0" r="32" fill="url(#corgiFur)"/>
      <ellipse cx="-4" cy="8" rx="18" ry="12" fill="#fffbeb"/>

      <!-- Big Pointy Ears -->
      <polygon points="-22,-20 -38,-65 -8,-32" fill="url(#corgiFur)"/>
      <polygon points="-20,-24 -32,-56 -10,-32" fill="#f472b6"/>

      <polygon points="15,-22 36,-65 24,-24" fill="url(#corgiFur)"/>
      <polygon points="16,-24 30,-56 22,-26" fill="#f472b6"/>

      <!-- Aviator Goggles on Forehead -->
      <rect x="-26" y="-18" width="52" height="15" rx="6" fill="#1e293b"/>
      <ellipse cx="-12" cy="-10" rx="10" ry="7" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/>
      <ellipse cx="12" cy="-10" rx="10" ry="7" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/>

      <!-- Happy Eyes & Smile -->
      <circle cx="-10" cy="4" r="4.5" fill="#0f172a"/>
      <circle cx="10" cy="4" r="4.5" fill="#0f172a"/>
      <circle cx="-8" cy="2" r="1.5" fill="#f8fafc"/>
      <circle cx="12" cy="2" r="1.5" fill="#f8fafc"/>

      <!-- Nose & Grin -->
      <ellipse cx="0" cy="11" rx="4.5" ry="3.5" fill="#0f172a"/>
      <path d="M-6,15 Q0,22 6,15" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="0" cy="20" rx="4" ry="4" fill="#f43f5e"/>

      <!-- Red Checkered Racing Bandana -->
      <polygon points="-24,25 24,25 0,42" fill="#dc2626"/>
      <polygon points="-10,25 10,25 0,38" fill="#f8fafc"/>
    </g>

    <!-- Near Front Tire -->
    <rect x="70" y="10" width="34" height="70" rx="12" fill="url(#tireRubber)"/>
    <rect x="78" y="25" width="18" height="40" rx="6" fill="url(#rimGold)"/>

    <!-- Near Big Rear Tire with Big Mud Tread -->
    <rect x="-120" y="0" width="55" height="105" rx="20" fill="url(#tireRubber)"/>
    <rect x="-108" y="24" width="32" height="58" rx="12" fill="url(#rimGold)"/>
    <!-- Deep Tractor Tread Ridges -->
    <line x1="-120" y1="20" x2="-65" y2="35" stroke="#475569" stroke-width="4"/>
    <line x1="-120" y1="45" x2="-65" y2="60" stroke="#475569" stroke-width="4"/>
    <line x1="-120" y1="70" x2="-65" y2="85" stroke="#475569" stroke-width="4"/>
  </g>

  <!-- Flying Golden Corn Turbo Pickup Floating -->
  <g transform="translate(110, 150) rotate(15)" filter="url(#speedGlow)">
    <ellipse cx="0" cy="0" rx="22" ry="40" fill="#facc15" stroke="#eab308" stroke-width="3"/>
    <path d="M-14,-25 Q0,45 14,-25" fill="none" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="5,5"/>
    <!-- Green Corn Husk -->
    <path d="M-22,25 C-30,45 -10,55 0,38 C10,55 30,45 22,25 Z" fill="#22c55e"/>
    <circle cx="15" cy="-20" r="4" fill="#f8fafc"/>
  </g>

  <!-- Floating Star Sparkles -->
  <polygon points="420,180 424,192 436,196 424,200 420,212 416,200 404,196 416,192" fill="#facc15" filter="url(#speedGlow)"/>
  <polygon points="80,310 83,318 92,321 83,324 80,332 77,324 68,321 77,318" fill="#facc15"/>

  <!-- Checkered Finish Line Banner Arch in Corner -->
  <g transform="translate(430, 40) rotate(-15)">
    <rect x="0" y="0" width="70" height="24" fill="#0f172a"/>
    <rect x="0" y="0" width="14" height="12" fill="#f8fafc"/>
    <rect x="28" y="0" width="14" height="12" fill="#f8fafc"/>
    <rect x="56" y="0" width="14" height="12" fill="#f8fafc"/>
    <rect x="14" y="12" width="14" height="12" fill="#f8fafc"/>
    <rect x="42" y="12" width="14" height="12" fill="#f8fafc"/>
  </g>
</svg>
