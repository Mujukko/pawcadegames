<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d7c0f" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <radialGradient id="chickGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>

    <radialGradient id="doorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#facc15" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="400" fill="url(#bgGrad)" />

  <!-- Moon / Spotlight -->
  <circle cx="480" cy="100" r="60" fill="#fef08a" opacity="0.3" filter="url(#shadow)" />

  <!-- Background Pillars -->
  <rect x="80" y="80" width="24" height="260" fill="#475569" opacity="0.2" />
  <rect x="500" y="60" width="24" height="280" fill="#475569" opacity="0.2" />

  <!-- Solid Left Platform -->
  <rect x="40" y="270" width="180" height="130" rx="8" fill="url(#floorGrad)" stroke="#166534" stroke-width="4" filter="url(#shadow)" />
  <rect x="44" y="272" width="172" height="12" rx="4" fill="#84cc16" />

  <!-- Dropping Trap Platform (Tilted) -->
  <g transform="translate(240, 290) rotate(18)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="#854d0e" stroke="#713f12" stroke-width="3" filter="url(#shadow)" />
    <rect x="4" y="2" width="112" height="8" rx="2" fill="#ca8a04" />
    <text x="60" y="32" font-family="sans-serif" font-weight="900" font-size="14" fill="#fef08a" text-anchor="middle">TRAP!</text>
  </g>

  <!-- Danger Spike Pit -->
  <g transform="translate(240, 370)">
    <polygon points="0,30 15,0 30,30" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
    <polygon points="25,30 40,0 55,30" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
    <polygon points="50,30 65,0 80,30" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
    <polygon points="75,30 90,0 105,30" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
    <polygon points="100,30 115,0 130,30" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
  </g>

  <!-- Right Platform with Exit Door -->
  <rect x="390" y="270" width="180" height="130" rx="8" fill="url(#floorGrad)" stroke="#166534" stroke-width="4" filter="url(#shadow)" />
  <rect x="394" y="272" width="172" height="12" rx="4" fill="#84cc16" />

  <!-- Glowing Barn Exit Door -->
  <circle cx="480" cy="220" r="70" fill="url(#doorGlow)" />
  <rect x="450" y="180" width="60" height="90" rx="6" fill="#78350f" stroke="#451a03" stroke-width="4" filter="url(#shadow)" />
  <rect x="456" y="186" width="48" height="80" rx="4" fill="#b45309" />
  <circle cx="468" cy="226" r="5" fill="#facc15" stroke="#78350f" stroke-width="1.5" />
  <rect x="458" y="160" width="44" height="16" rx="4" fill="#22c55e" />
  <text x="480" y="172" font-family="sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">EXIT ➔</text>

  <!-- Chick Hero (Pip) In Mid-Air Panic -->
  <g transform="translate(190, 180) rotate(-15)" filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="30" ry="34" fill="url(#chickGrad)" stroke="#ca8a04" stroke-width="3" />
    <!-- Comb -->
    <circle cx="-5" cy="-35" r="9" fill="#ef4444" />
    <circle cx="5" cy="-36" r="8" fill="#ef4444" />
    <!-- Big Shocked Eye -->
    <circle cx="10" cy="-8" r="10" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    <circle cx="12" cy="-8" r="4" fill="#0f172a" />
    <circle cx="14" cy="-10" r="1.5" fill="#ffffff" />
    <!-- Open Screaming Beak -->
    <polygon points="24,-4 38,2 24,10" fill="#f97316" stroke="#c2410c" stroke-width="2" />
    <!-- Flapping Wings -->
    <ellipse cx="-20" cy="6" rx="14" ry="9" transform="rotate(-30, -20, 6)" fill="#eab308" stroke="#ca8a04" stroke-width="2" />
    <!-- Sweat Drop -->
    <path d="M 24 -24 Q 28 -32 24 -36 Q 20 -32 24 -24" fill="#38bdf8" />
  </g>

  <!-- Badge Banner -->
  <g transform="translate(300, 360)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)" />
    <text x="0" y="6" font-family="sans-serif" font-weight="900" font-size="17" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">
      LEVEL DEVIL 😈🚪
    </text>
  </g>
</svg>
