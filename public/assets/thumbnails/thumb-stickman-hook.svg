<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHook" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <radialGradient id="catHookGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </radialGradient>

    <filter id="hookGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.9" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#fbbf24" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgHook)" />

  <!-- Barn Rafters in Background -->
  <path d="M 50 0 L 250 160 M 250 0 L 50 160 M 350 0 L 550 160 M 550 0 L 350 160" stroke="#334155" stroke-width="8" opacity="0.4" />
  <rect x="0" y="40" width="600" height="12" fill="#1e293b" />

  <!-- Trampoline on Bottom -->
  <rect x="180" y="340" width="120" height="16" rx="6" fill="#f59e0b" filter="url(#goldGlow)" />
  <path d="M 195 356 L 190 380 M 285 356 L 290 380" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />

  <!-- Peg 1 (Anchor point) -->
  <circle cx="360" cy="90" r="28" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" opacity="0.8" />
  <circle cx="360" cy="90" r="16" fill="#0284c7" filter="url(#hookGlow)" />
  <circle cx="360" cy="90" r="7" fill="#ffffff" />

  <!-- Grapple Rope -->
  <line x1="360" y1="90" x2="240" y2="240" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" filter="url(#hookGlow)" />
  <line x1="360" y1="90" x2="240" y2="240" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Next Peg in distance -->
  <circle cx="510" cy="110" r="14" fill="#64748b" />
  <circle cx="510" cy="110" r="6" fill="#cbd5e1" />

  <!-- Fluffy Acrobat Cat (Swinging) -->
  <g transform="translate(240, 240) rotate(-25)">
    <!-- Motion lines -->
    <path d="M -50 -20 Q -30 0 -50 20" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M -65 -10 Q -45 10 -65 30" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" />

    <!-- Tail -->
    <path d="M -30 10 Q -50 30 -40 45" stroke="#ea580c" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- Body -->
    <circle cx="0" cy="0" r="38" fill="url(#catHookGrad)" />

    <!-- Ears -->
    <polygon points="-24,-24 -36,-50 -12,-34" fill="#c2410c" />
    <polygon points="-22,-26 -32,-44 -14,-32" fill="#fca5a5" />

    <polygon points="12,-34 36,-50 24,-24" fill="#c2410c" />
    <polygon points="14,-32 32,-44 22,-26" fill="#fca5a5" />

    <!-- Eyes -->
    <circle cx="-12" cy="-4" r="6" fill="#0f172a" />
    <circle cx="12" cy="-4" r="6" fill="#0f172a" />
    <circle cx="-14" cy="-6" r="2.5" fill="#ffffff" />
    <circle cx="10" cy="-6" r="2.5" fill="#ffffff" />

    <!-- Nose & Mouth -->
    <polygon points="0,4 -4,0 4,0" fill="#fca5a5" />
    <path d="M -6 8 Q 0 12 6 8" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Cute Whiskers -->
    <line x1="-20" y1="2" x2="-34" y2="-2" stroke="#ffffff" stroke-width="2" />
    <line x1="-20" y1="6" x2="-35" y2="8" stroke="#ffffff" stroke-width="2" />
    <line x1="20" y1="2" x2="34" y2="-2" stroke="#ffffff" stroke-width="2" />
    <line x1="20" y1="6" x2="35" y2="8" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Title Badge -->
  <rect x="25" y="325" width="230" height="50" rx="12" fill="#0f172a" opacity="0.85" stroke="#38bdf8" stroke-width="2" />
  <text x="140" y="348" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">STICKMAN HOOK</text>
  <text x="140" y="365" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">FLUFFY GRAPPLE SWING</text>
</svg>
