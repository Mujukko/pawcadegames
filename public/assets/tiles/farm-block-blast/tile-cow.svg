<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Tile Base Gradient -->
    <linearGradient id="cowTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="cowBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="cowMuzzle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#0c4a6e" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 3D Glossy Tile Base -->
  <rect x="4" y="4" width="120" height="120" rx="22" fill="url(#cowTileBg)" stroke="#bae6fd" stroke-width="2.5" filter="url(#tileShadow)" />
  <rect x="7" y="7" width="114" height="40" rx="18" fill="url(#cowBevel)" />

  <!-- Cow Character (Bessie) -->
  <g transform="translate(14, 16)">
    <!-- Small Rounded Horns -->
    <path d="M 28 20 C 22 10 32 4 36 14 Z" fill="url(#hornGrad)" stroke="#854d0e" stroke-width="1.5" />
    <path d="M 72 20 C 78 10 68 4 64 14 Z" fill="url(#hornGrad)" stroke="#854d0e" stroke-width="1.5" />

    <!-- Cow Ears (Side) -->
    <ellipse cx="14" cy="36" rx="14" ry="7" transform="rotate(-20 14 36)" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    <ellipse cx="14" cy="36" rx="9" ry="4" transform="rotate(-20 14 36)" fill="#fbcfe8" />

    <ellipse cx="86" cy="36" rx="14" ry="7" transform="rotate(20 86 36)" fill="#0f172a" stroke="#0f172a" stroke-width="1.8" />
    <ellipse cx="86" cy="36" rx="9" ry="4" transform="rotate(20 86 36)" fill="#fbcfe8" />

    <!-- Head Base (White) -->
    <ellipse cx="50" cy="48" rx="36" ry="32" fill="#ffffff" stroke="#334155" stroke-width="2" />

    <!-- Black Cow Patch (Right Eye / Forehead) -->
    <path d="M 50 18 Q 78 20 84 44 C 84 56 68 56 64 42 Q 58 32 50 18 Z" fill="#0f172a" />

    <!-- Big Friendly Eyes -->
    <circle cx="33" cy="40" r="7" fill="#1c1917" />
    <circle cx="31" cy="37.5" r="2.8" fill="#ffffff" />
    <circle cx="35" cy="42" r="1.2" fill="#ffffff" />

    <circle cx="67" cy="40" r="7" fill="#ffffff" />
    <circle cx="67" cy="40" r="5" fill="#1c1917" />
    <circle cx="65" cy="37.5" r="2.5" fill="#ffffff" />

    <!-- Soft Pink Muzzle -->
    <ellipse cx="50" cy="58" rx="24" ry="16" fill="url(#cowMuzzle)" stroke="#f472b6" stroke-width="1.8" />
    <!-- Nostrils -->
    <ellipse cx="40" cy="57" rx="3.5" ry="4.5" fill="#881337" />
    <ellipse cx="60" cy="57" rx="3.5" ry="4.5" fill="#881337" />

    <!-- Smiling Mouth -->
    <path d="M 44 65 Q 50 70 56 65" stroke="#881337" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Golden Cowbell -->
    <polygon points="46,75 54,75 56,83 44,83" fill="#eab308" stroke="#a16207" stroke-width="1.5" />
    <circle cx="50" cy="83" r="2" fill="#713f12" />
  </g>
</svg>
