<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Tile Base Gradient -->
    <linearGradient id="sheepTileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="sheepBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 3D Glossy Tile Base -->
  <rect x="4" y="4" width="120" height="120" rx="22" fill="url(#sheepTileBg)" stroke="#a7f3d0" stroke-width="2.5" filter="url(#tileShadow)" />
  <rect x="7" y="7" width="114" height="40" rx="18" fill="url(#sheepBevel)" />

  <!-- Sheep Character -->
  <g transform="translate(14, 16)">
    <!-- Fluffy Wool Cloud Backing -->
    <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="2">
      <circle cx="20" cy="30" r="14" />
      <circle cx="36" cy="18" r="14" />
      <circle cx="50" cy="14" r="15" />
      <circle cx="64" cy="18" r="14" />
      <circle cx="80" cy="30" r="14" />
      <circle cx="84" cy="46" r="13" />
      <circle cx="16" cy="46" r="13" />
    </g>

    <!-- Side Droopy Ears -->
    <ellipse cx="14" cy="42" rx="13" ry="6" transform="rotate(-30 14 42)" fill="#fed7aa" stroke="#c2410c" stroke-width="1.8" />
    <ellipse cx="86" cy="42" rx="13" ry="6" transform="rotate(30 86 42)" fill="#fed7aa" stroke="#c2410c" stroke-width="1.8" />

    <!-- Cute Sheep Face (Soft Peach) -->
    <ellipse cx="50" cy="50" rx="26" ry="24" fill="#ffedd5" stroke="#ea580c" stroke-width="2" />

    <!-- Curly Wool Bangs on Forehead -->
    <circle cx="42" cy="30" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="50" cy="27" r="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="58" cy="30" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Big Sparkly Eyes -->
    <circle cx="39" cy="46" r="5.5" fill="#1c1917" />
    <circle cx="37.5" cy="44" r="2.2" fill="#ffffff" />

    <circle cx="61" cy="46" r="5.5" fill="#1c1917" />
    <circle cx="59.5" cy="44" r="2.2" fill="#ffffff" />

    <!-- Rosy Cheek Blushes -->
    <circle cx="30" cy="54" r="4.5" fill="#f43f5e" opacity="0.3" />
    <circle cx="70" cy="54" r="4.5" fill="#f43f5e" opacity="0.3" />

    <!-- Cute Y-Shaped Sheep Nose & Mouth -->
    <path d="M 47 55 L 50 58 L 53 55" stroke="#c2410c" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 50 58 L 50 63" stroke="#c2410c" stroke-width="2" stroke-linecap="round" />
    <path d="M 45 64 Q 50 68 55 64" stroke="#c2410c" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>
