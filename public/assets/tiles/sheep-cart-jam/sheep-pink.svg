<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="woolPink" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="45%" stop-color="#f472b6" />
      <stop offset="85%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#be185d" />
    </radialGradient>
    <filter id="sheepShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#831843" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#sheepShadow)">
    <!-- Fluffy Wool Cloud Silhouette -->
    <g fill="url(#woolPink)" stroke="#9d174d" stroke-width="2">
      <circle cx="24" cy="38" r="14" />
      <circle cx="36" cy="24" r="15" />
      <circle cx="50" cy="19" r="16" />
      <circle cx="64" cy="24" r="15" />
      <circle cx="76" cy="38" r="14" />
      <circle cx="80" cy="54" r="13" />
      <circle cx="72" cy="70" r="13" />
      <circle cx="50" cy="74" r="14" />
      <circle cx="28" cy="70" r="13" />
      <circle cx="20" cy="54" r="13" />
    </g>

    <!-- Side Droopy Ears -->
    <g>
      <!-- Left Ear -->
      <ellipse cx="20" cy="48" rx="12" ry="6" transform="rotate(-30 20 48)" fill="#fed7aa" stroke="#c2410c" stroke-width="1.8" />
      <ellipse cx="20" cy="48" rx="7" ry="3.2" transform="rotate(-30 20 48)" fill="#f43f5e" opacity="0.65" />
      <!-- Right Ear -->
      <ellipse cx="80" cy="48" rx="12" ry="6" transform="rotate(30 80 48)" fill="#fed7aa" stroke="#c2410c" stroke-width="1.8" />
      <ellipse cx="80" cy="48" rx="7" ry="3.2" transform="rotate(30 80 48)" fill="#f43f5e" opacity="0.65" />
    </g>

    <!-- Chubby Baby Sheep Face -->
    <ellipse cx="50" cy="53" rx="24" ry="21" fill="#fff1f2" stroke="#db2777" stroke-width="2" />

    <!-- Cute Fluffy Forehead Curls -->
    <g fill="url(#woolPink)" stroke="#9d174d" stroke-width="1.5">
      <circle cx="42" cy="35" r="7.5" />
      <circle cx="50" cy="32" r="8.5" />
      <circle cx="58" cy="35" r="7.5" />
    </g>

    <!-- Sparkly Anime Eyes -->
    <g fill="#1e293b">
      <!-- Left Eye -->
      <ellipse cx="40" cy="50" rx="4.5" ry="5" />
      <circle cx="38.5" cy="48" r="1.8" fill="#ffffff" />
      <circle cx="41.5" cy="52" r="0.8" fill="#ffffff" />
      <!-- Right Eye -->
      <ellipse cx="60" cy="50" rx="4.5" ry="5" />
      <circle cx="58.5" cy="48" r="1.8" fill="#ffffff" />
      <circle cx="61.5" cy="52" r="0.8" fill="#ffffff" />
    </g>

    <!-- Rosy Cheek Blushes -->
    <ellipse cx="32" cy="57" rx="4.5" ry="3" fill="#fb7185" opacity="0.45" />
    <ellipse cx="68" cy="57" rx="4.5" ry="3" fill="#fb7185" opacity="0.45" />

    <!-- Cute Smiling Y-Mouth -->
    <path d="M 47 56 L 50 59 L 53 56" stroke="#db2777" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M 50 59 L 50 63" stroke="#db2777" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 45 63 Q 50 68 55 63" stroke="#db2777" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Cute Blossom Flower Accent -->
    <g transform="translate(26, 22)">
      <circle cx="-3" cy="0" r="3" fill="#ffffff" />
      <circle cx="3" cy="0" r="3" fill="#ffffff" />
      <circle cx="0" cy="-3" r="3" fill="#ffffff" />
      <circle cx="0" cy="3" r="3" fill="#ffffff" />
      <circle cx="0" cy="0" r="2.2" fill="#facc15" />
    </g>
  </g>
</svg>
