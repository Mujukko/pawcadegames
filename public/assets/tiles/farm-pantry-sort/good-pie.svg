<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="pieCrust" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <filter id="pieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#78350f" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#pieShadow)">
    <!-- Pie Tin Base -->
    <ellipse cx="50" cy="74" rx="34" ry="10" fill="#94a3b8" stroke="#475569" stroke-width="2" />
    <path d="M 16 60 L 22 74 Q 50 84 78 74 L 84 60 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2" />

    <!-- Fluted Golden Crust Rim -->
    <ellipse cx="50" cy="58" rx="36" ry="14" fill="#d97706" stroke="#92400e" stroke-width="2" />
    <!-- Fluted Crimp Dots -->
    <circle cx="18" cy="58" r="3" fill="#f59e0b" />
    <circle cx="26" cy="64" r="3" fill="#f59e0b" />
    <circle cx="38" cy="68" r="3" fill="#f59e0b" />
    <circle cx="50" cy="70" r="3" fill="#f59e0b" />
    <circle cx="62" cy="68" r="3" fill="#f59e0b" />
    <circle cx="74" cy="64" r="3" fill="#f59e0b" />
    <circle cx="82" cy="58" r="3" fill="#f59e0b" />

    <!-- Apple Pie Filling & Lattice Crust Dome -->
    <ellipse cx="50" cy="54" rx="30" ry="12" fill="#ea580c" />
    <!-- Lattice Strips -->
    <path d="M 30 50 Q 50 62 70 50" stroke="#fef08a" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 26 56 Q 50 68 74 56" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 40 46 Q 44 60 48 64" stroke="#fef08a" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 52 46 Q 56 60 60 64" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Swirling Aroma / Steam -->
    <path d="M 46 38 Q 42 32 46 26" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 54 36 Q 58 30 54 24" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
</svg>
