<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="milkWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="milkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0369a1" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#milkShadow)">
    <!-- Glass Bottle Contour -->
    <!-- Base & Body -->
    <rect x="30" y="38" width="40" height="48" rx="8" fill="url(#milkWhite)" stroke="#0284c7" stroke-width="2.5" />
    <!-- Tapered Neck -->
    <path d="M 36 38 L 40 22 L 60 22 L 64 38 Z" fill="url(#milkWhite)" stroke="#0284c7" stroke-width="2.5" />
    <!-- Bottle Opening & Cap -->
    <rect x="38" y="16" width="24" height="8" rx="3" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />
    <rect x="40" y="14" width="20" height="3" rx="1.5" fill="#38bdf8" />

    <!-- Blue Dairy Ribbon Label with Cow Silhouette -->
    <rect x="32" y="48" width="36" height="22" rx="3" fill="#0284c7" />
    <circle cx="50" cy="59" r="7.5" fill="#ffffff" />
    <!-- Mini Cow Spot / Face -->
    <ellipse cx="50" cy="60" rx="5" ry="4" fill="#0f172a" />
    <circle cx="48" cy="59" r="1" fill="#ffffff" />
    <circle cx="52" cy="59" r="1" fill="#ffffff" />
    <ellipse cx="50" cy="62" rx="3" ry="1.5" fill="#fb7185" />

    <!-- Glass Specular Highlight -->
    <path d="M 33 42 L 33 80" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
