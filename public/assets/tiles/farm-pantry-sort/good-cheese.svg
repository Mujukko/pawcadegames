<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="cheeseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#a16207" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#cheeseShadow)">
    <!-- 3D Triangular Swiss Cheese Wedge -->
    <!-- Top Slanted Face -->
    <path d="M 22 52 L 78 28 L 62 48 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
    <!-- Front Face -->
    <path d="M 22 52 L 62 48 L 62 76 L 22 76 Z" fill="url(#cheeseGrad)" stroke="#ca8a04" stroke-width="2" />
    <!-- Side Slanted Face -->
    <path d="M 62 48 L 78 28 L 78 56 L 62 76 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2" />

    <!-- Round Cheese Holes (Front Face) -->
    <ellipse cx="36" cy="62" rx="4.5" ry="5.5" fill="#ca8a04" />
    <ellipse cx="37" cy="63" rx="3.5" ry="4.5" fill="#a16207" />

    <ellipse cx="50" cy="56" rx="3" ry="3.5" fill="#ca8a04" />
    <ellipse cx="51" cy="57" rx="2.2" ry="2.8" fill="#a16207" />

    <ellipse cx="48" cy="70" rx="3.5" ry="4" fill="#ca8a04" />
    <ellipse cx="49" cy="71" rx="2.5" ry="3" fill="#a16207" />

    <!-- Cheese Hole on Top Face -->
    <ellipse cx="48" cy="46" rx="4.5" ry="2" fill="#ca8a04" />
    <!-- Cheese Hole on Right Face -->
    <ellipse cx="70" cy="46" rx="3" ry="4.5" fill="#a16207" />

    <!-- Cute Mouse Bite Indentation -->
    <path d="M 22 66 Q 26 69 22 72 Z" fill="#a16207" />
  </g>
</svg>
