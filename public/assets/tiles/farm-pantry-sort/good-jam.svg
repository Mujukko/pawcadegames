<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="jamRed" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="30%" stop-color="#f43f5e" />
      <stop offset="80%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </radialGradient>
    <filter id="jamShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#881337" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#jamShadow)">
    <!-- Round Glass Preserves Jar -->
    <rect x="25" y="34" width="50" height="50" rx="16" fill="#ffffff" fill-opacity="0.25" stroke="#be123c" stroke-width="2.5" />
    <!-- Ruby Strawberry Jam Inside -->
    <rect x="28" y="42" width="44" height="38" rx="12" fill="url(#jamRed)" />

    <!-- Specular Arc -->
    <path d="M 32 46 Q 32 70 34 74" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />

    <!-- Kraft Label with Strawberry -->
    <rect x="36" y="52" width="28" height="20" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" />
    <!-- Strawberry Icon -->
    <path d="M 50 67 C 43 64 44 56 50 56 C 56 56 57 64 50 67 Z" fill="#e11d48" />
    <!-- Green Leaf on Strawberry -->
    <path d="M 47 55 C 50 53 53 55 50 56 Z" fill="#22c55e" />

    <!-- Red Checkered Gingham Fabric Lid -->
    <ellipse cx="50" cy="28" rx="24" ry="10" fill="#f43f5e" stroke="#9f1239" stroke-width="2" />
    <!-- Checkered Stripes -->
    <path d="M 32 28 C 44 32 56 32 68 28" stroke="#ffffff" stroke-width="2" opacity="0.6" fill="none" />
    <path d="M 42 22 L 42 34 M 50 20 L 50 36 M 58 22 L 58 34" stroke="#ffffff" stroke-width="1.8" opacity="0.6" />
    <!-- Ruffled Scallop Rim -->
    <path d="M 26 31 Q 30 36 34 31 Q 38 36 42 31 Q 46 36 50 31 Q 54 36 58 31 Q 62 36 66 31 Q 70 36 74 31" fill="none" stroke="#9f1239" stroke-width="1.8" />
    <!-- Twine Bow -->
    <circle cx="50" cy="33" r="2.5" fill="#facc15" stroke="#a16207" stroke-width="1" />
  </g>
</svg>
