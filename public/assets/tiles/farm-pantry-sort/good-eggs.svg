<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="eggTan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="60%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="eggShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#78350f" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#eggShadow)">
    <!-- 3 Fresh Speckled Eggs Resting in Carton -->
    <!-- Left Egg -->
    <ellipse cx="34" cy="46" rx="12" ry="16" fill="url(#eggTan)" stroke="#d97706" stroke-width="2" transform="rotate(-10 34 46)" />
    <circle cx="30" cy="42" r="1" fill="#b45309" opacity="0.6" />
    <circle cx="36" cy="48" r="1.2" fill="#b45309" opacity="0.6" />
    <path d="M 30 38 Q 30 46 32 50" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Right Egg -->
    <ellipse cx="66" cy="46" rx="12" ry="16" fill="url(#eggTan)" stroke="#d97706" stroke-width="2" transform="rotate(10 66 46)" />
    <circle cx="68" cy="44" r="1.2" fill="#b45309" opacity="0.6" />
    <circle cx="63" cy="50" r="1" fill="#b45309" opacity="0.6" />
    <path d="M 68 38 Q 68 46 66 50" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Center Egg (Front & Center) -->
    <ellipse cx="50" cy="44" rx="13" ry="17" fill="url(#eggTan)" stroke="#d97706" stroke-width="2.2" />
    <circle cx="48" cy="42" r="1" fill="#b45309" opacity="0.6" />
    <circle cx="53" cy="46" r="1.2" fill="#b45309" opacity="0.6" />
    <path d="M 46 36 Q 46 44 48 48" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Rustic Wooden Carton / Basket Bed -->
    <path d="M 18 56 L 24 82 L 76 82 L 82 56 Z" fill="#92400e" stroke="#78350f" stroke-width="2.5" />
    <!-- Straw Fill -->
    <path d="M 18 56 Q 34 50 50 56 Q 66 50 82 56 L 80 62 L 20 62 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
    <!-- Carton Planks -->
    <line x1="22" y1="68" x2="78" y2="68" stroke="#78350f" stroke-width="1.8" />
    <line x1="23" y1="75" x2="77" y2="75" stroke="#78350f" stroke-width="1.8" />
  </g>
</svg>
